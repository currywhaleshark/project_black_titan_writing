external_conditions:
  network:
    - "**인터넷 소실 — 청해 내부망만.** `인터넷` 금지"
  public:
    - "**외신 한 줄(센티널 사다리 1단·46):** 내부망 뉴스 구석 — 먼 항만 도시의 부두 하나가 사흘째 통제, 이유 비공개(정기 점검이라고만). 두 문장·주목 0"
  sea:
    - "**교전 중 — 방재벽 외곽 수몰 구시가지(옛 아파트 단지).** 전장 정본: 수심 = 기체 허벅지(상반신 노출·수중전 아님), 아래 대여섯 층 침수 + 물 위로 열몇~스물몇 층 노출, 무인"
    - "**엄폐 자원 전량 소진(45)** — 물 위로 남아 있던 다섯 채가 모두 낮아짐. 이 전장 재사용 시 엄폐 0에서 시작. 동 사이 = 기체 보폭 네 걸음"
    - "여름 스콜 1회(교전 중반 개시 → 격파 직후 잦아듦)"
    - "수몰 화물부두 = 잔존물 정리 대상(폐건물·전도 크레인) 유지"
  military:
    - "**행동 양상 변화 첫 기재(46): `접촉 시도` → `원거리 공격 확인`.** 설명은 정황까지만(판단 배제). `민간 목격 신고 다수 — 발광 및 소음. 형체 확인 없음.` 기재. `미식별 검은 거인` 표기·미확인 3항목 유지"
  enemy:
    - "**신규 개체 교전 중(47):** 넓적하고 낮은 몸통(기체 허리께)·**몸통만 한 집게 한쪽**·작은 집게 하나(**한 번도 움직이지 않음**)·다리 여덟. 옆으로 이동하며 갯벌에서 안 빠짐. 큰 집게로 치기·막기·밀기·휘두르기·찌르기 — **느림**. 숨지 않고 개활지에서 기다림"
    - "**격파 완료(45).** 개수된 개체 = 용해·수거물 0. 지면 확정 사항: 원거리 사격·거리 유지·작살형 끝·**던진 물체에 흔들림**(조준 교란)"
    - "**개수의 물증 확정:** 봄 조각 실물 + 오늘 화면 대조 → `같은 데서 나왔는데 가시만 나중에 바뀌었다`(주체·이유 0)"
    - "**의도 전환의 지면 증거 유지:** 붙잡지 않고 겨눠서 쏜다(작가용 = 회수 → 파괴 전환. 원리 서술 0). 다음 개체 = 농게형(S8 후반)"

