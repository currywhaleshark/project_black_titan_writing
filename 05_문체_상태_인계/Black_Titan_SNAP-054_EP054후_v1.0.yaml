    state_notes:
      - "**하부 점검 완료(46 — 영진과 동행·EP28 조건 1 이행).** 발바닥 이물 = 미처리로 남김. 대조 그림 한 장을 통 옆에 배치(공책 본문은 비공개 유지)"
      - "**기록 체계 4분할(50):** 점검표 한 장 → **넉 장**(기체 = 자국·세척·저항값 / 개체 = 생김새·행동 / 관측 = 부표 번호·시각 / 집안일 = 접수·수리비). 원칙 2호 = `안 보이는 기록은 없는 기록이나 마찬가지`"
      - "**빈 칸 예약(50):** 개체 표 아래 제목만 있고 안은 빈 칸(`아직 없어.` / `생길 것 같아서.`) + 줄 두 개 = 여러 번 적을 자리. **무엇을 예상하는지는 말하지 않음**"
      - "**관측 표 첫 실전 기입(51):** 6/18 밤 시각 + 부표 번호. **정체 칸은 공란 유지**"
