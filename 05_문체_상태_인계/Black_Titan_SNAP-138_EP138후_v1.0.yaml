arc_note: "**S14 18/24 · ★★★★★★ 6-5 「조건」 마감 완료**(EP129~138 · 10화 · 10/3~10/20). **조건 넷이 붙고 지켜지는데 안 굴러갔고, 마지막에 남은 건 몸 하나다 — 열 번에 다섯 번.** 다음 = **6-6 「앞에 선다」 EP139~144**(10/26~27). EP139 = **루시 카버**(10/26 수) — 계산이 나온다 · **XLG-5 유선 사거리 밖이라 몰아넣어야 한다** · 몰이 탄착군이 **피난구역을 덮는다**. **★ 10/21~10/25 = 기체 복구 구간**(지면 공백)."
