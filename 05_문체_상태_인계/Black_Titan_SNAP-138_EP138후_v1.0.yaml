approval_note: "EP138 「같이 못 간다」 GATE_D_PASS. **★★★★★★ 6-5 「조건」 마감 10/10**. 10/20 목 · 수아 시점 · 전투 0. **★★★★★★ 조건이 준 것과 안 준 것이 같은 날 나온다.** 수아 퇴원 · 영진 불구속 송치 · **보호자 칸이 채워진다**(도영진 — 데려오는 사람 칸에도 같은 이름). **★★★ 8/31 이후 처음 셋이 한자리.** 첫 물음이 **`일찍 일어났어?`** — EP100에서 수아가 마지막으로 적은 게 **8월 31일 8시 50분**이고 **그 여섯 줄이 지금 마루 상 위에 있다.** 대답은 **`여섯 시 반.`** 판정은 안 한다. **★★★★★★ 안경이 고쳐진다 — 셋이서.** 단아가 알 쪽을 두 손으로 잡고(**`단아 손이 받침이 됐다`** — EP132 「받침이 왼손 노릇을 했다」의 사람 판본), 영진이 오른손으로 누르고, 수아가 각도를 말한다. **정리 문장 0.** 단아가 **`…고마워.`** — 그 집에서는 안 하던 것. **★★★★★ 영진은 미안하다고 안 한다** — **`하면 그걸로 끝나니까`** · `안 하면 불편한 채 안 끝난다`. **★★★ 아주머니가 오늘로 끝난다** — 이름은 끝내 안 나온다 · `건강해.` · **`수아는 고개를 숙였다. 지금 몸으로는 허리를 숙여 인사하는 것도 불편하다는 걸 이제야 알았다.`** **★★★★★★ 그리고 차가 두 대다.** `오늘 채워진 게 둘이다. 오늘 만난 게 둘이다. **오늘 같이 가는 게 하나다.**` · `같이 살면 같이 가는 거고, 같이 가면 같이 사는 거였다. 여름에는 그게 하나였다.` **★★★★★★ 마감 — `적을 게 하나 생겼는데, 적을 사람이 옆에 없었다.`**"
canon_version: "**G0-025 단아 처분 상태·영진 불구속 송치**(2026-08-26) / 통합설정집 v2.3(+v2.4 증보) / 전체 플롯 v2.2 / 여름 L3 골격 v1.1 / S8 화별개요 v1.0"
