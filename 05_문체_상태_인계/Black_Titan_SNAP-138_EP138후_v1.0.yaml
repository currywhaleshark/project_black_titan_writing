      symptoms: ["시력 저하·둥근 안경(기준선)", "**★ 첫 증상(63·7/1):** 100미터 중반에 **순간 아찔** 1회. 반 걸음 어긋남. 넘어짐·정지 0. **본인이 더위로 정리했다.** 병명·검사·가족 보고 0. **목격 = 성호 하나**", "**★ 산발 ①(66·7/9):** 귀환 후 저녁 **열.** 미열~보통 · 눕지 않음. **여름감기로 본인이 정리했다**(물에 세 시간·땀). 수아가 이마를 짚고 찬물을 놓고 감. **EP63과 연결 0**", "**★ 산발 후(67·7/11):** 열이 내렸다. **증상 0.** 목·열 모두 정상. **여름감기로 본인 정리가 완성됐다**(`이틀 자고 나으면 감기다`). **지나가면 없던 일이 된다 — 산발의 함정**", "**★ 산발 ②(69·7/14):** 쉬는 시간 **왼손 연필 낙하.** 잡았다고 생각했는데 안 잡혀 있었다. 몇 초 뒤 정상 — `방금 것만 이상했다`. **본인 정리: 잠을 못 자서.** **목격 = 최나래 하나**(아무 말 없이 주움). **EP63·66과 연결 0**", "**★★ 해금(70·7/16):** 가슴 정타. **`울린다, 라고 부르려던 것이 부르기 전에 끝나지 않았다. / 아팠다.`** **위치는 원래 오던 것**(포스 피드백 정본) — **세기가 감쇠를 넘었다.** 귀환길에도 안 없어짐 · 숨 쉬면 따라 움직임 · **`……아프잖아.` = 입 밖으로 나온 첫 번째.** **EP32 혜정의 규칙을 8개월 만에 지키는데 듣는 사람이 없다.** 십여 대 피격(지난달 두세 대)", "**★★ 지속(71·7/16 밤~7/17 아침):** **날짜를 넘겼다.** 전투 종료로 안 끝난다 — `전투는 어제였다. 어제 것이 오늘까지 온 적은 없었다`. 삼킬 때 알려 옴 · 반듯이 누우면 가슴이 따라옴 · 숨 크게 쉬면 **거기가 대답** · 등 대면 **거기가 먼저 앎** · **밖에서 안 만져지고 거울에 안 보임**(멍 0) · 일어나는 데 **순서 필요** · 그릇 두 손 · **본인 정리 없음** — 처음으로 설명이 안 붙는다", "**★★ 연속화(72·7/17):** **넷이 한 날에 겹쳤다** — 가슴 것 · **미열 37.4** · **왼손 저림 3회**(오전·오후·네 시, 세 번째는 아무것도 안 하는데) · **저녁 시야 흐림 1회**(몇 초). **★ 전부 따로따로 설명이 된다**(맞아서·여름감기·무리·잠). **겹쳐 보는 사람 0.** **★★ 본인도 비교 대상이 없다 — 아파 본 적이 없어서 이게 그건지 댈 데가 없다.** 본인 마감: **내일 아침에 안 나았으면 감기가 아니다**", "**★ 마감 판정(73·7/18 아침):** **안 나았다.** `이틀을 잤다. (…) 확실해진 것은 나은 게 아니라는 쪽이었다.` **감기가 아니면 뭔지로 못 넘어간다 — 부표가 먼저 울었다.** **전투 중 페널티:** 고정띠 버클에서 왼손 미끄러짐 · **앵커 조작 반 박자 지연 2회** · **조준 중 시야 흐림 1회** · 얕은 숨 · 돌기 느림. **★★ 근접 기피 발생** — `가까이 가서 끝내는 그림이 먼저 그려졌다. 그려지는데 가슴이 싫다고 했다` · **`아는 몸은 처음이었다`**", "**★ 이월(74·7/19):** **나은 것도 더한 것도 없이 그대로.** 새 증상 0. **아침 확인이 순서에 들어갔다** — `순서에 들어갔다는 게 제일 안 좋은 신호`. **아픈 채로 등교**(이틀 빠지면 무슨 일 있냐가 된다) · 언덕이 길다 · 가방이 무겁다", "**★ 나흘째(75·7/21):** 그대로. **아침 확인을 이제 세지도 않는다.** 밥상은 밥으로 복귀(나흘 만 — 끓이는 쪽의 셈). **말할 자리가 없는 곳 넷** — 집(미답)·학교(감기 처리)·혜정(화요일이 딸려 나옴)·**정호의 관찰**(어떻게 아느냐). **`누구도 안 물어서 못 하는 게 아니었다. 물어 줬는데 못 하는 것이었다`**", "**★★ 이레째(76·7/22):** 그대로. **웃음을 반으로 접는 요령이 생겼다**(소리는 끝까지, 숨만 얕게 — 아무도 못 봄). **`웃는 것에도 요령이 생겼다는 게 제일 이상한 일이었다`**. 자기 방학의 모양이 **자는 것 말고는 안 그려진다** — `자고 나면 나을 것이고, 나으면 그때부터 그리면 될 것이었다`. **★ 방학 = 아무도 안 물어보는 40일**(편할 거라 생각했고, 그게 제일 안 좋은 생각이었다 — EP75)", "**★★ 여드레째·비탑승 닷새(77·7/23): 조금 낫다.** 셀 수 있는 회복 — 국 없이 밥 · 방에서 마루까지가 가깝다. **해석(본인·집): 잠과 방학.** **★ 작가용 봉인: 실인 = 비탑승 닷새 — 지면 설명 0**(EP78~79에서 독자만 거꾸로 읽음). **★★ 그런데 안 놓인다** — `조용한 게 좋은 건데, 좋다는 생각이 잘 안 됐다` · **부표 소리를 기다리는 몸** · `쉬는 날을 받으면서 이자가 붙는 기분`", "**★★ 훈련 후 뻗음(78·7/25):** 3단계 훈련(제자리→앵커→**갯가재전 재현**) · `한 세트 더` ×3 · **땀 한 바가지**(체육복 물증). 귀환 직후 개운 → **저녁 급락**(숟가락 느려짐 · 무릎 접힘 · 저녁 반도 못 먹고 잠) · **흔들어도 반응이 한 박자 늦음**(수아 목격). **★★★ 「무리했다」 합의 — 실인은 탑승 누적(지면 0).** 영진 `내가 늦게 끊었다` / 수아 `원래 한 세트 더 하는 사람`(+정리에 안 들어가고 남은 것) / 단아 몫은 EP79 이월. **혜정 부재중 1통**(못 받은 쪽 = 안 끊겠다던 쪽)", "**★★ 이틀째 무회복(79·7/26):** 열두 시간 넘게 자고도 어제보다 안 나음. **접수대까지 못 감**(자리가 영진에게 되돌아감) · 마루~방에 숨이 붙음 · 물 두 손으로 · **앉은 채 두 번 졸음(자도 안 잔 것 같은 잠)** · 기억 뭉개짐(잠들기 전 30분). **★ 열·기침·콧물 0 — 감기 표시 하나 없이 감기보다 안 움직임**(수아 관찰). **★★ 「무리」 설명 붕괴 시작:** `무리했으면 오늘쯤은 나아져야 하는 거 아닌가` → **도로 눕힘**(`하루 더 자면`) · **입 밖 0**", "**★★ 사흘째 바닥(80·7/27):** 어제보다 낫지도 나쁘지도 않음 — **상태가 바닥에 붙음.** 일어나 앉는 데 **중간에 한 번 쉬는 동작**이 끼어듦 · 마루 왕복이 하루 최대 이동 · 저녁도 반쯤(사흘 연속). **★ 출격 정지 대상이 됨** — `몸이 그런데 태울 수는 없다`. **반발 2합 후 힘이 없어 종료**(`나 괜찮아`의 목소리가 반대 증거) · **어느 쪽으로 말해도 자기 편이 아님**", "**★★★ 기립 불가(81·7/28):** 경보를 듣고도 **몸이 순서를 시작하지 못함** — 일어나 앉기 다음이 없음. `일어나지지 않는 몸으로는 반박이 안 됐다`. 벽 짚고 지하까지 시간 소요 → **모니터 앞이 단아의 전장.** **★ 정지가 첫날부터 시험당했고 몸이 정지를 증명함**(나가려는 의지와 무관)", "**★ 무전투일 회복(82·7/29):** 나가지 않는 날이 이어지면 몸이 나아진다 — 어제보다·그제보다 나음. **★★ 「괜찮다」의 뜻이 바뀜** — `괜찮은 게 좋은 일이 아닌 상태가 있다는 걸 지금 알았다`. **나가지 않아서 나아지는 몸의 괜찮음.** 잠은 오래 자는데 깊이 안 잠(얕은 잠) · 승강기에서 숨 한 번 참", "**★★ 회복 정점(83·8/3):** 나흘 압축으로 가시적 회복 — 부엌 왕복 · 접수 복귀 · 밥 한 그릇 · **아침 확인을 다시 세기 시작**(세는 게 신호). **국그릇 순서가 도로 단아 먼저로.** 혜정: `물에 만 목소리`가 돌아옴. **작가용: 비탑승 누적**(마지막 탑승 7/25 훈련 · 지면 해석 = 쉬어서·여름감기가 지나가서). **★ 복귀전 수행** — 피탄 1회는 충격만(통증 재점화 0) · 하선 후 **개운함**(EP78 문장 계열 의도 재사용 — `좋은 감각에 출처를 묻는 사람은 없었다`)", "**★★★ 재이탈(84·8/4~5):** 8/4 아침 멀쩡 → **점심부터 기움**(숟가락 곡선 3연째) → 오후 낮잠 뒤 **더 나빠짐** → 8/5 통째로 앓아누움. **7/29 자리로 정확히 복귀.** 마루 왕복 열두 걸음이 하루 최대 거리. **★★ 설명 후보 전량 소거 → 빈손**(무리 안 함 · 열 없음 · 잘 잠 · 더위 아님 · 음식 아님). **★★★ `이유가 없으면 대책도 없었다` — 아무것도 할 게 없는 상태.** 개운함이 걸린다(`개운했다가 그냥 무너지는 것`)", "**★★ 엿새째 침상(85·8/8):** 8/3 복귀전 후 이틀 만에 재이탈(8/5)~사흘째. 경보에 **몸을 일으키려는 시도조차 실패**(팔꿈치까지). **「내가 갈게」가 성립하지 않는 상태.** 모니터까지가 전장. **떡볶이 약속(8/9 화) 불발 확정** — 문자를 미루고 결국 안 보냄. **★ 잘하는 동생을 보는 게 익숙해짐** — `당연한 걸 보는 눈` · 심장이 안 빨라짐", "**★ 8일째 침상(86·8/10):** 마루의 날/방의 날/접수의 날로 하루가 분류됨(오늘은 마루). 옥수수 반 자루. **★★ 떡볶이 불발(8/9)** — 문자 `몸이 좀 안 좋아서`(제일 짧은 진실) → 혜정 **`또?`** + **`나았다며.`** → **답장 못 보냄 이틀째.** **★ 가시 2 발화** — `좋았겠네. 넌 나갔다 올 데라도 있어서` · **`사실이라서 더 안 좋은 말이 됐다`**", "**★★★ 재꺾임 가속(87·8/12):** 복귀전 2 승리 당일 **밤이 오기 전에 붕괴**(이틀 → 반나절 — 곡선 가속 명시 · 세는 사람 둘 다 침묵). **삼킴 중 전신 눌림으로 통증 재점화**(EP70 계보) · 땀 최대치 · 다리 떨림 · 승강기 벽 기댐 · 저녁 못 먹음 · 숨이 다시 얕아짐. **★ 무섭고 화가 났다 — 같이 왔다**(어둠 속의 차가운 머리 동거)", "**★ 무회복 지속(88·8/13):** 어제(8/12) 전투 후 연락 두절 — **문자 읽히지 않음.** 혜정의 관찰 밖에서 계속 앓는 중. **★★ 이 화에서 단아는 지면에 등장하지 않는다**(부재로만 존재 · 혜정 시점)", "**★ 무회복 지속(89·8/14):** 이 화에서도 **단아는 지면에 등장하지 않는다**(EP88에 이어 2회 연속 부재 · 혜정·군 시점). 연락 두절 계속 — 냉장고의 복숭아가 무르는 속도로만 시간이 표시됨", "**★ 회복 국면(90·8/16):** 8/12 붕괴 후 **나흘째** — 앉으면 괜찮고 **계단에서 티가 난다**(올라올 때 한 칸씩 늦음) · 손끝 저림 절반으로 감소. **★★ 나아지는 걸 반가워하게 된 것 자체가 변화**(`봄에는 아침에 몸 상태를 확인하지 않았다`). **★ 지면 복귀**(EP88·89 부재 후) — 순찰차를 보고 **`요즘 세상이 하도 험하니까`로 넘긴다**(두 개를 잇는 선이 머릿속에 없음)", "**★ 출격 가능 국면(91·8/18):** 8/12 붕괴 후 **엿새째** — **내려가는 승강기에서 숨이 한 번 참.** `나갈 만하다는 게 요즘의 기준이었다`. 전투 자체는 격렬한 육박전이 아니라 **지구전+팔 피로**(사슬 회전 5회 이상 · 세 번째부터 팔이 안 올라감). **★★ 이 화의 손상은 몸이 아니라 인식** — 수천을 막고도 **확실한 건 마지막 하나뿐**", "**★★ 예외적 경과(92·8/19):** 붕괴 없음 — **어깨~등만 뻣뻣**(사슬 회전 후유). 일어나 앉기 정상 · 마루까지 안 쉼 · 아침 완식. **★★★ 그래서 더 나쁘다** — `무너질 만큼 안 했는데 못 막았다`. **어제까지는 몸이 문제였고 오늘은 몸이 괜찮은데 못 이긴 것** — 문제의 종류가 바뀜. **★ 고압세척기 총대 실패**(어깨가 받는 자리 = 안 올라가는 자리) → **진행표로 역할 하향**", "**★ 어깨 회복 중(93·8/20):** 어제보다 나음 — 어깨까지는 무리 없고 **그 위에서 걸린다**(걸리는 자리가 어제보다 조금 위). **★★ 총대·큰 렌치 불가 지속** → 진행표 담당 고착. 그릇도 **두 번에 나눠** 옮김. **★★★ 아침 확인 3단계 진입 — 재기는 재는데 아무 데도 안 적는다**(수아 표에도 0 · `안 적으면 아는 사람이 하나가 된다`)", "**★ 지면 미등장(94):** 단아는 **문자로만** 등장. 답장 **`그래 그때 보자`** — **조건어 없이 바로 왔다**(여름 내내 `봐서·아마·될 것 같은데`가 붙던 것과 대비). **★★ 이 답장이 혜정에게 근거 없는 안도를 준다**", "**★★ 출격일 정상(95·8/24):** 팔이 끝까지 올라감 — **나흘 만의 완전 회복.** 전투 중 통증 재점화 **0**(압박·삐걱임은 있었으나 EP70 계보 재발화 없음) · 귀환 후 **개운함**. **★★★ 다음 날 하강(8/25):** 일어나 앉는 데 **순서 필요**(팔월 초에 쓰던 순서 · 이 주 만에 몸이 기억) · 마루까지 걸음 사이가 길어짐 · **다리 반응 지연**. **★★★ 설명 후보 전량 부재** — 무리 0 · 큰 피격 0 · 장시간 0. `잘 싸운 날 나빠지면 잘 싸운 게 아무 상관이 없다는 뜻이 된다` · **★★ 본인 결론: 나가지 않는 것밖에 없다**(그런데 그건 이미 해 봤고, 알고 나서도 나갔다)", "**★ 지면 미등장(96):** 가족 3인 전원 미등장 — **군의 관측 대상으로만 존재.** 8/24 하강(EP95) 이후 8/26까지의 상태는 미기술(EP97에서 이어받음)", "**★★★ 바닥 고착(97·8/28):** 8/25 하강 후 **나흘째 동일** — 일어나 앉는 순서 · **마루까지 열두 걸음**(원래 여덟) · 그릇 두 손 · 저녁 반쯤 · 앉아 있다 잠드는 잠(자도 잔 것 같지 않음). **★★ 나빠지지도 나아지지도 않는다 — 방향이 없다.** 칠월 말(EP79~80) 형태의 재연이고, 그때는 바닥에 붙은 뒤 오래갔다. **★★★ 아침 확인 = 세는 단계로 역행**(EP93 3단계 → 비교 시작). **★ 지하 나흘째 미하강**(점검은 수아가 대신)", "**★★★ 바닥 닷새째(98·8/29):** 기상 시각 **10시 안팎으로 고정**(25일 10:10 · 26일 10:00 · 27일 10:20 · 28일 10:05 · 29일 10:15). **방학 시작 때는 8시.** **★★ 늦음이 아니라 편차 없음이 이상 신호** — `늦잠이면 이렇게 안 나온다`. **★★★ 8월 24일 = 마지막으로 잘 일어난 날**(기록 없음 — 적을 이유가 없어서). **★ 개학 첫날 등교 가능성에 처음으로 의문**(10시 15분에 일어나서는 언덕을 못 올라간다)", "**★★★ 회복 국면 진입(99·8/30):** 엿새 만에 **9시 기상**(전일 10:15) · 마루까지 **열 걸음** · 기상 순서 한 단계 감소 · **저녁 완식**. 손끝 저림·등 뻣뻣함은 잔존. **★★ 본인 판정 = 「나은 게 아니라 덜 나쁘다」**(8/3 전례를 떠올렸으나 오래 두지 않음). **★★★ 이 회복이 8/31 출격 논의의 조건이 된다** — 아예 못 나갈 정도가 아니게 됐다", "**★★ 이틀 연속 회복(100·8/31):** **8시 50분 기상**(전일 9시) · 마루까지 **아홉 걸음**(원래 여덟 · 한 걸음 남음) · 기상 순서 추가 단축. 손끝 저림·오래 서 있을 때 티는 잔존 — **완전하지 않다.** **★★★ 나갈 수 있는 상태였다** — 나갔으면 다음 날 못 일어났겠지만 **감수하면 나갈 수는 있었다**(본인 판정). **그래서 안 나간 것이 선택이 된다**", "**★ 관측석(101·8/31 오후):** 몸 상태 서술 0 — 앉아서 화면만 본다. **관측석 화면은 둘**(조종석 시야 + 기체 상태 · **밖에서 찍는 데 없음**). **★★ 손상은 몸이 아니라 인식** — 동생의 회전이 자기 것보다 낫다는 것을 **간격을 세어서** 확인했다(셀 줄 아는 것은 자기가 돌려 봤기 때문). **★★★ 안도 → 속이 안 좋음 순서 · 발화 0**", "**★ 관측석(102·8/31 오후):** 몸 상태 서술 0. **끝났다는 말에 숨을 놓은 직후 걸음이 멈춘다** — **화면이 한 번 크게 흔들리고 안 움직임.** 그 흔들림을 **봤지만 뭔지 모른다**(`걷다가 뭘 밟아도 화면은 흔들렸다`). **★★★ 밖에서 찍는 데가 없어 답이 나올 데가 없다** — 일어서 봐야 화면이 안 달라지는데 일어섰다. **★★ 동생이 보는 것을 자기도 보는데 둘 다 모른다** · **발화 = 이름 한 번**", "**★★★ 해체(103·8/31 저녁):** 몸 상태 서술 0 — 이 화에서 단아의 몸은 한 번도 안 나온다. **아침에 신은 신발로 마루·지하·현장까지.** 발이 시렸다는 것만. **★★ 보호 조치 대상**(6학년 · 보호자 없음) → **시설.** 수아가 어느 병원인지 모르고, 영진이 어디로 가는지도 모른다", "**★★ 시설 첫 아침(104·9/1):** **6시 반 기상**(여름 내내 못 하던 시각) · 손끝 저림 덜함 · 일어나 앉기 한 번에 · 아침 완식에 가까움. **★★★ 그런데 전부 무의미하다** — 마루가 없어 걸음을 셀 데가 없고 **나갈 데가 없어 결과를 쓸 데도 없다.** **이 아크에서 단아의 몸은 더 이상 서사의 문제가 아니다**(이 화 이후 몸 서술 최소)"]
