    location: "아동보호시설 — 위탁 학습 · 열세 살 · 6학년 · 155센티. **★★★ 평일 오전 9시에 차가 와서 현장으로 간다 — 접속 사흘째**(10/12·13·14 · 주말 제외 · 다음 주 계속)"
