    - "**신규 전장(52) — 간척 방조제 안쪽 얕은 물:** 수심 **기체 무릎 아래**(역대 최저)·바닥은 **콘크리트 슬래브 + 물이끼**(안 빠지는 대신 **안 걸린다**)·엄폐 0·평평함·저층 구조물 몇 채(허리 높이). **배수 암거 복개 구간 = EP53 격파의 지형**(지면 미설명). **배수진 = 수문**(어깨 높이·부서지면 논·길·동네로 물이 간다)"
    - "**파형 정본(50):** 넓고 완만(완만히 올라 완만히 내려옴·화면을 축소해야 한 화면에 들어옴). **느린데 크다.** 형체·명명·해석 발화 0"
    - "**전장 정본(45 계보) — 방재벽 외곽 수몰 구시가지(옛 아파트 단지).** 전장 정본: 수심 = 기체 허벅지(상반신 노출·수중전 아님), 아래 대여섯 층 침수 + 물 위로 열몇~스물몇 층 노출, 무인"
    - "**엄폐 자원 전량 소진(45)** — 물 위로 남아 있던 다섯 채가 모두 낮아짐. 이 전장 재사용 시 엄폐 0에서 시작. 동 사이 = 기체 보폭 네 걸음"
    - "여름 스콜 1회(교전 중반 개시 → 격파 직후 잦아듦)"
    - "수몰 화물부두 = 잔존물 정리 대상(폐건물·전도 크레인) 유지"
  military:
    - "**공세 전환 판단 기록(50·내부 층위):** 6월 기록 묶음의 결론란 = `출현 간격 단축 및 공격 행동 확인. 대응 방침 재검토 요함.` 고명준 결재. `관측만 적던 칸이었습니다.` / **`관측만 적을 수 있을 때는 그랬다.`** — **대상란은 넉 달째 공란**(미확인 3항목 + `미식별 검은 거인`). 작전·전력·시기 서술 0"
    - "**행동 양상 변화 첫 기재(46): `접촉 시도` → `원거리 공격 확인`.** 설명은 정황까지만(판단 배제). `민간 목격 신고 다수 — 발광 및 소음. 형체 확인 없음.` 기재. `미식별 검은 거인` 표기·미확인 3항목 유지"
  enemy:
    - "**★ 질량형 개체 격파(53):** 배수 암거 복개 구간이 무너지며 **통째로** 빠짐 → 낮은 무게중심 탓에 **기어 나올 자세가 안 나옴** → 기울며 드러난 **아랫면**(등과 달리 색이 옅고 갈라지고 부풀어 있다 — **껍질이 아니다**)을 **왼팔로 한 번.** 물 아래 가려 있던 **다리들이 드러남**(수는 안 셈). 용해·수거물 0"
    - "**★ 질량형 개체 교전(52):** 낮고 넓은 갑각 하나 — 높이 기체 허리께·**폭은 전조등 좌우 끝까지.** 매끄러운 곡면(이음매·돌출 0)·다리 미확인. **때리지 않고 대고 민다**(닿는 순간 소리가 없다) → 자세가 무너지면 **앞을 들어 올려 깔아뭉갠다.** **기교 0·성을 안 낸다**"
    - "**★ 2목적 이행의 첫 지면 증거(52):** 도착 시 **수문 쪽으로 직진**(도시로 들어가려는 걸음) → 타이탄이 막아서자 **그 자리에서 몸 전체가 돌았다.** 배가 먼저 돌고 왼쪽 끝이 먼저, 오른쪽 끝이 나중 — **도는 시간이 다 보였다**"
    - "**간격 단축 확정(50):** 여름 장부의 간격 줄이 **세 번째.** `한 번은 우연이고 두 번은 그럴 수도 있는데, 세 번이면 그건 다른 이름으로 불러야 한다`"
    - "**격파 완료(48).** 결착 = 눈자루 → 작은 집게 → 큰 집게 → 박치기. 용해·수거물 0"
    - "**구조 정본:** 녹빛 눈자루 두 개(껍질 아닌 유일한 부위·가까워져야 보임)·집게 관절은 한쪽으로만 접힘·**쇳소리 = 유일한 발성**"
    - "**공격 정본:** 큰 집게가 물고 **작은 집게가 관절을 잡아 함께 비튼다**(협업). 가두는 게 아니라 **망가뜨리려는** 구속"
    - "**신규 개체 교전 이력(47):** 넓적하고 낮은 몸통(기체 허리께)·**몸통만 한 집게 한쪽**·작은 집게 하나(**한 번도 움직이지 않음**)·다리 여덟. 옆으로 이동하며 갯벌에서 안 빠짐. 큰 집게로 치기·막기·밀기·휘두르기·찌르기 — **느림**. 숨지 않고 개활지에서 기다림"
    - "**격파 완료(45).** 개수된 개체 = 용해·수거물 0. 지면 확정 사항: 원거리 사격·거리 유지·작살형 끝·**던진 물체에 흔들림**(조준 교란)"
    - "**개수의 물증 확정:** 봄 조각 실물 + 오늘 화면 대조 → `같은 데서 나왔는데 가시만 나중에 바뀌었다`(주체·이유 0)"
    - "**의도 전환의 지면 증거 유지:** 붙잡지 않고 겨눠서 쏜다(작가용 = 회수 → 파괴 전환. 원리 서술 0). 다음 개체 = 농게형(S8 후반)"

