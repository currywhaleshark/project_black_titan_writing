      symptoms: ["시력 저하·둥근 안경(기준선)", "**★ 첫 증상(63·7/1):** 100미터 중반에 **순간 아찔** 1회. 반 걸음 어긋남. 넘어짐·정지 0. **본인이 더위로 정리했다.** 병명·검사·가족 보고 0. **목격 = 성호 하나**", "**★ 산발 ①(66·7/9):** 귀환 후 저녁 **열.** 미열~보통 · 눕지 않음. **여름감기로 본인이 정리했다**(물에 세 시간·땀). 수아가 이마를 짚고 찬물을 놓고 감. **EP63과 연결 0**", "**★ 산발 후(67·7/11):** 열이 내렸다. **증상 0.** 목·열 모두 정상. **여름감기로 본인 정리가 완성됐다**(`이틀 자고 나으면 감기다`). **지나가면 없던 일이 된다 — 산발의 함정**"]
      injuries: []
      treatment: ["안경 내년 재측정"]
    emotional:
      baseline: "밝고 활달하며 경쟁심이 강하고 생각보다 행동이 앞섬. **자신감 궤적 = 되찾았으나 방식이 무식함**(`이겼는데 이긴 것 같지 않았다` — 여름 중반 꺾임의 밑돌). 첫 격파를 제 손으로 해냄"
      pressure_level: 2
      pressures: ["팔보다 긴 것이 없다는 자각(손에 이어진 것이 필요하다)", "왼팔의 어긋남이 힘 줄 때마다 지나감(여운·증상 아님)", "**영상으로 남은 자기 모습** — 하면 안 되는 말밖에 없어서 잠자코 있는 자리", "**설명하지 못하는 훈련**(왜 팔을 들고 있는지 — `아무것도 안 하는 것보다는 나을 것 같았고, 사실은 그 정도가 이유의 전부였다`)"]
    relationships:
