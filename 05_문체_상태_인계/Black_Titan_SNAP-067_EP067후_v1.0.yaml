# ═══ EP055~056 반영(2026-08-14) ═══
ep055_updates:
  neighborhood:
    - "**★ 방재벽 외벽에 정체 미상의 부착물(6/22):** 넓고 납작한 판 4~5개. 하나가 **버스만 하고 두께는 얇다.** 붙은 자리의 콘크리트가 **삭는다**(깊이 두 마디)"
    - "**시(市) 조사 개시:** 점검반이 사다리·밧줄·안전모·발전기·긴 자·표본 봉지로 반나절. **표본이 안 뜯긴다**"
    - "**시청 수소문:** 골목을 하나씩 끊어서 돈다. 앞집 → 건너 가게 → 수리점. 안내문 한 장(벽 접근 자제·어선 운항 정상·추가 공지 예정)"
    - "**★ 인명 피해 1(중상·사망 0):** 표본 뜨던 점검반원이 **갈퀴에 팔이 감겨 딸려 들어감.** 빼내는 데 오래 걸림 → 들것. **팔이 움직였다**"
    - "**저녁에야 통제:** 큰길에서 벽으로 가는 갈림길 차단. `낮에는 통제할 이유가 없었다`"
    - "**관할 이관 개시:** 시청 일이 아니게 됨. 넘기는 데 **시간이 걸린다**"
  city:
    - "**소문 세 갈래.** **셋 중에 괴수라는 말은 없었다** — 지금까지 온 것들은 다 **왔다**"
    - "**시청 어휘:** `부착물`·`구조 안전`·`삭은 깊이`. 소문이 **절차**가 된다"
    - "**학교 = 통제의 지표:** 셔터가 안 내려오면 아무 일도 없는 날. 교문 당번이 조퇴증도 안 봤다"
  dana_knowledge:
    - "**★ 저것이 살아 있다** — 뚜껑·갈퀴·무음. 사람이 딸려 들어가는 것을 **난간에서 직접 봤다**"
    - "**★ 녹색을 봤다(확신 0)** — `번득인 느낌이 들었다`. **아무에게도 말하지 않았다.** 다만 그 색을 봄 내내 봤다"
    - "**빼내는 데 오래 걸렸다 — 방법은 못 봤다**"
    - "**★ 아무것도 못 하는 자리에 서 있는 건 처음이었다**"
  youngjin_knowledge:
    - "**부표 2·5·7번 사흘 치 평평 / 항만 기록에 배는 잡혀 있다** → `배는 잡히고 저건 안 잡혔다`"
    - "**저녁의 재의미화:** `아무것도 없다는 뜻` → **`아무것도 못 봤다는 뜻`**"
  sua_knowledge:
    - "**관측 표 6월 벽 쪽 전량 빈칸** / 조위 대조로도 안 나옴 → 낮에는 `이상하네요`까지만"
    - "**저녁의 자책** — 영진이 두세 마디로 끊음(`없는 걸 못 찾은 거야`)"
  canon:
    - "**단말은 가게에 하나**(EP29) / 부표는 **7·5·2번**이고 방재벽에 제일 가까운 것이 **2번**(EP30)"
    - "**조사 절차:** 중요시설 부착물은 시가 먼저 조사한다. **괴수 분류 = 시청 일이 아니게 되는 것**"
    - "**부표의 원리:** 지나가는 걸 잡는다 → **붙어 있는 건 지나가지 않는다**"

ep056_updates:
  neighborhood:
    - "**★ 괴수로 분류(6/23 아침):** 남해방위사령부 명의 공개망 통지 **문장 두 개** — 분류 + 어선 운항·잠수 인원 통제. **누가 언제 오는지는 없다**"
    - "**★ 전량 제거 완료(6/23 낮, 반나절):** 판 다섯 장. 블랙 타이탄이 **무단으로** 처리"
    - "**★ 벽은 복구되지 않았다:** 뗀 자리마다 둥근 테두리와 삭은 안쪽. **첫 자리는 크게 뜯겨 있다**(둘레를 따라 홈처럼 판 자국 포함)"
    - "**뒤처리:** 마른 바닥에 모았다가 **하나씩 부숴서 처리** → 바닷물에 떨어지며 **검붉게 녹아 소실.** 잔해 0"
    - "**통제선 유지.** 다만 난간·옥상·언덕에서 다 보인다"
  city:
    - "**★ 목격 3단 완성 — 눈으로, 낮에, 가까이**(200미터 미만·맑음). 사진(EP9) → 영상(EP49) → **직접**"
    - "**막아도 본다.** 길을 막으면 길에서 안 보는 데로 간다"
    - "**★ 여론 = 불안:** **`벽이 저래도 되는 거야?`** 웅웅거림이 안 끊긴다. 비난·항의·환호 **0** / 조종석·조종자 인지 **0**"
  dana_knowledge:
    - "**저것은 기존 괴수와 같은 것이다**(녹색 + 장부 + 개체 표)"
    - "**★ 갈퀴는 이쪽에 미약하다.** 굵기가 손가락 하나쯤 — 사람 팔에 감기면 어느 정도인지는 굳이 생각 안 해도 안다"
    - "**★ 당기면 조이고 밀면 풀린다** — 위험해서 푼 게 아니라 어떻게 되나 보다가 알았다. **`알아도 말할 데가 없었다`**"
    - "**★ 3연타 = 걸 데가 없다.** `셋 다 안 됐는데 셋이 다 다른 이유로 안 됐다`"
    - "**★ 병따개:** 맞는 공구가 없으면 뜯어낸 걸 쓴다. **벽을 안 깨고 떨어진다**"
    - "**뒤처리를 안 하면 다시 붙는다 — 부숴야 녹는다**"
    - "**★ `이겼다`가 안 붙는다.** `분하려면 상대가 있어야 하는데 저건 끝까지 이쪽을 안 봤다` / `그냥 힘이 빠졌다`"
    - "**★ `저건 사람을 죽일 수 있고 나는 안 죽는다.`** 존재 이유의 손끝 확인(결의 0)"
  youngjin_knowledge:
    - "**앞 권 장부로 동일성 확인**(4월 줄·5월 줄) → `같은 거네.`"
    - "**★ 병따개 조언** — `손에 든 거 다시 봐. 그게 뭐로 보이나.`"
    - "**★ 장부 옆 칸 세 줄:** `닿을 것이 없다.`(6월 초·**소급**) / `버틸 것이 없다.`(EP53) / `떼어낼 것이 없다.`(EP56) + 여백 **`이건 관측에 안 걸렸다.`**"
  sua_knowledge:
    - "**★ 개체 표로 동일성 확인** — 만들 때 앞엣것들을 기억으로 채웠고 못 본 건 언니에게 물어 적었다. **`전부 녹색이에요.`**"
    - "**출격 지원 = 물때(무릎·허벅지·허리).** 시각 수치는 안 쓴다(물때 정본 미확정). 전투 교신 0"
  canon:
    - "**★ 사체는 죽어야 녹는다**(EP5 `착수 후 붉게 풀려 확산·소실`의 전제)"
    - "**★ 뒤처리가 노동의 절반** — 떼는 것보다 옮기는 게 길다"
    - "**★ 병따개 = 아크 문법.** EP61 앵커(있는 것의 합계)의 리허설"
    - "**★ 분류의 역설:** 괴수로 분류됐다는 건 치우러 올 사람이 **없다**는 뜻"

ep057_updates:
  neighborhood:
    - "**★ 조달 인도 완료(6/24 금 아침):** 기태가 **대형 트럭**으로 인양장 고철을 실어 왔다. 체인 두 뭉텅이·휜 형강 넷·**닻 하나**·드럼통 셋·도르래 한 무더기 외 다수. **앞마당 크레인**으로 하역"
    - "**★ 앞마당 크레인 지면 초출**(LOC-05 v3.1 등재) — 기둥 고정식 지브 크레인. 기태가 짐칸에서 고리를 걸고 영진이 크레인을 움직인다. 한 손 조작 가능"
    - "**마당의 고철이 오후에 반쯤 없어졌다.** 긁힌 자국이 마당 안쪽으로 갔다가 끊긴다. **행선지 지면 0**"
    - "**★ 우편물 도착:** 손으로 쓴 봉투 하나. 받는 사람 = **도영진**. 번진 소인·색 바랜 우표·반듯한 글씨. **발신인란·내용물 지면 0**"
  city:
    - "**여론 = 불안 지속.** 벽을 갈아야 한다는 말이 어른들 화제. `그럼 그동안은?`에서 대답이 끊긴다"
    - "**소문의 출처가 없다:** `물어보면 다 자기가 본 게 아니고 누가 봤다는 거야`"
    - "**★ 센티널 2단:** 학교 게시판 스크랩 구석의 두 줄 — 어느 나라 부두가 몇 주째 통제 중. **밑에 아무것도 안 적혀 있다.** 인물 반응 0"
  dana_knowledge:
    - "**할아버지가 우편을 받는 방식이 달랐다** — 기름 묻은 손을 **두 번 닦고** 받았다. 작업대가 아니라 **부품장 맨 위 칸**에 세워 넣고 문을 닫았다(두 번)"
    - "**★ 그래서 안 묻게 됐다:** `물어서 안 될 게 뭐가 있나 싶기도 했다 … 그런데 손을 두 번 닦고 받는 걸 봤으면 그다음은 안 묻게 된다`"
    - "**봉투를 안 뒤집었다** — 뒤집을 이유가 없었다. **발신인 인지 0**"
    - "**격납고 한쪽이 작업장이 됐다:** 작업대·조명·전선이 옮겨지고 **훈련 뒤에 앉던 자리에 상자가 쌓였다.** 금지령은 없었다"
    - "**어제 일이 학교에서는 남의 일처럼 들린다** — `기분이 나쁜 것도 아니었다. 오히려 편했다`"
    - "**밤에 불이 안 꺼진다** — 미닫이 틈으로 **가게 쪽에서** 빛이 온다(평소와 반대). 철문이 열려 있고 규칙적인 소리가 올라온다. **내려가 보지 않았다**"
    - "※ 팔 무거움 = 노동의 여운(**증상 아님**). 새 증상 0"
  youngjin_knowledge:
    - "**★ 우편물 수령.** 반응은 **손을 두 번 닦고 받는 것** 하나로만 나왔다. 설명·회상 0"
    - "**작업장 개시:** `자리 좀 만든다` / `넓게 쓰려고` / `저쪽이 어둡잖아` — 셋 다 맞는 말이고 **뭘 만드는지는 0**"
    - "**한 손으로 전선을 정리한다. 도와 달라는 말을 안 한다**"
  sua_knowledge:
    - "**개체 표에 EP56 것 기재**(이름 없이): `납작함. 넓음. 벽에 붙어 있음.` / `뚜껑이 열림.` / `당기면 감김. 밀면 풀림.` / 두께 = 손가락 하나"
    - "**★ `남은 것` 칸 둘째 줄: `방재벽 바깥면. 삭음.`** 얼마나·언제·누가는 안 적는다(확실한 것만). 첫 줄 `배수로. 물 안 빠짐.`(EP54) 아래에 놓였다"
    - "**봉투를 봤다** — 저녁에 가게 쪽으로 한 번 나갔다 왔고 아무 말도 안 했다"
  canon:
    - "**★ 앞마당 크레인**(LOC-05 v3.1) — 기둥 고정식 지브. **작가용: 회전 반경 안에 자재 반입구 뚜껑이 들어온다**(지면 0)"
    - "**★ 영진 → 기태 화계 = 하게체 기조**(`~군`·`~한가`·`~하지`·`~하게`). 짧은 응답은 해라체(EP51)"
    - "**★ 수아 → 단아 = 반말.** 수아 존댓말은 **영진에게만**"
    - "**★ `남은 것` 칸 = 잔류 피해 기록.** 수거물이 아니다. **이긴 것마다 한 줄씩 는다**"

ep058_updates:
  equipment:
    - "**★ 시제품 완성(주말 사이).** 세 덩어리 — 왼팔뚝 **통** / 앞에 물린 **닻**(두 갈래 갈고리) / 등에 얹는 **등판**(커버 덮인 감개). 사슬이 통에서 나와 어깨 위를 지나 등판으로 간다. 형상 정본 = **BT-01A v0.3**"
    - "**마감:** 도장 없음·표면 거칢·용접 자국 그대로. **손으로 만든 티가 난다.** 기체는 검은데 이건 회색"
    - "**★ 조작 = 조종간 스위치 셋**(잠금 / 사출 / 되감기). **각도 조절도 세기 조절도 없다** — `잠그고, 쏘고, 감는다. 그게 다였다`. 통 옆의 레버는 **정비용 수동 잠금**"
    - "**★ 2단 발사:** `푸슉`(맥 빠지는 소리·반동 거의 없음) → **정적**(떨어지는 것처럼 보인다) → **불이 붙고 나가면서 빨라진다**"
    - "**★ 몸이 달라진다:** 등 위쪽이 뒤로 당기고 왼팔이 처진다. 왼팔이 **반 박자 늦게** 나가고 팔꿈치가 끝까지 안 굽는다. 사슬이 늘 늘어져 **걸을 때 소리가 난다**"
    - "**★ 장착은 공사다:** 천장 크레인 + 체인블록. **두 시간**. 그래서 **밖에서는 안 푼다** — 현장은 감고 물리고 잠그는 데까지, 푸는 건 격납고에서"
    - "**회수:** 안 걸리면 감아야 한다. 감는 동안 **그 팔을 못 쓴다.** 쏘는 건 한순간인데 감는 건 아니다"
    - "**장비 이름 없음.** 아무도 안 물어봤다. 지면 지칭 = `그것`·`닻`·`사슬`·`통`·`등판`"
  neighborhood:
    - "**마당의 고철이 거의 다 없어졌다.** 남은 건 형강과 드럼통 — **무거운 것부터** 없어졌다"
    - "**★ 격납고 천장 크레인 지면 초출**(LOC-02 v0.2 §2.2-C). 정비 용도는 지면 허용·반입구 위 운용은 0"
  city:
    - "**간척지는 밤에 빈다.** 낮에는 복구반, 밤에는 아무도 없다. 지난달 침수 자리는 아직 물이 안 빠졌다"
    - "**무너진 창고 한 벽이 표적으로 쓰였다** — 아홉 번 쏘는 동안 한 번도 안 맞았다"
  dana_knowledge:
    - "**★ 안 맞는다.** 아홉 발 — 넘어가고, 못 미치고, 스치고, 옆으로 가고, 어디 갔는지 못 본 것도 있다"
    - "**★ 몸이 아는 것과 어긋난다:** `던진 건 나가면서 느려진다 … 이건 반대였다`. 손을 놓는 순간에 어디로 갈지 알 수가 없다. **힘이 문제였으면 차라리 나았다**"
    - "**★ EP50 회수 — 아흐레.** 팔 들기·오래 버티기는 **6/18 밤(성호와 언덕)에 시작**했다. 그날은 두 번째가 여덟, 세 번째가 여섯이었다. 오늘은 아홉 번을 쏘고 감는 동안 안 떨렸다. **그런데 오늘 그게 아무 소용이 없었다** — 버티는 건 되는데 보내는 게 안 된다"
    - "**★ 성호의 3차 청구를 못 받았다.** 금요일·목요일·다음 주 다 못 정했다. **미룬 이유를 말할 수 없다**"
    - "**★ 예진이 틀린 근거로 편들어 줬다**(시청 방문을 이유로 짐작). `성호는 틀리게 알고 있고 예진도 틀리게 알고 있는데, 둘 다 고쳐 줄 수가 없었다`"
    - "봄에 처음 조종석에 앉았을 때와 겹쳐 봤다 — **`그때는 팔이 낯설었고 지금은 팔에 붙은 게 낯설다`**"
  youngjin_knowledge:
    - "**시제품 제작·인도.** 만드는 과정은 안 보여 줬다. 설명은 **절차뿐**"
    - "**★ 시험을 멈췄다** — `물 들어온다. 그리고 사슬이 젖은 채로 감기고 있어. 더 하면 감개가 상해.` 위로도 격려도 아닌 **판단**"
    - "**`오늘은 여기까지`** / **`내일 다시 한다`**"
  sua_knowledge:
    - "**★ 궤도를 그렸다.** 두 마디로 꺾인 선(떨어지는 구간 + 살아나는 구간). **틀린 그림이 아니었다**"
    - "**★ 그런데 그대로 해도 안 됐다.** 원인을 특정했다 — **`불 붙는 데가 매번 달라`**. 종이에 못 그리는 것이 손에 달려 있다"
    - "**가게에서 화면으로 참관**(현장 동행 0). 종이를 카메라에 대고 보여 줬다"
    - "**★ 자기 쪽부터 봤다** — `아냐. 내 그림이 틀렸나 봐.` (수아 4금 정합)"
  canon:
    - "**★ 격납고 천장 크레인의 지면 사용 허용**(LOC-02 v0.2 §2.2-C) — 정비 용도만. 반입구 위 운용 0"
    - "**★ 앵커 리그 형상·조작·발사 정본**(BT-01A v0.3)"
    - "**★ 수아 4금:** 잘난척·남 탓·변명·말 끊기(사용자 확정)"

ep059_updates:
  engagement_open:
    - "**⚠ 이 회차는 끝나지 않았다.** 퇴각도 격파도 없다. EP60이 **시간 경과 0**으로 이어받는다"
    - "**진행 상태:** 저것은 도시 쪽으로 곧게 가는 중 / 거리는 계속 벌어짐 / 이쪽은 **사슬 반쯤 나간 채 닻을 끌며** 쫓는 중"
    - "**기체 상태:** 관통 0·대파 0. **스친 자국 누적** — 어깨·허리·왼쪽 종아리"
    - "**장비 상태:** 통 밴드가 **덜 조여져 있다**(급조 장착). 등판이 어제보다 낮게 앉았다"
  enemy:
    - "**★ 등각류형 첫 지면 노출.** 마디 갑각·다리 여럿·길고 낮다. **기체 절반 — 사람 기준으로는 5층짜리가 옆으로 누워 달리는 크기**"
    - "**★ 질량 있는 속도:** 지나가면 물이 갈라지고 **한참 뒤에 파도가 밀려온다.** 급선회하면 **물이 벽처럼 서고 드러난 바닥이 활처럼 파이고 소리가 뒤늦게 터진다.** 공짜로 안 꺾는다"
    - "**★ 행동 패턴:** 이 일대를 안 떠나고 **지나갔다가 크게 돌아 다시 온다.** 그래서 앞을 막을 수는 있다"
    - "**★ 싸움 방식:** 정면으로 안 온다. **틀어서 정면을 피하고 옆으로 붙어 치고 나간다.** 스치면서 긁는 것이 공격이다 — **멈추면 지는 걸 저것도 안다**"
    - "**★ 여섯 번째에 원을 안 닫았다.** 여기서 할 게 없다고 판단하고 도시 쪽으로 폈다 — **이쪽이 못 잡는다는 걸 저것이 먼저 알았다**"
    - "**다리가 여럿이라 걸음을 안 고른다.** 부서진 걸 밟으면 부수고 지나간다"
    - "지면 지칭 = `빠른 놈`·`작은 것`. **작가용 명칭 0**"
  observation:
    - "**★ 부표 순서가 반대로 왔다** — 2번 → 5번 → 7번. 안쪽이 먼저 튀었다. `들어와서 지나갔다는 거지`"
    - "**부표 간격이 봄 것들보다 훨씬 짧다.** 3월에는 그 사이에 준비를 했다"
  dana_knowledge:
    - "**★ 미완성을 들고 나갔다.** 급조 장착(어제 두 시간 → 오늘 절반) · **덜 조인 채로**"
    - "**★ 여섯 번 막아서고 여섯 번 다 지나갔다.** 세 발 쐈고 전부 빈 물. **2단 발사의 정적 구간에 저것이 이미 딴 데 있다**"
    - "**★ 소리 순서가 뒤집혔다** — 지나가는 걸 보고 나서 소리를 듣는다. `본 게 늘 지나간 것이었다`"
    - "**★ 밀린 적도 크게 맞은 적도 없는데 자국만 늘었다.** `힘이 남았는데 쓸 데가 없었다`"
    - "**갯벌의 역전을 알아봤다** — 봄에는 하중이 한 점에 모이는 게 이겼는데 **단단한 데서는 많은 게 이긴다**"
    - "**EP9 회상:** 물 빠진 옛 도로·웅덩이·놀라 날아오르던 새. **오늘은 새가 없다**(이유 불명)"
    - "**끌고 가는 쪽을 골랐다** — 멈춰서 감는 것보다 낫다. `둘 다 나쁜데 그중에 덜 나쁜 걸 고르는 거였다`"
    - "※ 새 증상 0"
  youngjin_knowledge:
    - "**관측 지원만 했다** — 위치·방향·거리. `이백` → `삼백` → `오백. 더 벌어진다`. **전술 0**"
    - "**미완성을 들고 가라는 판단 한 줄:** `맨손으로 잡을 수 있는 놈이면 놓고 가`"
    - "**마지막에 교신이 조용해졌다** — 할 말이 없었다"
  sua_knowledge:
    - "부표 시각 세 개와 물때를 적어 줬다(**아홉 시까지 빠지고 그다음엔 찬다**). 전투 교신 0"
  city:
    - "**목격 0.** 새벽 다섯 시·외곽. 배도 안 나갔고 시장도 안 열었다. **여론 변화 0**"

ep060_updates:
  engagement_closed:
    - "**★ 교전 종결.** EP59의 `engagement_open`이 여기서 닫힌다"
    - "**격파 위치:** 외곽 수몰 시가지 **옛 큰길**(양쪽에 건물·바닥은 드러난 옛 도로·단단함)"
    - "**기체:** 관통 0. **스친 자국**(어깨·허리·왼쪽 종아리) 유지 + **버틸 때 밀린 발자국 두 줄**"
    - "**장비:** 닻이 오른쪽 건물 벽에 박혔다가 **두 번 당겨서 빠짐**(콘크리트 한 덩이 딸려 나옴). 사슬 회수 완료"
    - "**현장에 남은 것:** 무너진 벽·파인 바닥·밀린 발자국. **★ 고칠 사람이 없다 — 처음으로 부수고도 값이 안 나왔다**"
  tactics:
    - "**★ 쫓기를 그만두고 질러갔다.** 저것은 **다리로 밀어서** 가므로 깊은 데를 못 쓴다 → **얕은 선(옛 도로 능선)만 탄다** → 돌아간다. 이쪽은 **깊은 데를 걸어서 곧게** 갔다"
    - "**★ 빠른 쪽이 돌아가고 느린 쪽이 질러간다**"
    - "**군의 공개망 자료로 지형을 읽었다**(EP30 최초·EP33 정례화). 영진은 **얕은 데·깊은 데·건물 위치**까지만 읽고 **질러가겠다는 결정은 단아가** 했다"
    - "**★ 덫:** 닻을 **오른쪽 벽에 박고** 기체가 **왼쪽에서 사슬 끝을 쥔다** — 기둥이 둘 필요한데 하나면 **나머지 하나를 자기가 한다.** 높이는 **다리에 걸리는 높이**"
    - "**★ 고무줄:** 걸리고 뒤집힐 때까지가 **짧았다.** 발이 밀리고 팔이 뻗어지고 몸이 기우는 동안 **조금씩 내주면서** 버텼다. `팔이 안 떨렸다`"
    - "**★ 저것의 속도가 저것을 꺾었다** — 걸린 데를 축으로 돌아가 다리 여럿이 한꺼번에 걸리고 통째로 넘어감. **이번엔 저것이 고른 꺾임이 아니었다**"
    - "**★ 멈추면 진다** — 저것이 여섯 번 지나가며 한 번도 안 섰던 이유. 멈추게 만드는 게 전부였고 그다음은 짧았다"
  dana_knowledge:
    - "**★ `무기를 쏜다고 생각하지 마라. 왼팔이 길어진다고 생각해`**(영진 · 교신). 두 번 빗나간 뒤에 왔다"
    - "**★ 겨누기를 그만두니 박혔다.** 각도를 안 쟀고 **손이 갈 데**를 봤다. `팔로 짚은 것 같았다`"
    - "**★ 도구와 팔의 차이:** `도구는 겨눠서 쓴다 … 팔은 안 그런다` / `붙어 있는 건 무겁다 … 팔이 무거우면 그냥 팔이 무거운 거다`"
    - "**★ 신체이미지:** **팔이 하나 더 생긴 게 아니라 팔이 길어졌다.** 걸렸을 때 당겨진 게 사슬이 아니라 팔이었고 **놓을 생각을 한 번도 안 했다**"
    - "**★ 이겼는데 웃음이 안 나왔다.** 봄에 처음 이겼을 땐 손이 떨렸고 방재벽 뒤엔 허탈했다. **오늘은 아무것도 아니었고 그게 제일 이상했다**"
    - "**착상은 갑자기 왔다** — 좁은 길에서 `여기서 발을 걸면 넘어지지 않을까`. 늘어진 사슬이 눈에 들어와서였다"
    - "**소리가 처음으로 제때 왔다**(닻이 박히는 소리). 어제부터 저것의 소리는 늘 늦게 왔다"
    - "※ **새 증상 0** / 장비 이름 **여전히 0**"
  youngjin_knowledge:
