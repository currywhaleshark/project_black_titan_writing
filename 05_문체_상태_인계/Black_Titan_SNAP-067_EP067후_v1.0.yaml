      youngjin: "교신 신뢰(침묵의 빚은 별도 층 유지)"
      hyejeong: "짝 정본·세 자리 체계. **떡볶이 청구권 지불 완료**(어묵 낙착 — 남은 소채권 0)"
      seongho: "**재대결 종결(54:54 동점)·쌍방 앙숙 완전 복귀**"
    knowledge:
      knows:
        - "SNAP-039의 지식 전체 + 결착 2호 체험(주기 관찰→뒤집기→벌리기)"
        - "두 개체 용해·부두 종결(잔존 = 폐건물·전도 크레인)"
        - "**봄의 그 개체가 달라져서 돌아왔다(현상 층위):** 가시가 고르게 재정렬·기부 두터움·**끝이 작살처럼 갈라짐**. 스스로 이동하며 자리를 잡음"
        - "**몸에서 떨어져 나온 것이 날아온다** — 맞아도 뚫리지 않았다(손상 표시 0). **다만 몇 번까지 버티는지는 모른다**(확정 0)"
        - "**피해가 없어도 밀린다** — 맞은 자리는 멀쩡한데 몸이 뒤로 감(아픈 것과 흔들리는 것이 따로 노는 감각)"
        - "**저것은 부수러 왔다** — 봄의 것들은 데려가려 했다는 대비 인식"
        - "**맨손으로는 닿지 않는다** — 팔이 짧아서가 아니라 거리가 멀어서 지는 싸움이 있다"
        - "**발사에 간격이 있다** — 비로 귀가 막히자 **어깨로 오는 충격의 주기**로 셈을 옮김(`한 번은 맞아 봐야 알 수 있는 셈`)"
        - "**던지기의 한계:** 자갈 크기는 무의미 / 큰 덩어리는 **흔든다**(조준 교란) / **손을 떠난 것은 이쪽 것이 아니다 — 밀 수는 있어도 부술 수는 없다**"
        - "**격파의 방법(원시형):** 가시는 비틀어 꺾고 여러 개는 모아 쥐어 한 번에 / 몸통은 부서질 때까지 내려친다(기술 0)"
        - "**개수 흔적의 촉감:** 배열이 자로 잰 것 같다(봄에는 고르는 게 일이었다)"
        - "**밀어내기는 해결이 아니었다**(`오늘로 미뤄 둔 것`)"
        - "**도시가 검은 거인을 걱정하기 시작했다**(교실에서 확인 — `안 오면 어떡해`). 통제의 개폐가 시민의 승패 지표라는 것도 성호의 입으로 들음"
        - "승리의 값 = 침묵(`할 말이 없어서가 아니라, 할 수 있는 말이 없어서`)"
        - "**불리한 지형(47):** 이족 하중은 두 발에 박히고 다족은 뜬다(`여덟 개로 나눠 디디니까`). 봄의 승리를 만든 무거움이 여기서는 발목을 잡는다"
        - "**보이는데 못 피한다:** 집게는 느려 궤도가 보이지만 발이 안 빠져 못 피한다(원인 = 지형)"
        - "**갯벌 대처 두 가지(현장 습득):** 팔을 넓게 펴서 짚기 / 발은 다리째 밀어 올리듯 끌기"
        - "**흘리기(48):** 정면으로 받으면 뒤로 가고 비스듬히 받으면 옆으로 간다 — 옆은 넘어지는 방향이 아니다"
        - "**무거움의 양면:** 붙잡고 버티는 자리에서는 무거운 쪽이 이긴다"
        - "**어제의 방법이 오늘 안 통한다:** 부러뜨릴 것도 드러난 속도 없는 상대가 있다"
        - "**구속의 두 종류:** 가두려고 넓게 감는 것 ↔ **망가뜨리려고 골라서 무는 것**(후자가 더 무섭다·통증 0·어긋남)"
        - "**관절에는 방향이 있다:** 막히는 쪽이 부러지는 쪽. 박힌 발은 바닥이 될 수 있다"
        - "**쇳소리 = 저쪽이 곤란하다는 신호**(소리를 읽는 법)"
        - "**격투의 출처(48):** 어릴 때 놀이터에서 해 본 싸움 — 눈, 그리고 박치기"
        - "**보는 게 아는 것과 같지 않다(49):** 같은 영상을 보고도 해석이 갈린다. 안에서 겪은 것은 화면에 안 나온다"
        - "**통제선 밖의 그것 = 중계차**(EP47 회수). 낮에 크게 싸우면 찍힌다"
        - "**망각의 속도(50):** 통제 해제 이틀이면 거리가 원래대로 — `일상이 소문보다 빨랐다`. `그 사이에 저 안에서 무슨 일이 있었는지는 아무 데도 안 남고`(생각을 끝까지 밀지 않고 접음)"
        - "**할아버지가 준비를 시작했다(50):** 조달 목록의 **존재**까지. 용도·명명 0 — `만들 걸 정하고 모으는 게 아니다`까지만 들음"
        - "**훈련의 성질 전환(50):** 빠른 것은 성호와 다 했다 → 지금 필요한 것은 **오래 버티는 것.** 팔 들기 10 → 8 → 6(줄어드는 게 눈에 보임·수치 기록 0)"
        - "**조달 실무의 문법(51):** 고철은 무게로 나가고 끝인데 **장비는 출처가 장부에 남는다.** `남는 게 왜 문제인지까지는 몰랐다. 다만 그게 문제라는 건 두 사람 다 아는 것 같았다`"
        - "**안 묻는 것이 이 집만의 일이 아니다(51):** `이 집 안에서만 그런 줄 알았는데 밖에서도 그랬다`. 무엇에 쓰는지 끝까지 안 나왔는데도 거래가 끝났다"
        - "**사람 몸의 척도(51·52m와 분리):** 드는 것과 못 드는 것 / `어느 쪽으로도 안 되는 물건` / **다시 드는 게 계속 들고 있는 것보다 힘들다**"
        - "**★ 표적은 바뀔 수 있다(52):** `저건 원래 청해로 들어가려던 거였다. 내가 앞에 서니까 나로 바꾼 거다.` → **`바꿀 수 있다는 게 무서웠다`**"
        - "**밀림의 성질(52):** 힘이 밀리는 게 아니라 **발이 간다.** `버티는 데는 다 버티고 있는데 발바닥이 바닥 위에서 그냥 미끄러졌다` / **`밀리는 게 아니라 실려 가는 것에 가까웠다`**"
        - "**접지의 대비(52):** **`저건 누워 있고 나는 서 있다`**. EP47 역상 자각 — `지금 생각하니 박히기라도 했었다`"
        - "**세게 딛는다고 안 미끄러지지 않는다(52):** 문지르니까 더 간다"
        - "**위에서 오는 힘은 처음(52):** `무릎이 그걸 몰라서 한 번 접혔다`"
        - "**흘리기가 막힌다(52 — EP48 기술의 첫 실패):** 폭이 두 배라 **흘려보낼 쪽에도 저것이 있다**"
        - "**잡을 데가 없다(52):** 등이 통째로 한 덩어리·곡면. `잡고 꺾을 수 있으면 그건 어떻게든 되는 거였다` — **3연타(인장) 예고**"
        - "※ **자각 0(52):** 발밑의 **빈 소리**를 들었으나 `들었는데 그게 다였다`. 수아의 종이와 연결 0 — **EP53 격파의 씨앗**"
        - "**★ 밀리는 걸 이용한다(53):** `그러면 밀리자. 대신 어디로 밀릴지는 내가 정한다.` — **EP23 계보**(`그때도 끌려가는 방향을 내가 정했다`). EP48 흘리기가 막힌 자리에서 **흘릴 수 없으면 같이 간다**로 뒤집힘. **값 = 뒤로 더 간다**(두 걸음 → 네 걸음)"
        - "**★ 좁게 딛는 것이 무기가 된다(53):** 하중이 한 점에 모인다 — **넓게 깔린 저것은 못 하는 일.** EP52에서 지게 만든 바로 그 성질"
        - "**소리로 아래를 읽는다(53):** 짜부라지는 소리 ↔ 낮고 오래 남고 아래로 퍼지는 소리. 소리 나는 자리가 **선을 이룬다**"
        - "**콘크리트는 한 번에 안 깨진다(53):** 금이 가고 넓어지고 조각이 내려앉는다"
        - "**싸움의 형태가 바뀌었다(53):** `봄에는 부수고 꺾고 던졌다. 지금은 밟고 있다` — 무섭고 **지겹다**"
        - "**이겨도 대가가 남는다(53):** `이런 건 이기고 나서 알게 된다`. ※ 성장 아님 — `기술이 는 게 아니었다. 칠 자리가 나와 있었을 뿐이다` / `이겼다는 말이 안 나왔다`"
        - "**★ 값은 자기가 못 치른다(54):** `자기가 한 일인데 자기가 못 치우는 일이 됐다. 치우는 건 저 트럭에 탄 사람들 몫이고, 단아는 학교에 간다`. 미안함의 두 방향 — `미안한 건 아니었다` / `그런데 안 미안한 것도 아니었다`"
        - "**설명할 수 없음(54):** `이겼다고 말하고 나면 물이 안 빠지는 건 어떻게 설명하나. 이긴 사람이 부순 건데` — 다만 **아무도 안 묻는다**"
        - "**자기가 부순 것이 자기 몸에서 나온다(54):** 발바닥 홈의 콘크리트·철근. **`뭉개졌다는 건 밟혔다는 뜻이다`**"
        - "**값의 층위(54):** 종이 위 숫자는 짧지만 실제는 창고 여러 개 값이다. `어딘가에는 적힐 것이다`"
        - "※ **EP50 회수(자각 0):** 팔을 오래 들고 있는 일이 처음으로 쓸모를 보임 — `자기가 그걸 얼마나 들고 있었는지는 세지 않았다`. 훈련과의 연결은 문면에 없다"
      suspects: []
      misunderstands: ["확장 위장 설명(유지)"]
      hides: ["탑승 사실(가족 외)"]
    commitments:
      - "**재대결의 재대결(성호 100미터) — 63에서 성사.** 단아가 먼저 청했다. **13초 4 대 13초 9로 성호 승 → 성호가 스스로 무효 선언.** `이긴 것 같지가 않아서` · `그건 내가 정해`. **3차까지의 미지불은 소멸하고 4차가 잠재된다**(`다음에 다시 하자고`)"
      - "(발표회 관람 완료)"
    state_notes:
      - "미지불: 수아 공책·서랍 사진(별도)·우편물(S9)·가위값·재대결의 재대결. **회수 완료: 가시 조각(45)·발바닥 이물(49)·방학식 날짜(50)**"
      - "**기태와의 모순은 아직 안 풀렸다(51):** 무섭게 구는 것과 챙기는 것이 한 사람 안에. 무서움 자체는 **줄지 않았다**"
      - "**앵커의 씨앗 3단(50): 조달 목록으로 물질화.** 팔보다 긴 것 + 손에서 놓지 않아도 되는 것 → 쇠사슬·강재·도르래·**닻**·용접봉·**구명줄 발사기(기태)**. **명명 0·설계 0·용도 서술 0**(S9 개발로 회수)"
      - "미지불 갱신: **가시 조각 = 지불 완료(45)**"

