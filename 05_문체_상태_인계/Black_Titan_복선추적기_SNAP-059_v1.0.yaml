    - '**S8 결산(작가용):** 공격 의도 2회 실증 — 원거리 사격형(EP44~45·격파) / 육탄 집게형(EP47~48·격파). 여름 전적 2승. 용해·수거물 0'
    - '**★ 두 목적의 우선순위 정식화(2026-08-13 사용자 확정·작가용):** ① 1목적 = **동족 탐색**(첫 거인 계통) ② 2목적 = **방해물 파괴**(블랙 타이탄) — 1목적을 막는 것이 있을 때만 발동. 여기서 나오는 것 = 탐색을 방재벽 안쪽으로 넓히려면 벽을 넘어야 하는데 **요란하게 움직이면 2목적이 발동한다**(타이탄이 나온다) → **조용히 넘는 방법을 시험한다** = S9 따개비형'
    - '**따개비형 = 조용한 굴착 시험(S9).** 적이 학습했다는 증거지만 지능이 올라간 건 아니다 — 시행착오 수준이고, **이번 시험은 실패한다**(결국 타이탄이 나온다). 저쪽은 그 결과를 또 가져간다 → S10 톡토기형이 **다른 방법으로 벽을 넘는다**로 접속'
    - '**지면 노출 규칙:** 목적·학습·시험이라는 말은 0. 재료 셋만 놓는다 — ① 소리가 안 났다 ② 언제부터인지 모른다 ③ 하필 벽이다. 등장인물 중 누구도 말로 정리하지 않는다'
    - '**S9 사다리(작가용):** 맨손 한계는 성질이 다른 셋이다 — **거리**(성게형·기성립) / **지지**(투구게형·EP52~53) / **인장**(따개비형·EP55~56). 셋을 한 물건이 푼다 = 사출·박고 버티기·걸고 당기기. **앵커는 발명이 아니라 합계다**'
    - '**외해 개체 접근 로그:** 6/18 밤 부표 7번 → 6/19 밤 5번 → **6/20 밤 간척 방조제 안쪽**(벽 안으로 들어온 첫 사례) → **6/21 새벽 격파**'
    - '**여름 격파 3건:** 사격형(45)·집게형(48)·**질량형(53)**. 셋 다 문법이 다르다 — 부수기 / 꺾기 / **빠뜨리기**'
    - '**용해 확인(54):** `저것은 녹아내렸고` — 수거물 0 관례 유지'
    - '**★ EP55의 입구(54 훅):** 방재벽 순찰 소문 — `본 사람이 오늘 안 나왔어요. 들은 사람이 말한 거라 확실한 건 아니고`. **출처 흐림·경보 0·관측 0.** 이것이 **관측 체계가 놓친 첫 사건**의 문이다(지면에서는 아직 그렇게 말하지 않는다)'
    - '**★ 2목적 이행이 지면에 처음 보인다(52):** 도시로 가던 것이 **타이탄을 보고 표적을 바꾼다.** 해설 0 — 방향이 바뀌는 것만 보이고, 단아의 감각은 `바꿀 수 있다는 게 무서웠다`까지'
    - '봄 전적(작가용): S1~S7 회수 시도 전부 실패·수거물 0. 잔존물 = 폐건물 1·전도 크레인 1(안전점검 대상)'
    ep_note: EP59 — **2목적 이행의 새 형태.** 막아서면 **틀어서 옆으로 치고 나간다**(공격은 한다·붙어서는 안 한다). 그리고 **여섯 번째에 판단하고 떠났다** — 이쪽을 못 잡을 상대로 계산한 첫 사례
