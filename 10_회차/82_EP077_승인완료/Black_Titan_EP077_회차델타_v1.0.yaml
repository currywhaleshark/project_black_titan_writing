state_changes:
  dana:
    - "**★★ 조금 나아진다** — 여드레째·**비탑승 닷새.** 셀 수 있는 회복(국 없이 밥 · 방에서 마루까지가 가깝다). **해석은 잠·방학**(본인·집 공통)"
    - "**★★★ 작가용 봉인: 실인 = 비탑승 닷새.** 지면 설명 0 — **탑승 누적 복선의 첫 단추.** EP78 「무리했다」 오설명의 토대"
    - "**★★ 간격 규칙이 깨진 것을 몸으로 안다** — `긴 게 문제가 아니라, 순서가 문제였다` · **`줄어들던 것이 늘어난 건 처음이었다`**"
    - "**★ 부표 소리를 기다리는 몸** — `기다리는 게 아니라 대비하는 거라고 고쳐 생각했다. 고쳐 생각해도 몸이 하는 일은 같았다`. `쉬는 날을 받으면서 이자가 붙는 기분`"
    - "**접수 조수** — `순서대로 해 드려요`(영진의 말을 받아 씀). 몸 쓰는 일은 **일 배분으로만** 빠진다(말로 금지 0)"
    - "**★ 방학의 모양:** 잠·접수·심부름. `그 모양 어디에도 바다는 없는데, 하루에 몇 번씩 바다 쪽을 보게 될 것이었다. 그것까지가 모양이었다`"
  sua:
    - "**★ 표의 간격 칸 — 2 다음이 닷새째 빈칸.** `이미 5를 넘겼고, 그러면 규칙이 깨진 게 된다. **규칙이 깨진 건 적을 데가 없었다**`"
    - "**백지 첫 장에 날짜만 적고 덮는다**(성호의 언덕과 같은 일 — 서로 모름) · 덮기 전에 한 번 더 본다"
    - "**방학 시간표 있음** — 하랑이네 월수금(모레부터 · **EP86 예열**) · `정해야 가지` · 일곱 시 기상(`버릇이 안 자`)"
  youngjin:
    - "**폭염 대목** — 실외기·선풍기 밀림. 말수는 같고 손만 빨라진다. `대목이네`"
    - "**단아에게 접수만 시킨다** — 설명 0(이 집의 방식)"

relationships:
