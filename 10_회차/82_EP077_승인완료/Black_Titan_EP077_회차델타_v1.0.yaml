  - "**혜정 ◐ — `안 끊어` 이행 1회차.** 계곡 **계획만**(미래형) · `계획이라는 건 절반쯤은 미리 다녀오는 일` · **`목소리가 낮네`** / `자다 깨서 그래` → **제일 가벼운 해석을 골라 주고 간다**"
  - "**★ `그럼 됐어`가 아무 데도 안 걸리는 자리에 쓰인다** — `같은 말이 쓰이는 자리에 따라 무게가 달라지는 걸, 두 사람은 이번 여름에 각자 배웠다`"
  - "수아 — `아무것도를 되게 오래 보네` / 받아 주고 옆에 앉는다. **`받아 준다는 건 믿는다는 뜻이 아니라 더 안 판다는 뜻`**"
  - "접수 손님 ○ — **★ `조용할 때 고쳐 놔야지`**(선풍기 얘기인데 선풍기 얘기로만 안 들린다)"

