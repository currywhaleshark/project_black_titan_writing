  - "**★★ 협조 공문 발신 예정**(8/15 월 아침) — 수신 = 시청 · 경찰서. 내용 = 구래동 일대 순찰·검문 강화 요청"
  - "**★ 통과가 사실상 보장된 요청** — 위험 지역 관리 강화를 반대하는 기관은 없다 → 구래동 골목에 **군복이 아닌 제복**이 늘어난다"
  - "**★ 목격 신고 축적** — 언덕에서 봤다는 신고를 여름 내내 넣은 학생 하나(성호 · 군 서류에 이름으로 존재)"

