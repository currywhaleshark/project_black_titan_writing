  hyejeong:
    - "**★★ 예진과 먼저 상의** — EP88의 조건(`나한테만 말해`)이 실제로 작동. 어른에게 묻기 전에 친구에게 먼저 확인하는 절차가 생김"
    - "**★★★ 이름을 대지 않았다** — 큰삼촌에게 물으면서 **친구 이름 0 · 도영진 0 · 수리점 0.** 배려였고, 본인은 자기가 무엇을 지켰는지 모른다"
    - "**★ 질문의 형태** — 사람이 아니라 사정을 물음(`군에서 어린애한테 위험한 일을 시키는 경우도 있어요?`)"
    - "**★ 답을 하나 지웠더니 남은 자리가 더 이상해졌다** — 군이 아니라면, 안 시키는데도 그런다는 뜻"
    - "**★ 복숭아** — 무르는 중(EP88 계승 · 시간 경과의 유일한 표시)"
  myeongjun:
    - "**★ 조카 얘기는 흘려들었다** — 열두 살의 이유는 대개 열두 살짜리라는 판단(정확한 상식이 정확히 빗나감)"
    - "**★★★ 지명 하나를 가져갔다** — `구래동`이 요즘 귀에 자꾸 걸리는 이름이라는 자각 → 작전 기록·목격 신고·지리 세 뭉치가 **한 점 위에서 겹침**"
    - "**★★ 지리로 다 설명이 됐다** — 제일 얕다 · 항에서 제일 가깝다 · 수몰 구도심 길목 · **도시에서 돌출된 곶 지형**"
    - "**★★ 순찰 강화 + 협조 공문 지시** — 군은 시내에서 사람을 세울 수 없으므로 **경찰서·시청에 요청**"
    - "**★ 인원 증원은 하지 않음** — 사유를 쓰면 위에서 묻는다(조용히 하려는 이유를 본인도 딱 잘라 말하지 못함)"
    - "**★ 무엇을 찾는지 모른다** — `모르겠다. 찾을 게 있는지도 모르겠고`"
  seojin:
    - "**★★ 안 적는 것 4연째** — 대외 공문 사유 = **`미확인 대형체 인근 지역 예방적 관리 강화 요청`**"
    - "**★ 관할 확인** — `저희 순찰은 해안선까지입니다` · `시내는 저희 관할이 아닙니다`"
    - "**★★ 신규: 서진이 눈치챘다** — 다섯 달 동안 손에 쥔 게 없어 투덜거리던 사령관의 눈에 오늘은 뭔가 돌아 있었다. **`뭐가 있긴 한 거다`** · 캐물어도 안 나온다고 판단해서 안 물음"
  dana:
    - "**★ 지면 미등장 2회 연속**(EP88·89) — 연락 두절 지속. 혜정·군 시점으로만 존재"

relationships:
  - "**★★ 혜정 → 명준(큰삼촌).** 명절에나 보는 사이 · 용돈 주는 어른 · 애들 얘기를 진지하게 들어 주는 편 · **성실하게 대답해 주는 어른** · 통화 종결 = `방학 잘 보내라`"
  - "**★★ 혜정 ↔ 예진.** EP88 조건의 실작동 — 예진이 먼저 알고 있는 상태에서 상의가 성립"
  - "**★ 명준 ↔ 서진.** 상관이 뭔가 쥐었다는 걸 부하가 알아본 첫 장면 — 방 안에 아는 사람이 하나 생김"
  - "**★★★ 명준 ↔ 영진 = 여전히 0.** 이름이 오간 적 없음(**혜정의 침묵이 유일한 차단막**)"

world_changes:
