changes:
  - category: "combat"
    field_path: "characters.dana.state"
    operation: "advance"
    after:
      - "**오답 실행과 실패:** 되감기로 왼팔 해방(성공 1회) → 재포박(팔꿈치 안쪽·목) → 속도 재계산 루프 실패 → 분산 견인에 자세 상실"
      - "**봄 최초의 거의 패배:** 주먹 0회 적중, 방재벽 밖으로 밀림(등 뒤 하중 소실로 인지), 수몰 구도심 진입"
      - "마지막 저항(온 힘)의 대답 = 목의 팔이 자리를 고쳐 잡았을 뿐 — 오답 소진"
      - "**도달점 = 질문:** `이 팔들이 힘겨루기를 하러 온 것이 아니라면, 내 힘은 어디에 쓰이고 있는 것인가`(정답 미도달 — EP22 창구)"
    evidence:
      scene: [1, 2, 4]

  - category: "threat"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**운반 진행:** 방재벽 밖 → 침수구역 → 깊은 수로. 물속 교대 흡착(놓는 소리만 늦게 도착)"
      - "재포박 우선 행동 2차 전시 — 목을 잡고 조이지 않음, 온 힘의 저항에도 자리 고침만(살상 회피의 관찰 누적)"
      - "훅 시점: 수평계 지면 표시 소실, 수심 증가 중 — 완전 부유(발바닥 접지 상실)"
    evidence:
      scene: [2, 4, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "감각 불일치 최초 경험 — 기울기·물소리·발바닥이 서로 다른 세계를 보고(`어느 세계가 진짜인지 정할 눈이 없었다`)"
      - "이상함의 목록: 조를 수 있는데 조르지 않음, 때릴 수 있는데 때리지 않음, 풀면 다시 감김"
      - "힘의 행방 의문 성립(질문 단계 — 해법 없음)"
    evidence:
      scene: [2, 4]

  - category: "relational"
    field_path: "characters.sua.state"
    operation: "advance"
    after:
      - "**정비실 첫 실전 합류(B3 비전투 이행):** 검은 화면·재난방송 교차 관찰, 예비전원 손잡이 확인(눈으로 세 번), 밀봉재 작업대 배치, 마른 수건 세 장"
      - "목록 이름 = `언니가 돌아올 때 필요한 것들`(돌아오면 아님 — 조사 선택의 신중함)"
      - "영진의 혼잣말(`부수려는 놈이 아니야`)을 적지 않고 기억함 — 답 유예의 방식 유지"
    evidence:
      scene: 3

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**살상 아님 감지(상한 문면):** `부수려는 놈이 아니야. ……모르겠다. 뭐가 다른지.` — 느낌+무지, 이유 미도달(EP23 추정 창구 보존)"
      - "단아와 같은 셈에서 같은 자리에 막힘(감각 불일치 문답의 침묵)"
    evidence:
      scene: [3, 4]

  - category: "living_condition"
    field_path: "external_conditions.military"
    operation: "advance"
    after:
      - "학생 대피 완료·주민 구래동 소개 완료·고지대 수용 진행"
      - "**추적 상실 국면:** 수상·수중 진입 장비 없음 — `보고만 계속해`. 위험구역 선 확장 1칸"
      - "침수구역 도면 = 오 년 전 정지(수몰 구도심 정보 공백의 정사화)"
    evidence:
      scene: 3

