canon_additions:
  - "시간: EP46 = 6/14(화) 아침~저녁. 통제는 이날 아침 해제"
  - "**가족 화계 정본(사용자 2026-08-12): 단아 → 영진 = 반말**(교신·보고 국면 포함). 수아 → 영진 = 존댓말, 수아 → 단아 = 반말. ※ 소급정정: EP44 4건·EP45 2건"
  - "**수아 단독 작업 금지 상시화(EP28 조건 1):** `혼자서는 안 한다` — 점검 장면에는 동행이 문면에 있어야 한다"
  - "**소문 출처 정본:** 밤·비·방재벽 밖 교전은 **불빛과 소리로만 목격된다.** 형체 목격·영상·개체 잔존물 0. 통제의 개폐가 시민의 유일한 승패 지표"
  - "**뒷마당 빨랫줄**(LOC-05 부속)"
  - "**군 기록 문법 확장:** 판단은 적지 않고 정황만 적는다(`판단은 문서의 일이 아니었다`)"
  - "격언 계보: `무섭다는 건 재미있다는 뜻이기도 해서, 애들은 늘 조금씩 웃었다` / `할 말이 없어서가 아니라, 할 수 있는 말이 없어서` / `모른다. 다만 달라지면 그건 적는다` / `무서운 게 정상이다` / `가는 게 아니라 훑는 것처럼 보였다`"
