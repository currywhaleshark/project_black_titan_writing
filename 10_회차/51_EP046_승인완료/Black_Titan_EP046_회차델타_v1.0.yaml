notes:
  - "S8 6/10 완료. 다음 **EP47 「집게」 — 전환·전투 진입.**"
  - "EP47 고정선(S8 개요): 농게형 출현 — **상륙 국면**(방재벽 근접·거대 비대칭 집게의 첫 실루엣) → 출격. 얕은 물을 따라온 결(EP46 훅)의 정체가 드러남"
  - "EP47~48 = **첫 육탄전 2부작**(EP48 = 중요 화·관절 역방향 꺾기). 전장 구조 선확정 필수 — **수몰 구시가지 아파트 단지는 EP45에서 엄폐 전량 소진**, 이번엔 다른 전장(방재벽 근접·얕은 물·상륙)"
  - "EP47 금지: 앵커 명명·설계(S9)·센티널 실체·정체 확정·새 증상"
