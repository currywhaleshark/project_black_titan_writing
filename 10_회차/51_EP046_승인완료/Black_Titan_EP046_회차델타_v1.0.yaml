  - id: "FS-C5-WHITE-SENTINEL"
    question: "먼 데서 준비되고 있는 것은 무엇인가"
    introduced_chapter: 46
    current_holder: ["작가용"]
    urgency: "SEEDED"
    expected_window: "사다리 = S8 외신 한 줄 → S9~S10 누적 → 관통상 회차 데뷔(그레이트 마징가 결)"
    allowed_interpretations: ["지면 = 무관해 보이는 해외 단신. 이름·사진·기체·국가 특정 0·인물의 해석 0"]

