    - "밥상에서 **「편하겠네요.」** — 왜냐고 안 묻는다. **둘 다 진짜 이유를 비껴서 같은 자리에 도착한다**"
    - "봄 공책 두세 줄 남은 채 며칠째. 표는 안 편다 — **점 두 개 그대로**"

relationships:
  - "**★★ 성호 ◐ — 앵커 관통에 열광.** 프레임을 세고 표에 세로줄을 긋고 **`업그레이드했겠지`로 닫는다.** **`틀린 설명이 제일 가까운 설명이었다`**. **정정 금지**"
  - "**★ 성호의 표와 수아의 표가 같은 것을 다른 도구로 보고 있다**(본인들은 모름)"
  - "**★★ 예진 ◐ — 이상함을 감지한다.** `끼어들 데가 없이 대화가 끝났다` · `오늘은 얹을 데가 없었다` · **`뭔지 모르는 채로, 뭔가라는 것만 알았다`**. **결론 0 · 캐묻기 0** → **EP75 다리**"
  - "**혜정 ● — 봉지의 대화.** 「잘 먹었어」/「어」. **양쪽 다 안 묻는다.** 균열 1회 = **「몸조리 잘해.」**(신발장을 보면서)"
  - "**★★ 박기태 ●(간격 12 회수).** **화계 정본:** →영진 **존댓말** / →단아 **반말 + 「조수」**. `어이, 조수.` · **`조수, 방학하면 인양장 와라. 일당 준다.` / `얼마요?` / `떡볶이.`**"
  - "**★ 기태의 눈:** `철문 쪽도 지나갔는데, 지나가는 눈이었다. 벽을 보는 눈과 문을 보는 눈이 다르지 않았다` — **어제의 혜정과 대비**"
  - "나래 ○ — 공책에 사슬 관통 장면. **`성호가 프레임을 세는 동안 나래는 선을 긋고 있었다`**"

