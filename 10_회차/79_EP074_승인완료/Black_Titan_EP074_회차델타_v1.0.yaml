    - "**★★ 고맙다는 말을 짧게 끊는다** — `길게 하려면 언제 먹었는지가 나오고, 언제 먹었는지가 나오면 언제 받았는지가 나온다`"
    - "**★ 철문 앞에서 손잡이를 당겨 본다.** 미안하다는 말 0 — `혼자 미안하다고 하면, 그건 잘못한 사람이 있었다는 걸 만드는 일이 됐다`"
    - "**떡볶이 약속을 먼저 낸다**(방학식 날 · 예진 포함). `갚는다는 말은 안 붙였다`"
    - "**★ 통화에서 저쪽에도 안 꺼내는 게 있다는 걸 느낀다** — **뭔지는 모른다**"
