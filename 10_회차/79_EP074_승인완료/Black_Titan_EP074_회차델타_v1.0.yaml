    - "닫히는 속도를 나사 반 바퀴로 조절. **세 번째 닫힘에서 만족**"
    - "기태와 부품 인수 — `부품이야 맞춰 넣으면 돌아가게 돼 있네`. **크레인 한 손 조작**(LOC-05 정본)"
    - "상자 뜯는 건 내일로 미룬다 — `오늘 몫의 일이 아직 하나 남아 있는 사람의 미룸`"
  sua:
