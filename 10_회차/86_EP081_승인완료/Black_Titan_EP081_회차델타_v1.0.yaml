state_changes:
  sua:
    - "**★★★ 첫 출격.** 체육복 등장(말 없음) → **보정값 간파** → 승낙 → 탑승"
    - "**★★ 수면학습 자각** — `저도 같은 걸 들었는데요`(EP2) · `깨닫기도 전에 손이 움직이고 눈이 보고 머리가 이해했다` · **`언니도 처음에는 같은 느낌이었을까`**"
    - "**★★ 자기 방식의 발견** — 언니 흉내 실패(피탄 1회) → `이건 자기 방식이 아니었다` → **`표에 적듯이. 지도를 그리듯이`**"
    - "**★ 앵커 조작 절차 습득**(정본 확정): 결속 해제 → 사출 → 하강 → **로켓 점화** · `자신이 언니에게 그림으로 보여 준 그 궤적`"
    - "**★★ 첫 살상 결심** — `모기 한 마리 잡는 것도 주저하던 수아` → `그 생각이 수아의 등을 밀었다`(하랑이 포함 목록)"
    - "**★★ 무자각 쾌감** — 무섭고 속이 안 좋은데 **몸이 가볍다.** `가벼운 게 뭔지는 생각하지 않기로 했다`"
    - "**장부: 점검자·탑승자 두 칸에 같은 이름** · 간격 칸 **9** 기입"
  dana:
    - "**★★★ 기립 불가** — 경보를 듣고도 몸이 순서를 시작하지 못함. `일어나지지 않는 몸으로는 반박이 안 됐다`"
    - "**모니터 앞이 전장이 됨** · **`조심해`** — 말리는 말이 아니라 **보내는 말**"
    - "**`잘하더라`** — `안심만 있는 얼굴은 아니었다`(**EP82 열등감 씨앗**)"
  youngjin:
    - "**★★★ 콘솔 앞에서 손이 없는 사람** — 둘 중 하나를 눌러야 하는데 둘 다 안 누름"
    - "**★★ 핑계의 재고 소진** — `댈 수 있는 이유가 처음부터 끝까지 핑계뿐이었다는 게, 핑계가 떨어지고 나서야 드러났다`"
    - "**★★ 승낙 = 아무것도 안 바꾸고 태움**(보정값 화면 안 엶)"
    - "**★★★ 즉각 기동을 혼자 안다** — `대답을 만들 필요가 없다는 게, 오늘 이 방에서 제일 무거운 일이었다` · **새 위장을 만들 자리는 아직 안 옴**"
    - "`잘했다`가 첫날에 나옴(아껴 쓸 새가 없었다) · **기록 저장**(= 다음이 있다는 뜻)"

relationships:
  - "**★★★ 수아 → 영진: 첫 정면 반박**(관찰의 진술 형태 · 공격성 0). `열두 살도 어렸다` = 후회에 가까운 대답"
  - "**단아 ↔ 수아: 역할 역전 개시** — 보내는 언니 / 나가는 동생"
  - "혜정 — 산길 복귀 중 · **이틀 공백 유지**(정보 반쪽 · EP82 첫 통화)"

