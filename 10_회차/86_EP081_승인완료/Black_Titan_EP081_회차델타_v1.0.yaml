  - "**★ 앵커 조작 절차 확정:** 왼쪽 조종간 2단 스위치(결속 해제·사출) → 하강 → **로켓 점화** → 권양기 회수"
  - "**★ 수면학습 = 자매 공통**(EP2 정본 · 수아도 절차 보유). 앵커는 **최근 장비라 수면학습에 없음**(관찰 학습으로 습득)"
  - "**교신 표기 = 큰따옴표**(겹낫표 금지 재확인)"

