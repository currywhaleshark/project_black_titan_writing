canon_additions:
  - "시간: EP49 = 6/15(수) 늦은 오후~밤 + 6/11(목) 학교·저녁"
  - "**정비 척도 상시화(EP33 정본):** 공업 규모 세척 — 고압세척기 총대(단아 몫)·비계·안전선 밖 진행표·손 들어 신호·발목 하나에 반나절. 관절 틈 = 팔뚝이 들어가는 틈 / 발바닥 홈 = 두 팔로 안는 콘크리트 덩어리. **손걸레·조각 몇 개 계열 금지**"
  - "**정비 갑판의 용도:** 기체 상부 손상은 갑판에서 눈으로 본다(발치 손전등으로는 안 보인다)"
  - "**방송 축 정본(EP9 승계):** 주간·개활지 교전은 찍힌다. 내부망 게시판에 영상이 오른다. **기체만 찍히고 조종석·조종자는 0**"
  - "**여론 3단계 정본:** 소문(무서움) → 걱정(못 봄) → **해석의 분열**(봤는데 말이 다름). 판단은 S10 이후"
  - "**수아의 기록 원칙:** 확실해지면 적고 아니면 안 적는다 — `틀린 게 하나도 없었다. 대신 빈 데가 많았다`"
  - "격언 계보: `나올 때는 이걸 잃으면서 나왔다. 들어갈 때는 되찾으면서 들어갔다` / `안 아픈 게 늘 좋은 건 아니다` / `할 수 있는 말이 없어서가 아니라, 하면 안 되는 말밖에 없어서였다` / `숫자를 쓰는 데는 일 초도 안 걸렸다. 쓰고 나서 보는 데 오래 걸렸다`"
