notes:
  - "S8 9/10 완료. 다음 **EP50 「간격」 — 아크 마감.**"
  - "EP50 고정선(S8 개요): 생활과 관측의 교차(도시의 여름·폭염 초입·수산시장 결) / 군 = 공세 전환 판단 기록(내부 층위) / **각자의 준비**(영진 = **조달 목록을 적기 시작**〔앵커의 씨앗·명명 0〕, 수아 = 기록 체계 확장, 단아 = 몸 만들기) / **훅 = 외해의 크고 느린 질량**(투구게형 예고) — `들어오는 것들의 간격이, 확실히, 좁아지고 있다`"
  - "EP50 = S8 마감 화. **종료장부 대조서 + 아크캡슐 S8** 필요"
