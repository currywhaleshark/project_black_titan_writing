notes:
  - "S8 2/10 완료. 다음 **EP43 「낯익은 신호」(표준 화 — 전환).**"
  - "EP43 고정선(S8 개요): 영진 대조 = 봄 기록과 겹치는 이동 패턴(굴러가던 놈의 결 — 명언 0 유지) / 군 공개 통지(외곽 통제 재개 — 봄 문법 재가동) / **수아 = 가시 조각(선반 아래 통)을 꺼내 오는 손**(대조 준비 — 확인자 재가동) / 학교 = 통제 소문 온도"
  - "EP43 훅(개요): **방재벽 밖 수면 — 물을 가르며 접근하는 반구형 실루엣. 봄과 달리, 멈추지 않고 곧장 온다**"
  - "EP43 금지: 실체 확정 명언 0(실루엣·패턴 층위), 가시 조각 대조 결론 0(EP45 몫), 새 증상 0"
