approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-12"
  approval_note: "브리프 교정 3건 → v0.2(첫 경보·출격 동선·타격) → v0.3(수아 전투 교신 배제) → `좋아 이렇게 정리`. S8 7/10 — 전환·전투 진입."
based_on_snapshot: "SNAP-046 v1.0"
produces_snapshot: "SNAP-047 v1.0"
changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**신규 개체 출현(6/15 오후) — 상륙 국면.** 넓적하고 낮은 몸통(키 = 기체 허리께), **한쪽 집게가 몸통만 함**, 반대쪽은 작음(접힌 채 **한 번도 움직이지 않음**), 다리 여덟"
      - "**행동:** 옆으로 이동하며 **갯벌에서 안 빠진다**(하중 분산). 큰 집게로 **치고·막고·밀고·휘두르고·찌른다** — 다만 **크고 무거워 느리다**(궤도가 다 보임)"
      - "**숨지 않는다:** 개활지 한가운데서 기다림. 접근해도 물러나지 않음(여기서는 저쪽이 빠르므로 물러날 이유가 없음)"
    evidence:
      scene: [3, 4]

  - category: "situational"
    field_path: "external_conditions.sea"
    operation: "advance"
    after:
      - "**신규 전장 정본 — 방재벽 바깥 갯벌·모래톱(상륙 접근로).** 수심 = **무릎 아래**(마른 데도 있음), **엄폐 0**, 지반 = 개펄, 변수 = **밀물**(들수록 물러짐·약 두 시간)"
      - "**이족 하중 정본:** 52m 하중이 발 두 개에 집중되어 **박힌다.** 한 걸음마다 뽑아야 하고 뽑는 동안 묶인다. 다족은 분산되어 뜬 채로 지나간다"
      - "**출격 동선의 물성:** 수몰역 밖은 아직 물 → 해안으로 걸어 나오며 가슴→허리→무릎으로 낮아짐 → **물이 받쳐 주던 것이 빠져나가며 몸이 무거워진다**"
    evidence:
      scene: 2

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**불리한 지형의 첫 경험:** 봄의 승리들(턱·갑판·크레인)이 전부 무거워서 된 일이었는데, **여기서는 그 무거움이 발을 땅에 박아 넣는다**"
      - "**보이는데 못 피한다(원인 = 지형):** 집게는 느려서 궤도가 다 보이고 봄이었으면 피했을 속도인데, 발이 안 빠져 못 피한다"
      - "**일어나는 데 걸리는 시간이라는 위기:** 넘어짐 자체는 EP30 선례가 있으나, 그때는 물이 받쳐 줬다. 개펄에서는 **짚는 손이 박힌다** — `힘이 모자란 게 아니었다. 힘은 남았다. 그래도 못 일어났다`"
      - "**갯벌 대처법 두 가지(현장 습득):** ① 한 점으로 짚으면 박히니 **팔을 넓게 펴서** 짚는다 ② 발은 뽑는 게 아니라 **다리째 밀어 올리듯 끈다**"
      - "**보이는 자리에서 싸운다는 부담:** 방재벽 위·통제선 밖의 시선. `검은 거인이 갯벌에 넘어져서 못 일어나고 있는 걸로 보일 것이다`"
    evidence:
      scene: [2, 3, 4, 5]

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**여름 두 번째 출격(주간).** 큰 집게 1격을 왼팔로 막음 — **관통 0·밀림 대**, 발이 박힌 채 상체만 밀려 **전도.** 전투 미종결(EP48 연속)"
      - "무장 없음 유지. 발바닥 이물(EP46)은 여전히 미처리"
    evidence:
      scene: 4

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "**주간 통제 경보 발령 → 하교 조치**(6/15 오후·5교시 중). 교실은 봄에 익힌 절차대로 움직임 — `설명이 필요 없어졌다는 건 익숙해졌다는 뜻`"
      - "**주간·개활지 교전 → 관측 조건 개선.** 방재벽 위·통제선 밖에서 다수 목격(형체 층위·조종자 인지 0). ※ 형체 노출 자체는 봄에도 있었음"
    evidence:
      scene: [1, 4]

  - category: "relational"
    field_path: "relations.dana_hyejeong"
    operation: "advance"
    after:
      - "**혜정 반의식 3눈금:** 하교 갈림길에서 어디 가냐고 묻지 않고 보내되, **두 걸음 가다 멈춰 돌아보고** `조심해서 가`를 덧붙임 — `그 말을 왜 굳이 붙였는지는 본인도 몰랐다`. 명명·추궁 0"
    evidence:
      scene: 1

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**전투 교신의 단독 창구화:** 물때·상태·경고가 전부 영진의 입으로 나감(수아 배제 정본). `있다. 두 시간쯤 본다.` / `그 안에 끝내라.` / `아까보다 빠르다.` — **급할 때도 급하다고 말하지 않는 사람이 속도를 두 번 말함**"
    evidence:
      scene: [2, 4]

