notes:
  - "S8 7/10 완료. 다음 **EP48 — 중요 화(첫 육탄전).**"
  - "EP48 고정선(S8 개요): **거대 집게와의 육탄전** → **관절 역방향 꺾기**로 결착. 사용자 추가: **작은 집게가 결정적 순간에 딱 한 번** 쓰인다"
  - "EP48 = 시간 경과 0(같은 오후의 연속). 전장·밀물 승계 — 물이 더 들어와 개펄이 더 물러진 상태에서 시작"
  - "EP48 금지: 앵커 명명·설계(S9)·센티널 실체·정체 확정·새 증상"
