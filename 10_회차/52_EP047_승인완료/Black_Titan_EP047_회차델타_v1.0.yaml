canon_additions:
  - "시간: EP47 = 6/15(수) 오후. EP46 저녁 신호에서 밤새 북상 → 낮에 상륙 시도"
  - "**갯벌 전장 정본:** 방재벽 바깥 모래톱 — 무릎 아래·엄폐 0·개펄·밀물(약 두 시간)"
  - "**이족/다족 하중 정본:** 52m 하중이 두 발에 집중되면 박힌다. 다족은 분산되어 뜬다. **아이의 셈으로만 서술**(`여덟 개로 나눠 디디니까`)"
  - "**출격 동선의 물성 정본:** 수몰역 → 걸어 나오며 물이 빠져나가고 몸이 무거워진다"
  - "**수아는 전투 교신에 참여하지 않는다(사용자 2026-08-12):** 출격 전후 관측·점검·지형까지. **예외 = EP38의 결정적 한 문장**"
  - "**첫 사이렌 정합:** 3월 **체험학습 현장**(교실 아님). 인솔 교사가 먼저 당황"
  - "**목격 서술 금지:** `처음으로 형체가 보인다` 계열 — 봄에도 낮 싸움이 있었고 형태가 드러난 적 있다"
  - "격언 계보: `물이 받쳐 주고 있었다는 걸 물이 없어지면서 알았다` / `봄에는 그게 좋은 거였는데` / `힘이 모자란 게 아니었다. 힘은 남았다. 그래도 못 일어났다` / `무거운 것이 무거운 것을 친 충격이 몸 안쪽에서 두 번 울렸다`"
