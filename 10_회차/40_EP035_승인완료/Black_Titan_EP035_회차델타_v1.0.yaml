canon_additions:
  - "시간: EP35 = 5/15 일 오후~밤(연속·귀환). **S6 = 5/12 목~5/15 일(나흘)**"
  - "**격파체 용해 정본 재확인:** 기능 정지체는 물속에서 형태를 오래 지키지 않음 — 겉에서부터 흐려져 소멸, 잔해·경화 조각만 침전. **군 수거물 없음 5차**"
  - "**정적 승리 정본:** 비우세손 맨손 카운터 1회 + 관성 역이용 — `기다린다→한 번 밀어 넣는다→다시 멈춘다→관성이 스스로 부순다`"
  - "구분 감각 정본: 가짜 압력파 = 잔해 바깥 밀림 / 진짜 돌진 전조 = 관 안쪽 흡입"
  - "C1 기록 관행: 손 감각 항목 = 장부 등재 + 발생·소실 시각 기입(영진)"
  - "잔여 관망: 주인 잃은 관들 = 수몰 구도심 잔존 구조물(후처리·S7 소재 가능)"
