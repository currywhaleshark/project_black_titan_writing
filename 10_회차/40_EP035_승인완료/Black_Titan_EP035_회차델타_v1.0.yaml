  - "다음 = **S7 「두 개의 흔적」(가칭 — S7 개요 v1.3 확인) 개시, EP36 「깁스를 벗은 날」(표준 화 — 생활 진입/두 갈래 식별).** 고정선: 소프트볼 표적 던지기 재대결(마지막 한 번 남기고 종료)·B1 문면(`오늘은 또 먼저 갈 수도 있어`/`대신 끝나면 끝났다고 보내`)·수아 기록 겹치기(해석 0)·군 갈라진 경로(화물부두 바닥/크레인 기초 이탈)·훅(크레인 꼭대기의 접힌 검은 덩어리·바람 없는데 들리는 끝)"
  - "S7 이후 미지불 창구: 컵볶이 회수(생활 화), 깁스 첫 줄(재대결 국면), 서랍 사진(별도 결정)"
