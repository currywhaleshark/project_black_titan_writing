canon_additions:
  - "시간: EP54 = 6/21(화) 하루. 새벽 귀환 후 두어 시간 자고 등교"
  - "**★ 간척지 용도(사용자 확정):** 방재벽 밖 매립지 — **논·농지 아님.** **창고·야적장·수문 관리동·배수펌프장.** 일하는 데지 사는 데가 아니다 → 침수 피해 = 물건과 장비, **인명 피해 0**. ※ EP52 승인본 1곳 소급정정"
  - "**호칭의 축약:** 오미란은 **시장에서 `수리점 손녀`, 수리점 안에서 `손녀`.** 장소가 이미 말해 주는 것은 호칭에서 뺀다"
  - "**★ 수아가 이름을 안 붙이는 이유:** **`붙이면 그렇게 부르게 돼.`** 명명 게이트가 작가 규칙이 아니라 **인물의 판단**으로 성립"
  - "**`남은 것`** = 개체 표 예약 칸의 정체(EP50 회수). 봄에는 아무것도 안 남았고 여름 들어 남기 시작한다"
  - "**여론 5단계 — 손해의 발견:** `그럼 이긴 거야, 진 거야?` **비난이 아니라 농담으로 온다**"
  - "**값의 층위:** 종이 위 숫자는 짧지만 실제는 창고 여러 개 값이다"
  - "격언 계보: `자다 만 잠은 안 잔 것보다 이상하다` / `자기가 한 일인데 자기가 못 치우는 일이 됐다` / `뭉개졌다는 건 밟혔다는 뜻이다` / `지우면 지운 자리가 남는다` / `화를 낼 데가 없어서 말이 끊긴 것 같았다`"
