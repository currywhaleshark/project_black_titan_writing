notes:
  - "**S9 4/12 완료.** 다음 = **EP55 「붙은 것들」 — 따개비형 전투(진입)·인프라**"
  - "EP55 잠금(S9 개요 v1.5): **경보가 아니라 소문으로 시작한다**(부표는 조용했고 장부에도 없다 — **관측 체계가 놓친 첫 사건**) / 방재벽 바깥면·수문 이음매의 껍데기들 / 손가락이 안 들어가고 **두들기면 벽이 먼저 깨진다** / **낮·도시 코앞 → 목격 3단**(형체를 본다)·여론이 **불안**으로 / 훅 = **언제부터 붙어 있었는지 아무도 모른다**"
  - "**EP54 훅이 EP55의 입구다:** `본 사람이 오늘 안 나왔어요. 들은 사람이 말한 거라 확실한 건 아니고`"
  - "미수령: **목요일(6/23) 대형 트럭** — 닻 포함(지면 특정 금지). EP55는 6/22 예상이므로 아직"
