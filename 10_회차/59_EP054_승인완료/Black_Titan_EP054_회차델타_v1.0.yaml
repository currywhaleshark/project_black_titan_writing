schema_version: 2
chapter: 54
approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-13"
  approval_note: "브리프(간척지 용도 확정 동반) → Level 6 → 초고 → 첨삭 2차(6건) → `오케이`. **S9 4/12.**"
based_on_snapshot: "SNAP-053 v1.0"
produces_snapshot: "SNAP-054 v1.0"
changes:
  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**★ 간척지 복구 개시(6/21 아침):** 트럭 세 대·인력·장화와 삽·접힌 파란 천. **며칠짜리 일**이다. 방재벽 쪽으로 아침 일찍 들어감"
      - "**침수 피해 확정:** **창고와 야적장**이 잠겼다. 위쪽은 덜, 아래쪽은 다. **사람은 안 다쳤다**(인명 피해 0)"
      - "**어민회 피해:** 그물 감는 기계 모터 침수 → 안 돌면 **그물 손질이 사람 손으로** 넘어가고 **하루에 되는 양이 반으로 준다**"
      - "**수리점 일감:** 간척지 창고에서 나온 물 먹은 물건들 — 양수 펌프·발전기·상자 여럿. **흙탕물 자국이 다 같은 높이**"
    evidence:
      scene: [1, 5]

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "**★ 여론 5단계 — 손해의 발견:** 소문(무서움) → 걱정(못 봄) → 해석의 분열 → 소진 → **`그럼 이긴 거야, 진 거야?`**"
      - "**비난이 아니라 농담으로 온다.** 웃기려고 한 말이고 실제로 몇 명이 웃는다. **항의·원망 0**(S10 학교 파손 몫 보존)"
      - "**밤이라 형체 목격 0.** 결과만 안다 — `밤이었잖아. 우리 아빠가 오늘 새벽에 나갔어.`"
    evidence:
      scene: 2

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 값은 자기가 못 치른다:** `자기가 한 일인데 자기가 못 치우는 일이 됐다. 치우는 건 저 트럭에 탄 사람들 몫이고, 단아는 학교에 간다`"
      - "**미안함의 두 방향:** `미안한 건 아니었다`(안 부수면 수문이 부서졌다) / `그런데 안 미안한 것도 아니었다`. **자책의 언어화 0**"
      - "**설명할 수 없음:** `이겼다고 말하고 나면 물이 안 빠지는 건 어떻게 설명하나. 이긴 사람이 부순 건데` — 다만 **아무도 안 묻는다**"
      - "**자기가 부순 것이 자기 몸에서 나온다:** 발바닥 홈의 콘크리트·철근. **`뭉개졌다는 건 밟혔다는 뜻이다`**"
      - "**값의 층위:** 종이 위 숫자는 짧지만 실제는 창고 여러 개 값이다. `그게 다 어디에 적히는지 단아는 몰랐다. 어딘가에는 적힐 것이다`"
      - "※ **팔 무거움 지속**(어제 노동의 여운·**증상 아님**·`아픈 건 아니고 그냥 무거웠는데`)"
    evidence:
      scene: [1, 2, 3, 5]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**★ 개체 표의 예약 칸 정체 공개 = `남은 것`**(EP50 회수). `몰랐어. 그냥 생길 것 같았어.` — **봄에는 아무것도 안 남았다**(용해·수거물 0)"
      - "**첫 줄:** `배수로. 물 안 빠짐.` 언제·누가·얼마는 안 적는다. **확실한 것만**"
      - "**개체 기록(이름 없이):** `넓적함. 낮음. 폭은 기체 두 배.` / `밀고 깔아뭉갬. 때리지 않음.` / `바닥에 붙어 다님.`"
      - "**★ 명명 거부의 이유가 대사로:** `이름을 모르니까.` → **`붙이면 그렇게 부르게 돼.`** 명명 게이트가 **인물의 판단**으로 성립"
      - "**간척지 종이 처리:** 붙이거나 끼우지 않고 **표 옆에 나란히** — `여기 둘 거야. 아직 볼 일 있을 것 같아서.`"
      - "**세척 진행표 운용:** 안전선 밖·손 들어 신호·끝난 데 줄 긋기(EP33·EP49 계보)"
    evidence:
      scene: [3, 4]

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**단아가 자기 필적을 다시 본다:** `낮에는 몰랐는데 지금 보니 정말 삐뚤었다. 칸을 넘어간 데가 두 군데였다` → **`지울까 하다가 말았다. 지우면 지운 자리가 남는다.`**(수아의 원칙을 단아가 쓴 자리)"
    evidence:
      scene: 4

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**세척 진행 중(6/16).** 오전 = 어깨 자국·팔 완료. 오후 = **발 한 짝.** 나머지 한 짝은 다음 날"
      - "**발바닥 홈 이물:** 콘크리트 **두 팔로 안는 덩어리 셋** + 작은 것 여럿 + **팔뚝 굵기 철근**(끝이 뭉개짐). 발가락 관절 틈은 갈고리로"
      - "관통 0·손상 표시 0·통증 0. 무장 없음"
    evidence:
      scene: 3

  - category: "situational"
    field_path: "assets.youngjin_repair_shop"
    operation: "advance"
    after:
      - "**조달 목록에 새 줄:** **`발에 뭐라도.`** — 두루뭉술·용도 0·명명 0. `두루뭉술한 줄이 하나 더 늘었다는 것만 확실했다`"
      - "목록 옆 칸의 `버틸 것이 없다.`(EP53)는 그대로. **답이 아니라 필요만 적힌 상태**"
      - "**접수 장부:** 품목·상태·예상 일수·값. 간척지 창고 건이 들어옴"
    evidence:
      scene: [5, 6]

