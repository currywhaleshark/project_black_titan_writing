state_changes:
  dana:
    - "**★★ 옹호가 안 들린다.** `막은 얘기는 다 잘 들렸다. 잘 들리는데 남지가 않았다. **남는 건 못 막은 쪽 얘기일 텐데 그 얘기를 하는 사람이 교실에 없었다**`"
    - "**★★ 게시판 한 줄을 본다** — `저것들은 거인 있는 데로 온다`. 열몇 자. **오늘 들은 말 중에 제일 짧았다**"
    - "**★ 반박을 만들다가 멈춘다.** `그 하나는—`에서. **`그 뒤를 채우면 무슨 문장이 나오는지 알 것 같아서 안 채웠다`**"
    - "**★ 몸살 산발 ②** — 왼손 연필 낙하. `방금 것만 이상했다`. **본인 정리: 잠을 못 자서.** EP63·66과 연결 0"
    - "**부서진 학교를 낮의 눈으로 본다.** `부서진 데를 보는 게 어제 부서지는 걸 보는 것보다 힘들었다`"
    - "교실 웃음에 **웃어야 해서 웃는다.** 예진의 설명이 웃음을 끝내 준 틈에 **웃는 얼굴을 내려놓는다**"
    - "**★★ `열 마디가 있었다. 아홉 마디는 고마워하는 말이었다. 기억나는 건 한 마디였다`**"
  sua:
    - "**★★ 복도에서 군 자료 오독을 듣는다** — `저것 근처가 위험하다고. 좌표까지 있대.` **그 표를 실제로 본 사람이 복도에 수아뿐이다**"
    - "**정정하지 않는다.** `말하면 그다음에 어떻게 아느냐는 질문이 온다`. **`표를 읽을 줄 아는 사람이 그 복도에 하나뿐이었는데, 그 하나가 아무 말도 못 하는 사람이었다`**"
    - "걸음이 **반 박자** 느려졌다가 돌아온다"
    - "간격 칸 다음 줄 = **3인 걸 안다.** 적지 않는다 — `빈칸을 빈칸대로 두었다`"
    - "**봄 옮겨 적기 마지막 장이 가깝다** — 남은 줄 열 줄 미만"
  youngjin:
    - "**학교 공사 = 다음 주.** `학교는 빨리 해 준다` / `애들이 갈 데가 없으니까`"
    - "도로는 입찰, 방파제는 밀림, 학교는 다음 주 — **순서의 이유를 한 줄로 말하고 더 안 한다**"

relationships:
  - "**★★ 혜정 — 창가 줄이 드디어 맞았다**(EP30·EP67 회수). `내가 창가라 그랬지` / `자리가 바뀌었잖아`. **그리고 웃고 나서 이상해진다** — 바뀐 이유가 교실이 부서져서다. **혜정도 그 생각이 났는지 그다음 말은 안 한다**"
  - "**혜정은 쉬는 시간마다 두 줄을 건너온다.** 책상 모서리에 걸터앉는다"
  - "**게시판 글에 `누가 이런 걸 써` 한 마디.** 손가락 한 번으로 넘긴다. **그 뒤로 다시 안 꺼낸다**(밤 통화에서도)"
  - "**★★ 최나래 ●(간격 56 회수).** 사슬이 **감기는 방향까지 맞게** 그려져 있다. 어제 것도 그렸다 — `교실에서는 웃겼다. 여기서는 안 웃겼다`. **한 줄: `얘는 잘못 안 했는데.`** **오늘 들은 말 중에 제일 오래 갔다**"
  - "**★ 예진 ● 분량 확대** — 창고 추측(밤에 혜정이 인용) · **흉내 분석으로 웃음을 끝낸다**(`벽은 도구였던 셈`) · 과학실 냄새"
  - "**성호 ●** — 어제 개체 수를 센다. **`스물몇은 거기 있었는데 하나만 왔잖아. 하나만 온 게 이상하다고.`** 답은 안 낸다"
  - "**강한결 ◐(간격 49)** — 책상 나르기. 세 개째도 들려다 제지당함"
  - "**임유정 ◐(간격 40)** — 복도 이동 지휘. `자기 반 것부터`"
  - "**김주호** — `당분간 여기서 한다` / `되면 말해 준다` ×2. **질문을 닫는다**"
  - "장우진 ● — 등 문지르는 흉내로 교실을 웃긴다"

world_changes:
  - "**임시 교실 개시** — 특별실 층, 과학실 옆 빈 교실. 사물함 없음 · 창밖은 후관 벽"
  - "**★ 결석 2명**(어제 일로 집에서 안 보낸 집이 두 집)"
  - "**운동장 파임은 사람 키보다 깊다.** 포클레인이 메우다 말았고 접근 금지 띠가 한 겹 더"
  - "**★★ 여론 개시** — 옹호가 주류, **비난은 게시판 한 줄 + 복도 한 번**"
  - "**★★ 군 자료 오독(§1-H ②)** — `미확인 대형체` 좌표가 **위험 표시로 읽힌다.** 군은 그런 뜻으로 쓰지 않았다"
  - "**학교 공사 = 다음 주 착공**(도로·방파제보다 우선)"

canon_changes:
  - "**★ 명명 게이트 재확인** — `타이탄`은 가족 3인 한정. 외부 게시판·소문은 **`거인`** 계열"
  - "**★ 척도 규칙 2차 확인** — 52미터 전투 흔적을 사람 척도로 서술하지 않는다(정본카드 등재)"
  - "**청해남초 임시 교실 = 특별실 층 과학실 옆**"

