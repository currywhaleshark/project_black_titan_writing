schema_version: 2
chapter: 53
approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-13"
  approval_note: "브리프 → Level 6 → 초고 → 첨삭 2차(5건 + 귀환 정본 코멘트) → **영진 지원 범위 지적 반영**(가드 ②-B 신설) → `좋아`. **S9 3/12.**"
based_on_snapshot: "SNAP-052 v1.0"
produces_snapshot: "SNAP-053 v1.0"
changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**격파 완료(질량형).** 간척지 배수 암거 복개 구간이 무너지면서 통째로 빠짐 → 기울어 드러난 **아랫면**을 왼팔로 **한 번** 쳐서 결착"
      - "**아랫면 정본:** 등과 다르다 — 색이 옅고 표면이 갈라지고 물에 오래 담근 듯 부풀어 있다. **껍질이 아니다**(바닥에 붙는 자리라 만들 필요가 없었을 것)"
      - "**다리 확인:** 물 아래에 가려 안 보이던 다리들이 뒤집히며 드러남. **수는 세지 않음**(`많다`) — EP52 `다리가 몇 갠지도 안 보였다` 회수"
      - "**강점이 패인:** 낮은 무게중심·넓은 접지가 밀 때는 이유였는데, 꺼진 뒤에는 **기어 나올 자세를 막았다**"
      - "용해·수거물 0(관례). 저것은 안에서 한 번 움직였다가 멈춤"
    evidence:
      scene: 5

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 밀리는 걸 이용한다:** `그러면 밀리자. 대신 어디로 밀릴지는 내가 정한다.` — **EP23 계보**(`팔 여덟 개짜리 괴수와 마찬가지다. 그때도 끌려가는 방향을 내가 정했다`). EP48 흘리기가 막힌 자리에서 **흘릴 수 없으면 같이 간다**로 뒤집힘"
      - "**유인에는 값이 있다:** 옆으로 한 발 가면 뒤로도 한 발. 두 걸음 → **네 걸음**"
      - "**★ 좁게 딛는 것이 무기가 된다:** 하중이 한 점에 모인다 — **넓게 깔린 저것은 못 하는 일.** EP52에서 지게 만든 바로 그 성질"
      - "**콘크리트는 한 번에 안 깨진다:** 금이 가고 넓어지고 조각이 내려앉는다(봄에 물 먹은 기계를 뜯으며 배운 결)"
      - "**소리로 아래를 읽는다:** 짜부라지는 소리 ↔ **낮고 오래 남고 아래로 퍼지는 소리**(통을 두드리는 소리). 소리 나는 자리가 **선을 이룬다**"
      - "**싸움의 형태가 바뀌었다:** `봄에는 부수고 꺾고 던졌다. 지금은 밟고 있다` — 무섭고 **지겹다**"
      - "**이겨도 대가가 남는다:** `밟을 때는 저게 무너지면 이긴다는 것만 생각했다. 무너진 다음에 뭐가 남는지는 생각 안 났다` / **`이런 건 이기고 나서 알게 된다`**"
      - "※ **성장으로 읽으면 안 됨:** `기술이 는 게 아니었다. 칠 자리가 나와 있었을 뿐이다` / **`이겼다는 말이 안 나왔다`**"
    evidence:
      scene: [2, 3, 4, 5, 6]

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**★ 지원 범위 정본화(사용자 확정):** 영진은 **메카닉이지 전략가가 아니다.** 이번 화에서 다섯 층을 집행 — **관측**(`왼쪽.` 먼저 봄) / **지형**(`왼쪽은 수문에서 멀다. 계속 가라.`) / **몸**(`어깨를 붙이고 허리로 받아라. 팔로만 받으면 팔이 먼저 간다.`) / **절차**(`지나가면 한 번이고 밟으면 두 번이다.`) / **사후**(`물은 다시 빼면 된다.`)"
      - "**답은 안 준다. 권한을 넘긴다:** `여기 도면은 나한테 없다.` → **`네 발이 도면이다.`** → `네가 안에 있다.`"
      - "**시야의 분업이 협업의 근거:** 화면을 보는 사람은 위에서 내려다보고, 조종석에 있는 사람은 앞만 본다"
      - "단아의 수용: `위로하는 말이 아니었다. 그냥 아는 사람이 하는 말이었다. 그런데 그 말을 듣고 나니 조금 나았다`"
    evidence:
      scene: [2, 3, 4, 5, 6]

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**★ 값을 말 없이 치른다(EP49 역상):** 단아가 간척지 종이의 진한 줄 위에 **점을 찍고** 그 옆에 **`소리 다름.`**이라고 적어 돌려준다. **수아 글씨보다 크고 삐뚤어 칸을 넘어간다**"
      - "**수아의 종이에 단아의 필적이 처음 들어간 자리.** EP50 넉 장 → EP51 관측 기입 → EP52 지형 종이의 다음 칸"
      - "**수아의 반응도 말이 아니다:** 점을 보고, 글씨를 보고, **글씨가 삐뚤어서 두 번 본다.** 그러고 접어 **점검표 밑에** 끼운다"
      - "`아무 말도 안 했다. 그건 이 집 사람들이 다 할 줄 아는 일이었다`"
      - "※ **`네 덕분이야`(EP49) 재사용 0.** EP49 = 말로 줬고 수아가 몰랐다 / EP53 = **말이 없고 수아가 안다**"
    evidence:
      scene: 6

  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**★ 간척지 배수 시설 붕괴(이번 화의 대가):** 배수 암거 복개 구간이 무너져 **물이 안 빠진다.** 수면이 무릎 아래 → **정강이 중간**까지 올라옴. `물은 계속 오는 중이었다`"
      - "저층 구조물 파손(EP52) + **배수로 붕괴**. 영진 = `내일 사람들이 온다` / `물은 다시 빼면 된다`"
      - "**S9~S10 생활 잔류 예정** — 복구·불편이 여러 화에 걸쳐 남는다"
    evidence:
      scene: 6

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**교전 종료·귀환(6/21 새벽).** 관통 0·통증 0. 자세 붕괴 다수·**총 네 걸음 밀림**. 발바닥·다리 쪽 부하 누적(콘크리트를 반복해 밟음)"
      - "**왼팔 = 결착 타격**(좌측 하박 앵커와 정합). 무장 없음"
      - "**귀환 점검 개시**(수아·발부터). **세척은 아침으로**"
    evidence:
      scene: 6

