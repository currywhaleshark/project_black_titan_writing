canon_additions:
  - "시간: EP53 = 6/20(월) 밤 이어서 → 6/21(화) 새벽 귀환"
  - "**★ 영진의 지원 범위(상시 가드 §2-B):** 메카닉이지 전략가가 아니다. **기술적 조언·경험에서 나오는 몸 쓰는 법·관측 지원·절차·담백한 지지**까지. **전술 설계·적의 의도 추론·작전 판단·답**은 안 준다. 모르면 이유를 대고 **권한을 넘긴다.** 정서적 지지는 영진 나름으로 하되 **과하면 안 된다**"
  - "**시야의 분업:** 화면을 보는 사람은 위에서 내려다보고, 조종석에 있는 사람은 앞만 본다"
  - "**왼팔 = 주력 타격 팔**(좌측 하박 앵커와 정합)"
  - "**지반 붕괴의 문법:** 넓게 접지한 것은 그냥 지나간다고 안 꺼진다. 붕괴는 **유도**해야 하고, 유도는 **좁게 딛는 발**이 한다"
  - "**밀림의 운용:** 흘릴 수 없으면 **같이 간다** — 밀리는 걸 멈추지 않고 **방향만** 튼다(EP23 계보·EP48 실패의 뒤집음). **값은 뒤로 더 가는 것**"
  - "**소리로 아래를 읽는다:** 짜부라지는 소리 ↔ 낮고 오래 남고 아래로 퍼지는 소리. 소리 나는 자리가 **선을 이룬다**"
  - "**간척지 배수 시설 붕괴** — 물이 안 빠진다. S9~S10 생활 잔류"
  - "격언 계보: **`네 발이 도면이다`** / `지나가면 한 번이고 밟으면 두 번이다` / `물은 다시 빼면 된다` / `기술이 는 게 아니었다. 칠 자리가 나와 있었을 뿐이다` / `이런 건 이기고 나서 알게 된다` / `그건 이 집 사람들이 다 할 줄 아는 일이었다`"
