state_changes:
  dana:
    - "**★ 출격 가능 국면** — 8/12 붕괴 후 엿새째. 내려가는 승강기에서 숨이 한 번 참. `나갈 만하다는 게 요즘의 기준이었다`"
    - "**★★★ 명중이 성과가 되지 않는 첫 경험** — 앵커는 맞는다(한 번에 한 자릿수). **되감기 사이클 동안 수백이 지나간다.** `잘 맞았는데 아무 일도 안 일어났다`"
    - "**★★ 털어내는 동작** — 틈으로 파고드는 것을 손으로 뜯어냄. **싸우는 게 아니라 털어내는 것**(이 화의 첫 굴욕)"
    - "**★★★ 사슬 휘두르기 발명** — 앵커를 사출한 채 사슬을 길게 뽑아 회전. **점이 아니라 선.** 몸이 먼저 하고 나서 앎(단아 = 몸으로 깨닫는 쪽) · `사슬은 원래 회수용이었다`"
    - "**★★ 무시당함** — 그것들이 이쪽을 보지 않는다. 타고 넘어가고 틈으로 들어가고 지나간다. **여태 나온 것들과 다른 행동 양식**"
    - "**★★★ 벽을 못 막음** — 산을 무너뜨려도 다시 쌓임(무너뜨리는 시간 > 쌓이는 시간). **`안 돼`** 입 밖으로. 넘어간 것을 **소리로 먼저 앎**"
    - "**★ 경고 미수신** — 확성기·무전 모두 안 들림. **첫 발이 떨어지고서야 물러남.** `여태 저쪽이 이쪽에 말을 건 적이 없었다`"
    - "**★ 군함 목시** — 어선과 차원이 다른 배가 이쪽으로 포를 겨눔"
    - "**★★★ 마지막 한 마리** — 발밑으로 지나가는 하나를 밟아 터뜨림. **전과 인식의 왜곡:** 마구잡이로 한 것은 머리에서 지워지고 **의도하고 죽인 하나만 남는다**"
    - "**★ 감정 순서** — 안도 먼저(사람이 안 죽었다) → **`내가 한 게 아니었다`**"
  yeongjin:
    - "**★★ 레이더 첫 판독** — 화면에 **점이 아니라 면**. 크기는 작고 수는 셀 수 없음"
    - "**★ 장비를 먼저 의심** — `처음 잡은 그림이 이렇게 나오면 장비를 의심하는 게 순서다`. 단자 재접속 → 같은 그림"
    - "**★★ 판정 뒤집힘** — 시 경보 방송. `장비가 틀린 게 아니었네`"
    - "**★ `몇 마린지를 모르겠다`** — 여태 모르는 건 늘 정체 쪽이었다"
  sua:
    - "**★ 관측 표에 수 칸이 없다** — 필요가 없어서 안 만든 칸. **여백에 물음표 하나**"
    - "**★ `부표는 아직 안 울었는데요`** — 두 관측 체계의 불일치를 먼저 짚음"
  myeongjun:
    - "**★★★ 다섯 달 만의 포격 결정** — 3월에 결정타가 안 된다는 걸 알고 그 뒤로 포문을 안 열었다. 오늘은 벽이 넘어가는 중이라 **다 꺼냈다**"
    - "**★★ 판단 논리** — `남은 걸 다 써서 못 막으면 다 쓰고 못 막은 것이고, 안 쓰고 못 막으면 안 쓰고 못 막은 것이다. 둘 중에 나중에 설명이 되는 쪽은 하나뿐`"
    - "**★★★ 아껴 둔 헬기 투입** — **항공유 재보급 0 · 조종사 충원 0**(정본 v2.3). 띄우는 순간 새로 만들 수 없는 두 가지를 같이 쓴다"
    - "**★★ 짐작을 문서에 쓰지 않는다** — `짐작을 보고서에 쓰면 그게 다음에 근거가 된다` → **`나도 모른다. 그렇게 써라`**"
    - "**★★★ 확보 판단 성립(네 장면):** ① 벽이 넘어갔다 ② 거인이 못 막았다 ③ **거인이 경고를 무시했다** ④ **비장의 카드를 썼다** → **`통제 밖의 전력이 도시 안에 있다`**"
    - "**★ 검문선 유지** — 이긴 날에도 안 걷힘 · `이긴 날인데 방을 나서면서 기분이 좋지 않았다`"
  seojin:
    - "**★ 넉 달 비워 놨던 사유 칸에 처음으로 적을 게 생김**"
    - "**★ 소모 보고를 읽는 데 시간이 걸림**(탄약 절대 부족의 지면 표현)"

