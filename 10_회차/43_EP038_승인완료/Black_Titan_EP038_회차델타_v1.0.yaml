notes:
  - "S7 3/5 완료. 다음 **EP39 「본다, 간다」(중요 화 — 선택/협동 절단/첫 결착. 시간 경과 0 진입).**"
  - "EP39 고정선(개요 v1.2): **잘못 닿은 지정**(꽃 재개화·원반 회전 → 단아 마지막 순간 기초 뒤 완전 은신 → **젖은 기초 표면에 짧은 광택** → 꽃잎 재정렬 접힘) → **움직이지 않는 것을 덮다**(군부형 = 단아 아닌 **크레인 기초로** 미끄러짐·넓게 붙이고 운반막 폐합·외해 끌기 → 지반 박힌 구조물 안 움직임 → **자기 흡착발·갑판으로 묶임**) → **갱신 공백의 등반**(기초+군부형 등판 발판 → 상부 구조 → 꽃 펴지기 전 접근 — 경로·시점 = 단아) → **보는 쪽의 기능정지**(도망·반격 0 — 꽃잎 다발 모아 쥐고 **중앙 원반 반대 방향 비틀기** → 배열 붕괴·탐색/지정 정지) → C4: 새 지시 없는 군부형 = 기초 잡은 채 마지막 운반동작 반복(**아직 기능함 — EP40 결착 보존**)"
  - "EP39 훅(개요): 꽃 팔이 힘없이 접힌 뒤에도 부두가 한 번씩 울림 — 군부형이 기초 끌 때마다 뒤쪽 갑판 한 장 들었다 붙임 — 단아, 찌그러진 원반에서 손 놓고 아래를 내려다봄"
  - "EP39 금지(개요): 수아 추가 조언 0, 바다나리형 직접 공격 0(기능정지만), 군부형 기능정지 0(EP40 보존), 앵커·사슬·케이블·군 공격 0"
  - "EP40 예고 메모: B4 원문 `표적 던지기` = **티볼 마지막 타석으로 정정 필요**(EP36 정본). B1 문면(`끝났어`·`내일 와…`)·C1 봄 증상선·재분류 심의(작가용·해설 0)·초여름 훅(세 자릿수 속도) = 브리프에서 잠금"
