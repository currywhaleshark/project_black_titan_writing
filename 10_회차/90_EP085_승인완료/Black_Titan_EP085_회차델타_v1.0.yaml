state_changes:
  sua:
    - "**★★ 2차 출격 — 폭격기전 승리.** 회피의 계산 3단(감 → 투하점 독해 → **덮이지 않는 자리에 미리 서기**) · **강하 유도**(`못 맞히는 폭격기는 내려온다`) · **최저점 요격**(시간+높이의 한 점 · 선행 발사)"
    - "**★★★ 해방감 심화 — 하선 후에도 남음**(사다리·바닥·밥상까지). **서랍 넷째가 뻑뻑함** · `여는 날이 온다` 문장을 **만들어지기 전에 불을 꺼서 막음**"
    - "**★ 계산의 그늘** — `계산대로 된다는 것이 데리고 온 다른 종류의 것. 그게 뭔지는 안 봤다`"
    - "**★ 잘했다 2/2 수령** — 언니와의 격차를 **생각 안 하는 목록에 추가** · `안 낯선 게 낯설었다`"
    - "**첫 대공전 경험** — 위에서 오는 무서움(숨을 데가 없음) · 명중을 손이 먼저 앎(사슬 저항의 결)"
  dana:
    - "**★★ 「내가 갈게」가 성립 안 함** — 팔꿈치까지 세우고 실패(시도를 아는 사람은 본인뿐) · 모니터까지가 전장"
    - "**★★ 익숙함의 아픔** — `당연한 걸 보는 눈` · 심장이 안 빨라짐 · **`잘하는 걸 보는 일이 익숙해졌다는 것이 오늘 제일 아픈 것`**"
    - "**★ 자기 방식의 한계 학습** — `닿지 않는 상대가 있다는 걸 모니터 앞에서 배웠다`"
    - "**떡볶이(8/9) 불발 확정** — 문자를 미루고 결국 안 보냄 · `좁은 길은 낼수록 더 좁아졌다`"
  youngjin:
    - "**답을 안 낸 채 절차를 돌림** — `손은 머리보다 먼저 결정을 내리는 물건` · **`잘했다`를 같게 내는 데 힘이 듦**(수아 모름)"
    - "지연 기록 확인 · 무언(EP81 문법 유지)"

