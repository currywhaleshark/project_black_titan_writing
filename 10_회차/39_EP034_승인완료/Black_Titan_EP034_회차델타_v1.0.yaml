  - "왼손잡이 정본 강화: 젓가락·연필·주먹 전부 왼손 먼저. 오른손 = 서툰 손(공 반만·글씨 삐뚤)"
  - "영진 교신 문법 추가: `잘 찾았다`(해금 인정 — 칭찬 최소형)"
