notes:
  - "S6 5/6 완료. 다음 **EP35 「한 번만 움직인다」(중요 화 — 정적 카운터/결과/S7 인계. S6 마감 화: 종료장부+아크캡슐 S6).** **진입 = SNAP-034 위기 그대로(시간 경과 0)**"
  - "EP35 고정선(개요): 기다림(가짜 접근 번갈아·움찔마다 가동범위 소모·조류 침전 — 정지 = 오른손 한 번을 남기는 행위) / 흥분 가라앉히기(초조·불안·충동·경보음을 하나씩 흘려보냄) / **구분 감각: 가짜 = 잔해가 바깥으로 밀림, 진짜 직전 = 관 안쪽으로 물·가루가 빨려 들어감** / **결착(2-6 잠금): 양턱 완전 개방·달려드는 순간 — 오른주먹 한 번 곧게 → 뻗은 위치에서 정지 → 돌진 관성이 스스로 깊이 밀림 → 턱뿌리·점액 공급낭·전방 운동기관 파괴 → 오른팔에 걸린 채 기능 정지(주먹 끝까지 안 뺌)** / B2: 한 묶음 기록·잔류 제거 우선 / **C1 창구: 귀환 직후 오른손 검지·중지 수십 초 저림 → 곧 정상(원인 후보 전부 열어 둠·조종간 압박 제외)** / B3: 손 감각 항목·잔류 수치 받아 적기 / **훅: 손 감각 기록 옆에 시간 적는 영진 — 외해 두 방위에서 두 수면변위 동시 시작·나란히 청해 쪽으로(S7 예고)**"
  - "EP35 금지(개요): 군 공격 0, 저림 = 1회·수십 초·실신/보행장애/시야결손/확정 진단 0, 포스 피드백 통증 누출과 동일시 금지, 조종간 직접조작 묘사 금지(근전도·운동의도), 두 흔적 역할·계통 비공개, S7 결정적 관찰 보존"
