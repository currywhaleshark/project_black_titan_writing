  - "시간: EP34 = 5/15 일 낮~오후(전투 — **EP35 = 시간 경과 0 연속**)"
  - "**깨진 컵볶이 약속 정본:** 5/15 일 3시 분식집(예진 주선·EP32 무단 편입 건) — S6 마감 후 회수 소재(신규 미지불)"
