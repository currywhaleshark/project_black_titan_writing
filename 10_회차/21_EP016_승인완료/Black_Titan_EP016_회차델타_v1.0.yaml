      - "정비탑을 빈 수조로 밀어 넘어뜨림(동반 낙하 없음) → 평면에서 **벽 압박 제압**(굴리기 셈·기각 후 수조 벽 활용 — 사용자 정정, 개요의 `굴려 뒤집기` 대체)"
