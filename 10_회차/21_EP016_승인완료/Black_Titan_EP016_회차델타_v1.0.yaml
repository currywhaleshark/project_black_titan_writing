      - "**새벽 봄비에 붉게 용해**(G0-011 발동 — 사용자 지시: 회수 복선 차단). 배수구로 유실, 잔존물 0"
      - "작가용: 시도 03 실패 — 다음 내부 기록·포박형 예고는 EP18 훅"
    evidence:
      scene: [4, 5]

  - category: "informational"
    field_path: "military.record"
    operation: "merge"
    after:
      - "`수거물 없음` 세 번째 등재(EP4·EP10·EP16) — 적는 손이 익숙해짐"
      - "유도 인지: `미식별 거인, 접촉 없이 대상을 특정 방향으로 유도 중` + **`방송 끊지 마라. 저쪽이 쓰고 있다`**(공개방송의 도구화 묵인 — 협조 공식화 없음, `따지지 않는 것이 이 밤의 협정`)"
    evidence:
      scene: [2, 5]

  - category: "living_condition"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "핵심 발전 계통 보존. **보조 열교환·변전 구획 손상 → 복구 기간 며칠 순환정전 시행**"
      - "순환정전표 공개 낭독 개시 — **청해남초등학교·구래동 포함**(EP17 생활 청구서)"
      - "열교환 2호탑: 지지대 고정으로 존치(상부 변형). 폐쇄 정비탑: 붕괴(수조 안, 계획된 낙하)"
    evidence:
      scene: 5

  - category: "equipment"
    field_path: "assets.black_titan"
    operation: "merge"
    after:
      - "**조종석 상시 기록 기능 확립(블랙박스)** — 영진이 정비용으로 붙인 기능(사용자 첨삭·신규 사실). 전투 복기에 첫 사용"
    evidence:
      scene: 1

  - category: "informational"
    field_path: "story_time"
    operation: "merge"
    after:
      - "**요일 확정: 전투 다음 날 아침 = 토요일**(`오늘은 토요일이다`) — 역산: EP14 낮 = 금요일(수아 방과후 중단 공지와 정합)"
    evidence:
      scene: 5

