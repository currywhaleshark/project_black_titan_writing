canon_additions:
  - "시간: EP57 = 6/24(금) 아침~밤"
  - "**★ 앞마당 크레인(LOC-05 v3.1 등재):** 기둥 고정식 **지브 크레인.** 사람 손으로 못 내리는 물건을 트럭에서 내린다 — **영진이 이 일을 계속해 온 근거.** 조작부는 한 손으로 다룰 수 있는 위치. ※ **작가용(지면 0): 회전 반경 안에 자재 반입구 뚜껑이 들어온다**"
  - "**★ 영진 → 기태 화계 = 하게체 기조**(`~군`·`~한가`·`~하지`·`~하게`). 짧은 응답은 해라체(EP51). **반말 명령형 `~해` 0**"
  - "**★ 수아 → 단아 = 반말.** 수아 존댓말은 **영진에게만**. 같은 장면에 둘 다 있으면 청자별로 갈라 쓴다"
  - "**★ `남은 것` 칸 = 잔류 피해 기록**(수거물 아님). `배수로. 물 안 빠짐.`(EP54) → `방재벽 바깥면. 삭음.`(EP57). **이긴 것마다 한 줄씩 는다**"
  - "**우편의 관례:** 집에 오는 우편은 거의 다 영진 앞이고 단아 앞으로 오는 건 학교 인쇄물뿐이다. **손으로 쓴 봉투는 요즘 거의 없다**"
  - "**영진이 도움을 청하는 방식:** 청할 일이면 처음부터 말하고, 아니면 끝까지 혼자 한다"
  - "**옛 전철 차량기지:** 격납고 바닥은 평평하지 않다(가운데가 꺼져 있어 뭘 놓으려면 받쳐야 한다)"
  - "격언 계보: `무거운 것과 아픈 것은 다르다` / `웃는데도 얼굴이 무서운 사람이 있다` / `손을 두 번 닦고 받는 걸 봤으면 그다음은 안 묻게 된다` / `표는 생기고 나서 만드는 게 아니라 생기기 전에 만드는 거니까 늘 이런 게 남는다` / `이긴 것마다 한 줄씩이었다` / `급한 걸 하는 사람한테는 안 묻는 게 낫다`"
