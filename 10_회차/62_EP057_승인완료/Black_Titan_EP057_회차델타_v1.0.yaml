  approved_at: "2026-08-14"
  approval_note: "브리프 v0.2 → Level 6 v1.1 → 초고 → 첨삭 10건 + 코멘트 1건 → `좋아`. **S9 7/12 · 전투 0 · 봉인 재독 검사 3항목 통과.**"
