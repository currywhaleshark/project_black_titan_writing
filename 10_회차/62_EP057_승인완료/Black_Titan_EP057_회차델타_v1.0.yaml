changes:
  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**★ 조달 인도 완료(6/24 금 아침):** 기태가 **대형 트럭**으로 인양장 고철을 실어 왔다. 체인 두 뭉텅이·휜 형강 넷·**닻 하나**·드럼통 셋·도르래 한 무더기 외 다수. EP51의 `목요일에 큰 차 나가요`가 **하루 늦게** 지켜졌다"
      - "**★ 앞마당 크레인 지면 초출**(LOC-05 v3.1 등재) — 기둥 고정식 지브 크레인. 기태가 짐칸에서 고리를 걸고 영진이 크레인을 움직인다. **한 손 조작 가능**"
      - "**마당의 고철이 오후에 반쯤 없어졌다.** 긁힌 자국이 마당 안쪽으로 갔다가 끊긴다. **행선지 지면 0**"
      - "**★ 우편물 도착:** 손으로 쓴 봉투 하나. 받는 사람 = **도영진**. 반듯한 글씨·번진 소인·색 바랜 우표. **발신인란·내용물 지면 0**"
      - "**★ 격납고 한쪽이 작업장이 됐다:** 작업대를 기체 발치에서 벽 쪽으로 옮기고 조명 방향을 틀었다. 전선 세 줄이 바닥을 가로지른다. **훈련 뒤에 앉던 자리에 상자가 쌓였다**"
      - "**밤에 불이 안 꺼진다** — 철문이 열려 있고 규칙적인 소리가 올라온다"
    evidence:
      scene: [1, 2, 4, 6]

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "**여론 = 불안 지속.** 벽을 갈아야 한다는 말이 어른들 화제가 됐다. `그럼 그동안은?`에서 대답이 끊긴다"
      - "**소문의 출처가 없다:** `물어보면 다 자기가 본 게 아니고 누가 봤다는 거야`"
      - "**어제 일이 학교에서는 남의 일이다** — `거짓말은 아니었다. 다들 진짜로 남의 일이니까`"
      - "**★ 센티널 2단:** 학교 게시판 스크랩 구석의 두 줄 — 어느 나라 부두가 몇 주째 통제 중. **밑에 아무것도 안 적혀 있다.** 인물 반응 0"
    evidence:
      scene: 3

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 할아버지가 우편을 받는 방식이 달랐다** — 기름 묻은 손을 **두 번 닦고** 받았다. 작업대가 아니라 **부품장 맨 위 칸**에 세워 넣고 문을 닫았다(두 번)"
      - "**★ 그래서 안 묻게 됐다:** `물어서 안 될 게 뭐가 있나 싶기도 했다 … 그런데 손을 두 번 닦고 받는 걸 봤으면 그다음은 안 묻게 된다`"
      - "**봉투를 안 뒤집었다** — 뒤집을 이유가 없었다. **발신인 인지 0**"
      - "**작업장이 생겼고 앉던 자리가 없어졌다.** 금지령은 없었다. 반대편에서는 기체가 옆으로만 보인다"
      - "**밤에 불이 안 꺼진다** — 미닫이 틈으로 **가게 쪽에서** 빛이 온다(평소와 반대). **내려가 보지 않았다** — `급한 걸 하는 사람한테는 안 묻는 게 낫다`"
      - "**어제 일이 남의 일처럼 들린다** — `기분이 나쁜 것도 아니었다. 오히려 편했다`"
      - "※ 팔 무거움 = 노동의 여운. **`무거운 것과 아픈 것은 다르다`**. 새 증상 0"
    evidence:
      scene: [1, 2, 3, 4, 6]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**★ 우편물 수령.** 반응은 **손을 두 번 닦고 받는 것** 하나로만 나왔다. 설명·회상·표정 서술 0. 기태의 질문에 **한 박자 늦게** 대답"
      - "**작업장 개시:** `자리 좀 만든다` / `넓게 쓰려고` / `저쪽이 어둡잖아` — 셋 다 맞는 말이고 **뭘 만드는지는 0**"
      - "**★ 도움을 청하는 방식:** 도와 달라고 할 일이면 처음부터 그렇게 말하고, 아니면 **끝까지 혼자 한다.** 한 손이라 오래 걸려도 그렇다"
      - "**기태에게 하게체**(`도르래가 많군.`·`쓸 만한가?`·`천천히 하지.`·`점심 먹고 하게.`)"
    evidence:
      scene: [1, 2, 4]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**개체 표에 EP56 것 기재**(이름 없이): `납작함. 넓음. 벽에 붙어 있음.` / `뚜껑이 열림. 안에서 뭐가 나옴.` / `당기면 감김. 밀면 풀림.` / 두께 = 손가락 하나"
      - "**★ `남은 것` 칸 둘째 줄: `방재벽 바깥면. 삭음.`** 얼마나·언제·누가는 안 적는다(확실한 것만). 첫 줄 `배수로. 물 안 빠짐.`(EP54) 아래"
      - "**봉투를 봤다** — 저녁에 가게 쪽으로 한 번 나갔다 왔고 아무 말도 안 했다"
      - "**어디서 나왔는지 칸에는 `방재벽 바깥면`만.** 언제부터 있었는지 적는 칸은 **없다**(만들 때 안 만들었다)"
    evidence:
      scene: 5

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**★ 안 묻는 이유가 처음으로 구체화됐다** — 규범이 아니라 **관찰**이다. 손을 두 번 닦는 걸 봤기 때문에 안 묻는다"
      - "**동선이 바뀌었는데 아무도 그 얘기를 안 한다**(앉던 자리·상자·전선)"
    evidence:
      scene: [2, 4, 5]

  - category: "relational"
    field_path: "relations.dana_gitae"
    operation: "advance"
    after:
      - "**간격 5 회수.** `어이, 조수` 호칭 유지. **단아 쪽의 미세한 긴장 존속** — `웃는데도 얼굴이 무서운 사람이 있다. 봄에 처음 봤을 때부터 그랬고 지금도 좀 그렇다`"
      - "화계: 단아→기태 존댓말 / 기태→단아 반말 / 기태→영진 존댓말 / **영진→기태 하게체**"
    evidence:
      scene: 1

