  - "★★★★★ EP001 `바위를 쏘는 것 같았다`의 답 — 왜 인간 무기가 안 통하는지"
  - "★★★ 내부 손상 논리(첨삭) — 일정 힘 이상이면 내부가 상하고 죽으면 세포 결합이 깨진다 · 개체로 개체를 가른다 → **앵커·나이프·몸싸움의 근거**"
  - "★★ 대수몰(2020)이 저들이 한 일이라는 것 · 해저화산 전조 저주파 · 저것이 나오면서 화산이 됨"
