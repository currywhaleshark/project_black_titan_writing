state_changes:
  dana:
    - "**★★ 통증이 날짜를 넘었다.** `전투는 어제였다. 어제 것이 오늘까지 온 적은 없었다`. **전투 종료 = 감각 종료라는 규칙이 처음 깨졌다**"
    - "**★★ 설정값 항의.** `이거 원래 안 아프게 되어 있는 거잖아` → `알 만큼만 온다고` → **`그렇게 되어 있었는데 왜 아파.`** 누구에게 하는 말인지 본인도 안 갈라진다"
    - "**★ 화가 안 난다.** `화는 싸우면서 다 썼는지, 남은 건 화보다 무거운 다른 것이었다. **이름을 모르는 것이었다**`"
    - "**밖에 없다** — 손에 안 잡히고 거울에 멍 0. **`안에만 있는 것이었다`** · `보이면 설명이 되는데 안 보여서 설명이 안 됐다`"
    - "**몸이 조심을 배운다**(동작으로만) — 등부터 씻기 · 오른쪽 어깨로 기대기 · 그릇 두 손 · 국에 밥 말기 · **일어나는 데 순서** · 마루에서 벽에 비스듬히"
    - "**★ 혜정 통화를 못 했다** — 목소리를 낼 자신이 없어서 문자로. `오늘 늦었다. 먼저 자` / `어`. **이번 주 두 번째로 약속이 밀렸고 두 번 다 이유를 못 말했다**"
    - "아침 `좀 어떠냐` / **`어제보다 나아`** — **거짓말인지 아닌지 말한 사람도 모른다**"
  youngjin:
    - "**★★ 대답을 안 한다.** 항의 다섯 마디 중 답한 건 **`아니다`** 하나 — `잘못 기억하는 거야?`에 대한 것. **그다음이 안 온다**"
    - "**작가용(지면 0):** 대답하려면 거짓말이거나 봉인 위반이거나 둘 중 하나. 둘 다 못 한다"
    - "**침묵 ≠ 냉담** — 세척이 길다 · 물줄기가 한자리에 오래 머문다 · **점검에서 가슴판을 제일 먼저 본다**(원래는 팔부터) · 콩자반을 민다 · **미역국을 끓인다**(어제 숟가락이 국물로만 간 걸 본 사람) · 일요일 아침 마당의 공구 소리"
    - "`좀 어떠냐` — **어제 대답 안 한 사람이 처음 놓는 말**"
  sua:
    - "**★★ 확인자 절차 정상 수행**(EP28 정본) — 귀환하면 내려와서 수치 기록·대조·확인자 칸. **밀린 적 없음**"
    - "**★★ 절차가 눈의 알리바이.** `장부, 기체, 언니, 장부` — 손잡이를 오래 잡은 것 · 반 박자 정지 · **계단참에서 끊긴 걸음**을 다 본다. **`본 것들은 어디에도 안 적혔다`**"
    - "**★ 항의를 적을 칸이 없다.** 특이사항 칸에 넣으면 **기체의 특이사항**이 된다. **새 칸을 만들지 않는다** — `만들면 기록이 되고, 기록이 되면 있었던 일이 된다`"
    - "확인자 칸에 이름 — **`확인 안 되는 것은 서명 바깥에 있었다`**"
    - "**간격 칸에 3 기입**(EP70 이월). 그 밑은 **빈칸으로 둔다**"
    - "**★★ 빈칸 옆 여백에 아주 작은 점 하나.** 칸 밖의 기록 — `무엇이었는지는 점을 찍은 사람만 알면 됐다`"
    - "봄 공책 마지막 장 — **두세 줄 남기고 덮는다**(오늘 끝낼 수 있는데 안 끝낸다)"
    - "일요일에 **하랑이네 마당**으로 바이올린(학교를 못 쓰니까) · 나가면서 **세 번 곁눈질**, 세 번째가 조금 길다"

world_changes:
  - "**전투 후 통증이 하루를 넘긴 첫 사례**"
  - "학교 파손의 생활 여파 지속 — **방과후가 하랑이네 마당으로**"

canon_changes:
  - "**★ 귀환 점검 절차 재확인**(EP28) — 수아가 내려와서 수치 기록·대조·확인자 서명. **밀리지 않는다**"
  - "**★ EP70 소급 1곳** — 씬 1에 수아의 격납고 몫 명시(`끝나면 격납고로 내려갈 것이었다…`)"
  - "**간격 표와 점검 장부는 별개** — 간격 칸은 표의 것"

