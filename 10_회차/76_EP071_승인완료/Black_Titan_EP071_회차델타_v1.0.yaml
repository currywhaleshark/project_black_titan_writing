  - "**★★ FS-설정값 질문: 미답(71).** 영진이 답을 못 한다. **나중에 답해 주지 말 것** — 가을 공개 전까지"
  - "**★ FS-수아 점 하나(71).** 칸 밖의 기록이 생겼다"
  - "**FS-혜정 약속: 두 번째 불이행(71).** 이유를 두 번 다 못 말했다"
