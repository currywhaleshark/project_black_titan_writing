changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**여름 첫 교전 개시(6/13 월 밤).** 봄의 그 개체가 방재벽 외곽 수몰 구시가지에서 재출현 — **가시 재정렬·기부 두터움·작살형 끝**(위화감 층위·해설 0)"
      - "**공격 의도의 전환:** 붙잡는 대신 **겨누고 쏜다.** 몸에서 떨어져 나온 가시를 원거리에서 발사·연사. 이쪽이 접근하면 물러나 거리를 벌림(거리 유지 전술)"
      - "봄과 달리 **스스로 이동·자리를 잡음**(부동 → 기동)"
    evidence:
      scene: [2, 3, 4]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**낯익은 개체의 개수 확인(현상 층위):** 가시가 고르게 재정렬되고 끝이 작살처럼 갈라졌다는 것 — `갈라진 것은 박히면 안 빠지라고 있는 것`. 정체·원리 명언 0"
      - "**피격 체험:** 맞아도 뚫리지 않았다(장갑이 버텨 줌). **다만 몇 번까지 버티는지는 모른다** — 확정 0·불안 존속. 손상 표시 0 확인"
      - "**물리량 인지:** 피해가 없어도 **밀리고 흔들린다.** `맞은 자리는 멀쩡한데 몸이 밀려 있었다`(아픈 것과 흔들리는 것이 따로 노는 감각 — 처음)"
      - "**의도의 공포:** `저건 나를 부수려고 왔다`. 봄 = 데려가려 함 ↔ 오늘 = 온전한 채로는 필요 없음. `봄이 끝났다는 걸 통지문이 아니라 어깨로 알았다`"
      - "**맨손의 한계:** 붙으면 이기는데 붙을 수가 없다 — `팔이 짧아서가 아니라 거리가 멀어서 지는 싸움`. 팔보다 긴 것을 한 번 바람(명명 0·투정으로 접어 치움)"
      - "**발사 간격 발견(훅):** 쏘고, 쉬고, 쏘고 — 쉬는 구간의 길이가 매번 비슷. `간격이 있다`. 걸음 수를 그 셈에 맞춰 보기 시작(돌파 0)"
    evidence:
      scene: [2, 3, 4, 5]

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**여름 첫 출격.** 다수 피탄(어깨·가슴·옆구리·다리·등) — **관통 0·손상 표시 0.** 밀림 다수·자세 흐트러짐 다수"
      - "무장 없음(맨손) 상태에서 **원거리 상대에 유효타 0** — 접근 3회 시도·3회 모두 중간에서 저지"
    evidence:
      scene: [3, 4]

  - category: "situational"
    field_path: "external_conditions.sea"
    operation: "advance"
    after:
      - "**전장 정본 신설 — 방재벽 외곽 수몰 구시가지(옛 아파트 단지).** 수심 = 기체 허벅지(상반신 노출·수중전 아님). 아래 대여섯 층 침수 + 물 위로 열몇~스물몇 층 노출. 무인"
      - "**교전으로 아파트 동 파손** — 위층부터 뜯겨 나가 낮아짐(엄폐물 = 소모 자원). 동 하나가 허리께까지 낮아짐"
    evidence:
      scene: [2, 4]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "출격 전 **방재벽 바깥 지형도 제공**(물 위로 남은 층수를 숫자로 표기 — 열여덟·스물둘·아홉). 말없이 화면만 돌려 놓음(조언 0·발화 0)"
      - "봄/여름 겹친 화면 유지(파랑·빨강). 가시 조각 통 = 작업대 위 대기 존속"
    evidence:
      scene: 1

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**교신 = 상태 보고의 정직화.** `안 뚫렸어요. 근데 밀려요. 맞을 때마다 뒤로 가요.` → 영진 반 박자 침묵(지시할 것이 없음) → `무리하지 마라`"
    evidence:
      scene: 4

