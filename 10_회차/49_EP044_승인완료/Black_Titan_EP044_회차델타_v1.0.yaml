notes:
  - "S8 4/10 완료. 다음 **EP45 「부러뜨리는 법」(가제) — 격파 화.**"
  - "EP45 고정선(S8 개요): 발사 간격을 셈에 넣고 접근 성공 → **손에 닿는 대로 가시를 부러뜨림** → 몸통 노출 → **부서질 때까지 내려치기**(정권 아님 — 격투 성장 곡선의 출발점) → 귀환 후 **`봄에 그놈이에요. 근데 가시가 달라요`** → 수아의 가시 조각 대조 결론"
  - "EP45 금지: 앵커 명명·역장 원리·정체 확정·새 증상. 전장 구조는 EP44 정본 승계(허벅지 수심·낮아지는 아파트 동)"
