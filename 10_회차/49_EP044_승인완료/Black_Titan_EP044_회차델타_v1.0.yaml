canon_additions:
  - "시간: EP44 = 6/13(월) 밤 — EP43 실루엣에서 즉시 연결(경과 0)"
  - "**전장 구조 선확정 절차 신설(사용자 2026-08-12):** 전투 화는 집필 전 Level 6에서 수심·엄폐물 내구·시야·기동·적 노출·**높이 질량 정합**을 확정한다"
  - "**전장 정본:** 방재벽 외곽 수몰 구시가지 = 허벅지 수심 + 물 위 열몇 층 아파트 동. 엄폐물은 사라지지 않고 **낮아진다**(머리 위→어깨→가슴→허리)"
  - "**높이·질량 정본:** 기체 52m ≈ 아파트 17층. 구르기·몸 날리기·잽싼 회피 금지 — 벽 밀며 빠지기·어깨 틀기·무겁게 뛰기. 동 사이 = 네 걸음"
  - "**피격 물성 정본:** 피해 0이어도 밀림·자세 흐트러짐·조종석 진동·등받이 충격은 반드시 전달. `끄떡없다` 계열 금지"
  - "**LOC-05 동선 정본(첨삭 계기):** 단층 촌집이므로 호출은 `내려가자`(지하로), 생활공간→가게는 `미닫이를 열어 보니`. `내려와/계단` 계열 사용 금지"
  - "봄 성게형 회상 정본: `방파제에서 마주쳤고, 뽑으려다 실패했고, 가시 하나를 부러뜨렸고, 결국 밀어서 밖으로 내보냈던 그놈`"
  - "격언 계보: `낯익은 얼굴이 낯설게 구는 것은, 처음 보는 얼굴보다 무서웠다` / `뾰족한 것은 찌르라고 있는 것이고, 갈라진 것은 박히면 안 빠지라고 있는 것이다` / `봄이 끝났다는 걸, 단아는 통지문이 아니라 어깨로 알았다` / `머리가 놓으면 몸이 대신 센다`"
