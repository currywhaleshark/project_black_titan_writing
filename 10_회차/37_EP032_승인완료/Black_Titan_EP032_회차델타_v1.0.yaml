notes:
  - "S6 3/6 완료. 다음 **EP33 「닦이지 않는 흔적」(표준 화 — 생활 간주 2/후처리·귀환 훅).** 시점: 5/14 토 예상(수리점 하루)"
  - "EP33 고정선(개요): 접수 밀림(침수 센서·무전기·펌프) / **B3 첫 실전 성과: `오른발목 하부 점액 제거 뒤 구동저항 재측정` 수치 공란 발견 → 재검 → 발목장갑 안쪽 광물성 점액 고리**(순서 누락 발견 — 전술 분석 아님) / 재점검 귀가 지연 → 혜정에게 시간 재발신 → 준비물 사진 답 / 영진 = 가루 정렬 사실만(광역 점액·파훼법 모름) / **훅: 수중무인기 — 새 관구의 머리, 비대칭 왼쪽 턱 재생흔 = 동일 개체 + 여러 관구 동시 점액 분출·`숨을 내쉬듯 부풂`·비뚤어진 턱이 화면에 걸렸다 사라짐**"
  - "EP33 금지: 수아 전투채널·조종석·인터페이스 접근, 점액 = 생체기원 증거화, 새 협력자·군 수사·혜정 방문. **정지 통찰 금지 지속(해금은 EP34)**"
