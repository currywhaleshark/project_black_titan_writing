canon_additions:
  - "시간: EP32 = 5/13 금(아침 소문 → 방과후 지도 → 하교). 안전지도 제출 = 다음 주 월(단아 보관)"
  - "**안전지도 정본:** 방과후 모둠 숙제(마을 답사형 — 4월 대피 경험 계기). 물성 = 전지·파랑 안전로/빨강 위험·대피소 2·방파제 빗금·귀퉁이 작은 해·지워진 계단길 자국"
  - "**계단길 정본:** 학교~우체국 지름길, 계단 마흔 개쯤, 차 없음 — 지도상 경사로(두 골목 우회·넓은 골목)로 교체"
  - "소문 생성 경로 정본: 공개망 통제 통지(어선 가정 경유)가 아이들 정보원 — 목격자 없는 승리담의 표준 형성 과정"
  - "혜정 걱정 문법 정본: 캐묻기 대신 규칙 만들기(연락→건강 — `물을 수 있는 자리를 하나씩 만들어 두는 것`)"
