    operation: "advance"
    after:
      - "**B1 수용 전환:** 어두운 교실에서 혜정이 필기를 책상 가운데로(무언) + 진료 권유 1문장. 단아가 처음으로 손을 빼지도 화제를 돌리지도 않고 `……고마워` — 외상 장부의 자각적 수용 개시"
      - "**신규 사실(사용자): 혜정 = 4월 짝**(자리 뽑기, 같은 번호). 3월 짝은 무명(EP11 지렁이 글씨 구경) — 월별 자리 바꾸기 관례(EP12 수아 짝 교체와 정합)"
      - "며칠간 필기 공유 지속(손전등 아래 베끼기 포함) — `아무 말도 오지 않는 편한 옆자리`"
    evidence:
      scene: [2, 3]

  - category: "informational"
    field_path: "characters.dana.state"
    operation: "merge"
    after:
      - "**이중 침묵의 부담:** 감사·불평이 둘 다 맞아 편들 수 없음 + 탑 손상 관여를 말할 수 없음(`각주가 있는 사람은 본문에 밑줄을 긋기 어렵다`)"
      - "**시력검사 안내장 수령**(가정통신문 — 여럿에게 배부) — 반으로 접어 가방에. EP18 안과 직결"
      - "계주 마지막 주자 확정(결정전 승리)"
    evidence:
      scene: [2, 3, 5]

  - category: "informational"
    field_path: "characters.seongho.state"
    operation: "merge"
    after:
      - "**첫 정답 옹호:** 정전 책임 논쟁에서 순서 정정(`괴수가 그대로 있었으면 도시 전체가 멈췄다`) — 직선 논리에 교실 반 박자, 본인도 낯설어 짧게 마감. `거인 욕은 우리 반에서는 금지` 선언"
      - "계주 패배 — 쿨한 인정 + 장난 도발(`가을 운동회 때 정식으로`·`통계적으로`), 3주자 자원 작전표(자기 구간 화살표 최굵). 미부상 유지"
    evidence:
      scene: [1, 2]

  - category: "living_condition"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "정전표 생활 정착: 얼음 줄·분필 수업·야외수업 인기·상온 우유·카레(예진 예언 적중). **수요일 오후 복구 완료** — 순환정전 종료"
      - "수리점 대란: 접수 이름표 10+ 지속, 접수 요령 확립(`돌 때 딱딱 소리`). 영진 지하 목록 매일 밤으로 밀림 — 저녁 정전 시간에 지하 정비(발전기)"
      - "소문 생태계: 받쳤다/던졌다/빠뜨렸다 경쟁 — 단아 무정정(`제일 안전한 자리는 틀린 소문 옆`)"
    evidence:
      scene: [1, 3, 5]

  - category: "informational"
    field_path: "characters.sua.state"
    operation: "merge"
    after:
      - "방과후 재개 — 전기 없는 음악실(`바이올린은 전기 안 쓰니까`), 악보 덮고 켜는 날 앞당김, 세 번째 줄 성장(둘 중 하나만·번갈아)"
      - "시각 기록을 새 면에 옮겨 적음(구겨진 앞 장 보존 — 송진 메모 연결). `답이 없는 숫자는 답이 생길 때까지 두면 됐다`"
    evidence:
      scene: 4

