state_changes:
  dana:
    - "**★★ `아프다` 해금.** EP32 이후 8개월 봉인 해제. `울린다, 라고 부르려던 것이 부르기 전에 끝나지 않았다. / **아팠다.**`"
    - "**★★ 위치가 아니라 세기가 바뀌었다.** `맞은 데에 느낌이 오는 건 원래 그랬다. 알라고 만들어 놓은 거니까.` / **`오늘은 둔하지가 않았다.`** — 포스 피드백 감쇠가 안 먹는다"
    - "**★★ §1-I ③ — 선을 넘었다.** `물러서라`를 **두 번** 듣고 안 물러났다. **`싫어.`** / `이유를 대야 하는 자리에서 이유가 아닌 걸 댔다`"
    - "**★★ 트리거 = 자세 모방.** 세 번 겹쳤다(주먹·팔·멈춤). **`따라 하지 마.`**(혼잣말·교신 미포착) → 난타 중 **`따라 해 봐.`**로 뒤집힌다"
    - "**★ 난타 결착.** 관절이 아니라 앞다리를 계속 쳤다 — **`빗겨내려면 그쪽 다리를 써야 했다. 쓰는 동안은 그 다리로 못 친다.`** 화가 나서 한 선택이 이겼다"
    - "**★ 스스로 못 멈췄다.** 쓰러진 뒤에도 쳤고, **`끝났다`는 목소리에 손이 멈췄다.** `멈췄다는 게, 멈추고 나서 알렸다`"
    - "**십여 대 피격**(지난달까지 두세 대). 세다가 흐트러졌다"
    - "**★ 통증이 전투 종료로 안 끝난다.** 귀환길 내내 있고, **숨을 쉬면 따라 움직인다.** 얕게 쉬면서 걸었다"
    - "**★★ `……아프잖아.`** — 입 밖으로 나온 첫 번째. **듣는 사람 0**"
  youngjin:
    - "`물러서라` **×2** — 두 번째 뒤 **교신 침묵**. 세 번째는 하지 않았다"
    - "**★ 모방을 우연으로 설명한다** — `구조가 그런 거다. 팔이 그렇게 접히면 그렇게 나온다.` **정정되지 않는다**"
    - "난타 중 **두 번 불렀고 두 번 다 대답을 못 받았다.** 귀환길에 `아까 두 번 불렀다` / `들었냐` / `들었어` — **왜 안 했느냐는 안 묻는다**"
    - "`침착해라` / 단아 `지금 침착해` — 어긋난 교환"
  sua:
    - "출격 전 **`어디야?`** 한 번. 방재벽 앞이라는 답을 듣고 **적지는 않았다**(끝나야 적는 규칙)"
    - "간격 3 기입은 **EP71로 이월**(귀환 후)"

world_changes:
  - "**공작갯가재형 격파**(방재벽 북쪽 개활 사면 · 토요일 오후)"
  - "**★ 개체 특성:** 등이 반질반질 · **마디는 많은데 앞다리 두 짝이 가린다** — `저게 방패이면서 무기였다` · 예비 동작 없음 · **뒤를 안 보여준다** · 곤봉 팔 · **녹색 안광의 눈자루**"
  - "**★ 앵커 회피** — 백오십에서 정면 사격, **반 걸음 옆으로 비켰다.** `보고 피할 시간을 준 거다` · **`비켰다는 건 봤다는 뜻이고, 봤다는 건 다음에도 본다는 뜻이었다`**"
  - "**방재벽 무손상** — 한 조각도 안 떨어졌다. 단아가 안 물러났기 때문"
  - "**★★ 공공 대응:** 도시 쪽 **사이렌 장음**(이동 지시) · **방송국 드론 2기**(봄에는 1기) — 사흘 전 학교 파손의 값"
  - "간격 수열 = 6·5·4·**3**"

canon_changes:
  - "**★★ 포스 피드백 정본 확인**(LOC-01 §4.1) — 위치는 원래 온다. **정상 운용 = 둔한 압력과 부하.** EP70이 그 상한을 넘은 첫 사례. **기전(우회 신경동조)은 가을 전 공개 금지**(§4.2) — 지면 0"
  - "**★ 보폭 20미터**(EP19 지면 정본) · 대면 거리 **이백** · 벽까지 **다섯 걸음**"
  - "**방재벽 = EP56에서 따개비를 뗀 자리**(붙인 게 아니다). 뗀 자국은 안 없어진다"
  - "**걸어오는 개체는 처음이 아니다**(EP8 바닷가재 · EP47 농게). **속도를 안 올리는 것**이 다르다"
  - "**관절 역방향 꺾기는 봉인**(농게형·EP64에서 소진)"

