canon_additions:
  - "시간: EP30 = 5/12 목(낮 일상 → 저녁 공유 → 밤 출격·접촉)"
  - "**수몰 구도심 정본(첫 승인 물성):** 방재벽 이전 바다에 내준 옛 시가지 — 해저 도로, 기울어진 가로등, 삭은 간판, 정류장 지붕, 2층 없는 건물. 탁도 = 전조등 몇 걸음. 발밑 = 무너진 것들 위(잡을 것 없음)"
  - "**군 통신 = 공개망 경유**(수리점 수신 채널 정본). 통지 문법 = 공적 문장·지원하되 관여하지 않는 거리"
  - "출격 복장 = 체육복. 출격일 밥 한 공기 문법"
  - "**영진 한 팔 몸짓 정본(첨삭 계기):** 팔짱·양손 동작 금지 — 한 손 기반(무릎에 얹기·짚기)"
  - "실전 공백 = 17일(4/25 전후~5/12 — 단아 체감 기준)"
