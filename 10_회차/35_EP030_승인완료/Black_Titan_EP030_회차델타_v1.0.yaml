notes:
  - "S6 1/6 완료. 다음 **EP31 「부러진 턱」(중요 화 — 첫 탈출/자발 퇴각).** 진입 = 포획·견인·경화 진행 중(이 화 훅 그대로)"
  - "EP31 고정선(개요): 똑바로 당기면 더 굳는다는 깨달음 → 왼발·양손으로 철근·기둥 짚고 버티기 → 턱 벌어지는 순간 한쪽 턱뿌리를 관 테두리에 눌러 비틀기 → **왼쪽 턱 파손·탈출** → 개체 자발 퇴각(관망 깊숙이— 몸체 미노출 유지) → 군 = 동일 개체 표지 기록(부러진 왼쪽 턱·점액 조성) → **훅: 격납고 쟁반 위 턱 끝·점액 — 콘크리트 가루가 실 조직 따라 정렬(영진 목격 — FS-003 인접)**"
  - "EP31 금지: C1(실패 원인 = 출력·신경 아님), 심해 추격·수사극, 퇴각 데이터·판단 서술"
