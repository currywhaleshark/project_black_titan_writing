  - "**EP61 잠금 예고:** 후처리·정비 / **수아 표에 항목 신설** / **기태에게 값을 치른다**(조달의 결산) / 단아가 왼팔을 본다 — **무기를 얻은 이야기가 아니라 몸이 바뀐 이야기**로 닫는다 / **★ `아이언 앵커` 명명(가족 내부)** / 훅(S10 인계) = 간격이 또 짧아진 장부 + 학교 쪽으로 향하는 무엇"
  - "**미수령 잔여:** 수아 공책 · 서랍 사진 · **성호 100미터**(3차 청구 미결·**6/28 하루 결석**) · 가위값"
