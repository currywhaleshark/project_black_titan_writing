canon_additions:
  - "시간: EP60 = 6/28(화) 아침. **EP59에서 시간 경과 0**"
  - "**★ 덫의 물리:** 닻을 한쪽 벽에, 기체가 반대편 기둥. 다리에 걸리는 높이. **내주면서 버틴다**"
  - "**★ 고무줄:** 실제는 짧고 체감만 길다. 늘어나는 구간에 힘이 쌓이고 한계에서 반전"
  - "**★ 지형이 저것의 무기를 깎는다:** 깊은 데를 못 쓰고 좁은 데서는 못 꺾는다"
  - "**★ 단단한 바닥의 양면**(EP59 저쪽 편 ⟷ EP60 버틸 자리) — EP4·EP53과 같은 문법"
  - "**★ 폐허에는 값이 안 남는다** — 고칠 사람이 없는 자리"
  - "**★ 신체이미지:** 팔이 하나 더 생긴 게 아니라 **팔이 길어졌다**"
  - "**★ 승리의 감각 3단:** 손이 떨림(봄) → 허탈(방재벽) → **아무것도 아님**(오늘)"
  - "**★ 군 자료 계보:** 최초 EP30(5/12) · 정례화 EP33 · **보낸 게 아니라 뿌린 것**. 뿌린 쪽은 쓰인 걸 모른다"
  - "격언: `빠른데 돌아간다` / `지금 이쪽이 하고 있는 건 저것이 피한 일이었다` / `여기서는 못 움직인다. 저것도 못 움직인다` / `도구는 겨눠서 쓴다 … 팔은 안 그런다` / `팔로 짚은 것 같았다` / `기둥이 둘 필요한데 하나밖에 없으면 나머지 하나를 자기가 하면 된다` / `짧았다` / `달라진 건 저것도 이쪽도 아니고 서 있는 자리였다` / `처음으로 부수고도 값이 안 나왔다` / `아무것도 아닌 게 제일 이상했다`"
