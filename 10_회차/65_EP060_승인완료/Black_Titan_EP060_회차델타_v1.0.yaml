schema_version: 2
chapter: 60
approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-14"
  approval_note: "브리프 v0.4 → Level 6 v1.2 → 초고 → 첨삭 4건 + 코멘트 1건 → `좋아`. **S9 10/11 · 교전 종결 · 재독 검사 3종 통과.**"
based_on_snapshot: "SNAP-059 v1.0"
produces_snapshot: "SNAP-060 v1.0"
notes_on_shape:
  - "**EP59의 `engagement_open`을 닫는 델타다.** 시간 경과 0 — 같은 교전이고 같은 물이다"
changes:
  - category: "situational"
    field_path: "engagement.open"
    operation: "close"
    after:
      - "**교전 종결.** 외곽 수몰 시가지 **옛 큰길**(양쪽 건물·드러난 옛 도로·단단함)에서 격파"
      - "**기체:** 관통 0. 스친 자국(어깨·허리·왼쪽 종아리) 유지 + **버틸 때 밀린 발자국 두 줄**"
      - "**장비:** 닻이 오른쪽 벽에 박혔다가 **두 번 당겨서 빠짐**(콘크리트 한 덩이 딸려 나옴). 사슬 회수 완료"
      - "**현장:** 무너진 벽·파인 바닥·밀린 발자국. **고칠 사람이 없다**"
    evidence:
      scene: [5, 6, 7]

  - category: "informational"
    field_path: "tactics.chokepoint"
    operation: "create"
    after:
      - "**★ 쫓기를 그만두고 질러갔다.** 저것은 **다리로 밀어서** 가므로 깊은 데를 못 쓴다 → **얕은 선(옛 도로 능선)만 탄다** → 돌아간다. 이쪽은 **깊은 데를 걸어서 곧게** 갔다"
      - "**★ 빠른 쪽이 돌아가고 느린 쪽이 질러간다**"
      - "**★ 덫:** 닻을 **한쪽 벽에 박고 기체가 반대편 기둥이 된다.** 사슬 이쪽 끝은 원래 팔에 붙어 있다 — `기둥이 둘 필요한데 하나밖에 없으면 나머지 하나를 자기가 하면 된다`. 높이는 **다리에 걸리는 높이**"
      - "**★ 고무줄:** 걸리고 뒤집힐 때까지가 **짧다.** 늘어나는 구간에 힘이 쌓이고 **한계에서 반전**된다. **체감과 실제가 안 맞는다**"
      - "**★ 저것의 속도가 저것을 꺾는다** — 걸린 데를 축으로 돌아가 다리 여럿이 한꺼번에 걸리고 통째로 넘어감. **저것이 고른 꺾임이 아니다**"
      - "**★ 지형이 무기를 깎는다:** 트인 데에서 무적이던 것이 좁은 데에서 무력해진다. `달라진 건 저것도 이쪽도 아니고 서 있는 자리였다`"
      - "**★ 단단한 바닥의 양면:** EP59에서는 저쪽 편이었고 여기서는 **버틸 자리**가 된다"
    evidence:
      scene: [1, 2, 3, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 코칭 수용:** `무기를 쏜다고 생각하지 마라. 왼팔이 길어진다고 생각해`. 두 번 빗나간 뒤에 왔다"
      - "**★ 겨누기를 그만두니 박혔다.** 각도를 안 쟀고 **손이 갈 데**를 봤다. `팔로 짚은 것 같았다`"
      - "**★ 도구와 팔의 차이:** `도구는 겨눠서 쓴다 … 팔은 안 그런다` / `붙어 있는 건 무겁다 … 팔이 무거우면 그냥 팔이 무거운 거다`"
      - "**★ 신체이미지 확장:** **팔이 하나 더 생긴 게 아니라 팔이 길어졌다.** 걸렸을 때 당겨진 게 사슬이 아니라 팔이었고 **놓을 생각을 한 번도 안 했다**"
      - "**★ 이겼는데 웃음이 안 나왔다.** 봄 첫 승리 = 손이 떨림 / 방재벽 = 허탈 / **오늘 = 아무것도 아니었고 그게 제일 이상했다**"
      - "**착상은 갑자기 왔다** — `여기서 발을 걸면 넘어지지 않을까`. 늘어진 사슬이 눈에 들어와서"
      - "**소리가 처음으로 제때 왔다**(닻이 박히는 소리)"
      - "※ **새 증상 0** / **장비 이름 여전히 0**"
    evidence:
      scene: [3, 4, 5, 7]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**지형 판독만 했다** — 얕은 데·깊은 데·건물 위치·저것이 타는 선. **질러가라는 지시는 안 했다**(말이 `너한테는…`에서 끊기고 단아가 이미 방향을 틀었다)"
      - "**★ 코칭 한 마디.** 부연 0 — `그게 다였다. 더 말 안 했다`"
      - "**축하도 칭찬도 안 했다** — `그런 말이 나왔으면 오히려 이상했을 것이다`"
      - "**공개망 자료를 오는 대로 받아 놨다.** 볼 일이 없을 때도"
    evidence:
      scene: [1, 4, 7]

  - category: "situational"
    field_path: "living_conditions.aftermath"
    operation: "advance"
    after:
      - "**★ 폐허에는 값이 안 남는다.** 어제 방재벽에서는 뗀 자국이 전부 누가 고쳐야 할 데였는데 **여기는 고칠 사람이 없다.** `처음으로 부수고도 값이 안 나왔다`"
      - "**목격 0 · 여론 변화 0**(새벽~아침·외곽)"
      - "**물이 다시 차오르기 시작했다**(아홉 시 지남). 돌아갈 때는 **저것이 다니던 능선**을 따라 간다"
    evidence:
      scene: [6, 7]

