notes:
  - "**S8 「재검과 재래」 10/10 완료 — 아크 마감.** 종료장부 대조서 8/8 + 아크캡슐 S8 작성"
  - "다음 = **S9 「고철의 재간」**(EP51~). 기태 조달·앵커 개발·등각류 데뷔. 앵커 모드 구분(클로/로켓)은 S9 Level 6에서 확정"
  - "S9 진입 시 필요: 여름 L3 골격 v1.1 §S9 → S9 화별개요(Level 4) → EP51 브리프"
