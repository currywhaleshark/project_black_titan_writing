no_change_checks:
  - "출격 0 / 전투 0 / 목격 3단 0(EP56) / 여론 불안 0(EP56) / 앵커·클로·로켓 0 / 반입구 0 / 센티널·우편물 0(EP57) / 닻 트럭 0 / 새 증상 0 / 작가용 개체 명칭 0 / 분류어 0 / `목적`·`학습`·`시험` 0"

canon_additions:
  - "시간: EP55 = 6/22(수) 하루. 아침 수리점 → 학교 → 하굣길 구경 → 판명 → 저녁"
  - "**★ 조사 절차(신설):** 중요시설 부착물은 **시(市)가 먼저 조사한다.** 붙는 이름은 `부착물`, 틀은 **구조 안전**. 괴수 분류는 그다음이고 **분류되는 순간 시청 일이 아니게 된다**"
  - "**★ 수소문의 방식:** 시청은 골목을 하나씩 끊어서 돌고 한 집에 5분도 안 있는다. 영진은 권위자가 아니라 **동네에서 부표를 오래 본 노인**이다"
  - "**★ 부표의 원리(지면 초출):** **지나가는 걸 잡는다.** 큰 게 지나가면 물이 밀리고 줄이 튄다 → **붙어 있는 건 지나가지 않는다.** 항만 기록에 **배는 잡혀 있다**"
  - "**★ 따개비형 1차 노출:** 넓고 납작한 판 4~5개(버스만 함·얇음)·세로 결과 가로 테·아래쪽이 짙음 / **뚜껑**이 갈라지듯 벌어지고 **갈퀴**가 물을 훑는다 / **소리 0** / 붙은 자리가 **삭는다**"
  - "**★ 녹색 = 알아보는 사람만 안다:** 군은 EP3에서 `괴수는 녹색`이라 관측했으나 `그게 무슨 뜻인데 / ……모르겠습니다`로 끝났다. 단아는 규칙이 아니라 **눈으로** 안다"
  - "**★ 통제의 시차:** 낮에는 통제할 이유가 없었고 **이유가 생기고 나서 통제가 왔다**"
  - "**학교 = 통제의 지표:** 셔터가 안 내려오면 아무 일도 없는 날이고, 교문 당번은 조퇴증도 안 본다"
  - "**단말 정본 재확인(EP29):** 부표 단말은 **가게에 하나.** 화면에 그래프가 세 벌. **부표는 7·5·2번**이고 방재벽에 제일 가까운 것이 **2번**(EP30)"
  - "격언 계보: `붙어 있는 건 지나가지 않는다` / `배는 잡히고 저건 안 잡혔다` / `아무것도 못 하는 자리에 서 있는 건 처음이었다` / `아까부터 계속 그러고 있었던 것처럼` / `같은 줄인데 뜻이 바뀌었다`"
