notes:
  - "**S9 5/12 완료.** 다음 = **EP56 「붙은 것들」 — 전투(진입·종료)·중요 화**"
  - "**★ 화 성격 전면 재설계(사용자 2026-08-14):** EP55는 원래 전투 화였으나 **조사 화(전투 0)** 로 바뀌었다. 근거 = 지금까지 나온 것들과 안 닮았으므로 **괴수로 단정하지 않는 것이 정상**이고, 중요시설이므로 **시가 먼저 조사한다**"
  - "EP56 잠금: 확인(녹색·장부·개체 표·군 통지) → **이름이 바뀐다** → 낮에 무단 출격 → **갈퀴는 미약** → **3연타 = 걸 데가 없다** → **병따개** → 반나절 → **다 뗐는데 벽은 상했다** → 장부 세 줄"
  - "미수령: **목요일(6/23) 대형 트럭** — 닻 포함(지면 특정 금지). EP56과 같은 날에 겹치지 않게 **EP57로 미룸**"
  - "미수령: 수아 공책 · 서랍 사진 · 우편물(EP57) · 재대결의 재대결 · 가위값"
