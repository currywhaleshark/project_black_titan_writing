schema_version: 2
chapter: 55
approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-14"
  approval_note: "브리프 v0.4(전면 재설계 — 전투 화 → 조사 화) → Level 6 v2.1 → 초고 → 첨삭 2차(8건) → `좋아`. **S9 5/12.**"
based_on_snapshot: "SNAP-054 v1.0"
produces_snapshot: "SNAP-055 v1.0"
changes:
  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**★ 방재벽 외벽에 정체 미상의 부착물(6/22):** 넓고 납작한 판 4~5개. 하나가 **버스만 하고 두께는 얇다.** 벽에 가장자리까지 밀착. 붙은 자리의 **콘크리트가 삭는다**(깊이 두 마디)"
      - "**시(市) 조사 개시:** 점검반이 사다리·밧줄·안전모·발전기·긴 자·표본 봉지로 반나절 작업. **표본이 안 뜯긴다** — 여럿이 지렛대에 매달려도"
      - "**시청 수소문:** 최근 일을 알 만한 사람을 찾아 **골목을 하나씩 끊어서 돈다.** 앞집 → 건너 가게 → 수리점. 안내문 한 장(벽 접근 자제·어선 운항 정상·추가 공지 예정)"
      - "**★ 인명 피해 1(중상·사망 0):** 표본을 뜨던 점검반원이 **갈퀴에 팔이 감겨 딸려 들어감.** 빼내는 데 오래 걸림 → 들것으로 실려 감. **팔이 움직였다**"
      - "**저녁에야 통제:** 큰길에서 벽으로 가는 갈림길 차단. **`낮에는 통제할 이유가 없었다`**"
      - "**관할 이관 개시:** 시청 일이 아니게 됨. 넘길 데로 넘기는 데 **시간이 걸린다**"
    evidence:
      scene: [1, 2, 4, 5, 6]

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "**소문 세 갈래(아침):** 밤사이 붙었다 / 어제부터 있었다 / 원래 있었는데 물이 빠져 보였다. **셋 중에 괴수라는 말은 없었다**"
      - "**아무도 괴수라고 안 한다:** 지금까지 온 것들은 다 **왔다** — 물을 밀고, 소리를 내고, 부표를 흔들고, 벽 앞에 섰다. **붙어 있는 건 그런 것들이 하는 일이 아니다**"
      - "**시청 어휘:** `부착물`·`구조 안전`·`삭은 깊이`. 소문이 **절차**가 된다(일정·담당·적는 칸)"
      - "**구경:** 구래동 큰길 난간에 자전거·장바구니 든 채로. 판명 순간까지 구경거리였다"
      - "**학교 = 통제의 지표:** 경보가 울리면 셔터·복도 문. 오늘은 아무것도 안 내려왔고 **교문 당번이 조퇴증도 안 봤다**"
    evidence:
      scene: [1, 3, 4, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 저것이 살아 있다:** 뚜껑이 열리고 **갈퀴**가 나와 물을 훑는다. 두 박자 간격·**소리 0**. 사람이 딸려 들어가는 것을 **난간에서 직접 봤다**"
      - "**★ 녹색을 봤다(확신 0):** `녹색 빛이 번득인 느낌이 들었다`. 순간이고 멀었고 물이 튀는 중이었다 — **다만 그 색을 봄 내내 봤다.** 아무에게도 말하지 않았다"
      - "**빼내는 데 오래 걸렸다** — 방법은 못 봤다(안전모가 뭉쳐서 가림)"
      - "**★ 아무것도 못 하는 자리:** `지금 저기 나갈 이유가 없었다` / `저건 싸울 상대가 아니라 그냥 부착물이다` / **`아무것도 못 하는 자리에 서 있는 건 처음이었다`**"
      - "**부표의 원리:** 지나가는 걸 잡는다 → **붙어 있는 건 지나가지 않는다**"
      - "※ 새 증상 0. 팔·시력 기준선 유지"
    evidence:
      scene: [1, 3, 4, 5]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**★ 관측의 공백을 확인:** 부표 2·5·7번 사흘 치 파형 평평. 항만 기록에 **배는 잡혀 있다** → `배는 잡히고 저건 안 잡혔다`"
      - "**남 앞에서 `없다`고 말했다** — 다만 저쪽에게는 칸 하나였다. **자책·언어화 0**(그 무게는 저녁에 온다)"
      - "**저녁의 재의미화:** 아침에는 `아무것도 없다는 뜻` → 지금은 **`아무것도 못 봤다는 뜻`**"
      - "**장부에 아무것도 안 썼다** — 빈 줄에 펜을 대고 한참"
    evidence:
      scene: [1, 2, 6]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**관측 표 6월 = 벽 쪽 전부 빈칸**(14일~16일). 간척지 쪽은 빽빽한데 벽 쪽만 비어 있다"
      - "**조위 기록 대조:** 물이 많이 빠진 날이 6월에만 예닐곱 번, 옆 칸은 전부 비어 있음 → **`이상하네요`까지만**(판명 전 자책 0)"
      - "**저녁의 자책(판명 뒤):** `제가 저기를 안 봤어요` / `물 빠지는 날짜는 적었는데 그날 벽을 보러 간 적은 없어요` → 영진이 **두세 마디로 끊음**(`보러 갔어도 몰라` / `없는 걸 못 찾은 거야`)"
      - "**표를 접지 않고 그대로 뒀다**"
    evidence:
      scene: [1, 2, 6]

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**말하지 않은 것을 말했다** — 확실하지 않은 목격을 그날 안 말하고 다음 날 말하게 되는 계보의 입구(EP56에서 회수)"
      - "영진의 지원 = **기록**과 **수아를 막는 두세 마디**. 답 0·전술 0·한 손 유지"
    evidence:
      scene: [1, 6]

