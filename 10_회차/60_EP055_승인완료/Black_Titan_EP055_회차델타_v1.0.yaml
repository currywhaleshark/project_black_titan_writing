    note: "**관측 체계의 첫 실패가 공적인 사건이 됨.** 부표·장부·수아의 표 셋이 동시에 비었고, 시청이 물어보러 와서 `없음` 한 줄을 받아 갔다. 저녁에 그 빈칸의 뜻이 바뀐다"
  - id: "B3-SUA-POSITION"
    operation: "ADVANCE"
    field_changes:
      - field: "last_progressed"
        before: 54
        after: 55
    note: "관측 표에 **적을 수 없는 줄**이 생김. 조위 기록 대조로도 안 나옴 — 기록 체계가 못 잡는 것이 있다는 첫 확인"
  - id: "B4-SEONGHO-SCHOOL"
    operation: "NO_CHANGE"
    note: "성호 미등장. 교실은 소문 국면까지"
  - id: "FS-C2-TITAN-ORIGIN"
    operation: "NO_CHANGE"
    note: "앵커·반입구·배양 0"
  - id: "B1-HYEJEONG-CONCERN"
    operation: "NO_CHANGE"
    note: "**평온 유지.** 급식·옆집·삽 수다. 어디·왜 안 묻기 이행. 눈금 0"
  - id: "FS-001-DANA-VISION"
    operation: "NO_CHANGE"
    note: "새 증상 0"
