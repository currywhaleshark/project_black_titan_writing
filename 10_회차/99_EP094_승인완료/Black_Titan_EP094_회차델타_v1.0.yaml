    - "**★ 개학은 아무한테도 안 물어도 온다** — `묻지 않아도 되는 것. 허락받지 않아도 되는 것`"
    - "**★★ 사과 대신 같은 데를 다시 간다** — `또?`·`나았다며`(EP86)가 아직 남아 있다. **미안하다고 하기엔 시간이 지났고, 꺼내면 그날이 커진다** → `같은 데서 같은 걸 먹으면 그날이 없던 날처럼 될 것 같았다`"
    - "**★★★ 잘못된 안도** — 답장이 **조건어 없이 바로 왔다**(여름 내내 `봐서·아마·될 것 같은데`가 붙었다) → **`괜찮은가 보다`** · **근거를 따져 보려다 그만둔다**"
    - "**★ 순찰차 생각이 하루 종일 안 났다** — 밤에야 그걸 안다. `기다릴 게 생기니까 그렇게 됐다`"
    - "**★ 달력에 동그라미** — 삼십일일. `치고 나니까 그 칸만 다르게 보였다`"
