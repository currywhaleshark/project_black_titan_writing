notes:
  - "**S9 「고철의 재간」 1/12 완료.** 다음 = **EP52 「밀려오는 것」 — 투구게형 전투(진입).** 맨손 한계 사다리 2연타(지지)"
  - "EP52 전장(S9 개요 고정): **간척 방조제 안쪽 얕은 물** — 수심 무릎 아래·바닥은 갯벌 아닌 콘크리트 슬래브·**뒤에 수문**(밀리면 도시가 젖는다). Level 6에서 전장 구조 6항목 선확정"
  - "목요일(6/23) = 대형 트럭 도착 예정일. **닻을 포함한 큰 것들이 오는 날** — 지면에서는 여전히 특정하지 않는다"
