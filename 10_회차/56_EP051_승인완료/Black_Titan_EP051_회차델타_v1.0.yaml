canon_additions:
  - "시간: EP51 = 6/19(일) 하루. 아침 8시 출발 ~ 저녁"
  - "**★ 첫 지면 등장 ≠ 첫 만남:** 생활권 조연은 전부 봄 이전부터 알던 사람들이다. `봄에 알았고`·`봄부터 그랬다`(오래된 사물·습관에) **금지.** 인양장·수산시장·항구는 **등하굣길의 풍경**(EP7 `늘 담장 밖에서 구경만 했다 … 등하굣길의 오랜 놀이`)"
  - "**호칭은 재사용 대상이다.** `문장 재사용 0`을 호칭까지 적용하지 않는다. **`어이, 조수`(기태→단아)는 말버릇이므로 반복된다.** 반복을 숨기지 말고 인물이 알아채게 하면 계보가 된다"
  - "**구래항 인양장 정본:** 건져 낸 것들의 마당·소리가 큰 장소·넓은데 발 디딜 데는 좁음"
  - "**조달 실무 정본:** 고철 = 무게로 나가고 끝 / **장비 = 출처가 장부에 남는다.** 안 도는 장비는 고철값"
  - "**앞마당 = 옛 차량기지 자재 반입구**(LOC-02 §2.2-B·LOC-05 신설). 아래에 격납고의 옛 대형 크레인. **영진이 이 자리에 터를 잡은 이유 — 집이 먼저가 아니라 아래가 먼저였다.** ※ 지면 노출 0"
  - "격언 계보: `있는 게 당연한 것은 볼 일이 없다` / `모르는 걸 적으면 나중에 지워야 하잖아` / `다시 드는 게 계속 들고 있는 것보다 힘들다` / `하지 마라, 그러다 어떻게 된다. 문장이 늘 그 순서였다`"
