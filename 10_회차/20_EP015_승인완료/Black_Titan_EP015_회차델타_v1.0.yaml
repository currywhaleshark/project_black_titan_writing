      - "밀어내기 1회 — 공격 아닌 경로 배제(치명타 시도 0)"
      - "종착: **마지막 가동 변전탑** 점거. 훅 — 처음으로 여덟 다리를 한꺼번에 도시 쪽으로 전개, 마지막 가동구획 경보"
