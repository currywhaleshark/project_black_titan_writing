      - "낙하 예상 구역 무인 유지 — 민간·시설 피해 0"
    evidence:
      scene: 3

  - category: "informational"
    field_path: "characters.sua.state"
    operation: "merge"
    after:
      - "**B3 첫 관찰(비전투·발화 0):** 소리 없는 화면에서 회피 반복을 봄 — 거리 눈금 어림, 접는 순서 정리(바깥쪽부터)"
      - "바이올린 공책에 이동 시각만 기록: 0시 47분 / 0시 58분 / 1시 11분. 이유는 적지 않음(모르는 것은 적지 않는 방식)"
      - "`달아나는 것도 싸우는 것도 아니면 무엇인지` — 낱말을 아직 갖지 못한 상태로 보존"
    evidence:
      scene: 4

  - category: "informational"
    field_path: "characters.myeongjun.state"
    operation: "merge"
    after:
      - "기록 2줄: 미식별 검은 거인, 추격 중단·붕괴 위험 구조물 지지 / 민간·시설 피해 없음"
      - "**`방어 협조 관측` 항목 신설**(상황실 실무 문답) — 협조 명시가 아닌 분류의 탄생"
      - "낙하구역 무인 유지 지시(`저 밑에 아무도 넣지 마라`)"
    evidence:
      scene: 3

  - category: "informational"
    field_path: "military.broadcast"
    operation: "advance"
    after:
      - "**EP14 송출의 회수:** 단아가 공개주파수 하중 방송을 수신·암기(40퍼센트·300미터), 오르기 경로와 받치기 셈에 사용 — `듣는 쪽`의 첫 실증(양측 모두 협조 명시 0)"
    evidence:
      scene: [1, 3]

