state_changes:
  dana:
    - "**★★ 몸의 예외** — 붕괴 없음. **어깨~등만 뻣뻣**(사슬 회전 후유). 일어나 앉기 정상 · 아침 완식"
    - "**★★★ 그래서 더 나쁘다** — `무너질 만큼 안 했는데 못 막았다`. **어제까지는 몸이 문제였고, 오늘은 몸이 괜찮은데 못 이긴 것.** 문제의 종류가 바뀜"
    - "**★★ 고압세척기 총대 실패** — 어깨로 받고 허리로 눌러야 하는데 **그 자리가 안 올라가는 자리다.** 두 걸음 밀림 · 할아버지가 말없이 받아 감 → **진행표를 듦**(수아가 늘 들던 종이 = 역할 하향)"
    - "**★★★ 전과 인식 고착** — 하루가 지나도 요약이 `한 마리` 그대로"
    - "**★ 기체 자국** — 이음매마다 긁힌 줄. `자국은 지워져`(영진 · 위로 아님)"
    - "**★★ 문자 미발신** — 혜정에게 뭘 쓸지 생각해 봤으나 **떠오르는 것마다 뒤가 막힘**"
    - "**★★★ `자고 나면 낫는다`의 폐기**(EP76 정면 회수) — 대신 **개학 날 대답을 미리 정해 두게 됨.** `미리 정해 두게 됐다는 게 제일 달라진 점`"
  sua:
    - "**★★★ 가시 3 — 방향 반전** — `그거 처음부터 했으면 더 많이 잡았을 텐데`. 앞부분은 감탄(하려던 말) · **뒷부분은 그냥 이어져 나온 말**"
    - "**★★ 자기 말을 자기 귀로 들음**(EP86 단아와 **같은 장치** — 자매가 같은 방식으로 서로를 찌른다) · **사과 안 함**(하면 아무것도 아닌 일이 되면서 아무것도 아니지 않은 게 남는다)"
    - "**★★★ 진짜 걸리는 것은 말이 아니다** — 어제 언니가 밀리는 걸 봤을 때 **제일 먼저 든 생각이 `무서워`가 아니라 `저렇게 하면 안 되는데`**였다. 무섭기는 했으나 **순서가 뒤**"
    - "**★★★ 이름을 못 붙인다** — **`요즘 내가 좀.`**에서 문장이 안 이어짐. 뭐가 이상한지를 몰라 설명이 안 되고, **설명이 안 되니까 덮인다**"
    - "**★★ 덮인 자리에 다른 게 들어온다** — `다음에 저런 게 또 오면 어떻게 해야 하나`. **`그 생각은 잘 됐다. 잘 되는 게 이상하다는 생각은 하지 않았다`**"
    - "**★ 봉인 유지** — 전투 쾌감 자각 0 · 즉각 기동 0. **징후만**"
    - "**★ 정체 칸 미기입** — `작고 많음`이라 적었다 지움"
  yeongjin:
    - "**★★★ 조달선 중단**(G0-016) — **`당분간 보내지 말게`** · 이유 0 · **상대도 안 물음**(여태 한 번도 안 물었다) · 호칭 **`선배님`**(국과연 후배)"
    - "**★★ 계산이 안 맞는 결정인 걸 알면서 한다** — 다음에 관측이 더 필요한데 지금 끊는다. **`트럭이 검문선을 두 번 지나갈 수는 없었다`** · 한 번은 운, **두 번째는 기록**"
    - "**★★ 남은 목록** — 절반이 아직 안 왔고 그중 둘은 **있어야 하는 것.** 언제 들어올지 모르는 상태가 됨"
    - "**★ 다음 통화의 값** — `다음에 급할 때 다시 걸어야 한다면 그때는 오늘보다 나쁜 통화가 될 것`"
    - "**★ 한 손의 시간** — 마당 물건 반입에 20분(두 손이면 5분 · 왼팔 결손 정합)"
  hyejeong:
    - "**★ 순찰 증가** — 이틀째 · 어제 그 소리에도 안 줄고 **큰길에 한 대 더**"
    - "**★★ 뉴스는 「저지 성공·시민 피해 없음」만** — 무엇을 저지했는지는 안 나옴. **`시민`에 단아가 들어가는지를 생각하는 자기가 이상했다**"
    - "**★★★ 물어볼 데 전량 차단** — 삼촌(일요일에 안 한 얘기를 해야 함) · 단아(하나를 물으려면 전부를 물어야 함) · 예진(판정은 져 줬으나 **답을 준 게 아님**)"
    - "**★★ 대상 없는 기다림** — `기다린다는 게 뭘 기다리는 건지는 이번에는 잘 몰랐다` · **답이 오는데도 안 보내는 건 처음**"
  myeongjun:
    - "**★ 보고 4줄** — 저지 성공 · 사상자 없음 · 화기 유효 · **유효 사유 미상**(서진이 세 번 고쳐 옴 → `미상`)"
    - "**★★★ 확보 판단 서면화** — **어디로도 안 나가는 종이**에 두 줄: `통제 밖의 전력이 도시 안에 있다` / `다음에 같은 규모가 오면 같은 방법을 쓸 수 없다`"
    - "**★★★ 세 번째 줄을 안 쓴다** — `확보해야 한다`. 쓰면 요청이 되고 요청은 상신되며 상신되면 위에서 묻는다. **대답할 게 아직 없다**(지명 하나 · 좌표 넉 달치 · 사격 구역에서 안 물러난 것 하나)"
    - "**★ 서진에게 생각을 묻는다** — `그냥 물어본 거다`. 서진은 대답하지 않음"
    - "**★ 검문선 유지 재확인** · **도영진 이름 0** — 종이에는 `구래동`만"
  seojin:
    - "**★★ 아무 데도 안 가는 문서** — `아무 데도 안 가는 문서는 대개 나중에 어디로 간다`"
    - "**★ 표지 덮는 손이 잠깐 멈춤** — 명준이 그걸 봄 · 서진은 말 안 함"

