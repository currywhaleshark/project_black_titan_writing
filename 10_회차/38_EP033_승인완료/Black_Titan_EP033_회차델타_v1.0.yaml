notes:
  - "S6 4/6 완료. 다음 **EP34 「움직일수록 굳는다」(중요 화 — 개선 재등장/동적 실패→정지).** **정지 통찰 해금 화.**"
  - "EP34 고정선(개요): 난동 = 잔해 사전 살포(직접 타격 0) → 단아 오판(눈속임/도주 연막 — `머리만 찾으면 끝` 호기) → 탁한 구역 돌진 → 움직일수록 손목·무릎·허리 경화 → 퇴로도 잔해 구역 → **왼팔부터 봉쇄**(왼손잡이의 습관 — 손목·팔꿈치·어깨) → **규칙 발견: 멈추면 새 경화가 느려진다·손가락 시험에 철편 즉시 몰림 → `자신을 붙잡는 것은 점액 속에서 움직이는 자기 자신`** → 오른주먹 남긴 채 정지"
  - "EP34 훅(개요): 멈춘 수몰 도로의 고요 → 왼쪽 관구에서 달려오는 압력파 → 오른주먹 반사적 반 치 → 손목에 자갈 3개 → 압력파는 몸 앞에서 사라짐 — **첫 번째 가짜 접근**(비우세손 가동범위만 소모)"
  - "EP34 금지(개요): 전투 중 흐림·저림·감각차단 0(왼팔 봉쇄 = 기체 관절 문제, 신경증상 아님 — 명시), 군 포격·전술명령 0, 원형 목적 공개 0"
