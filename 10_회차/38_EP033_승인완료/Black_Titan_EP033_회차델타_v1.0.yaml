canon_additions:
  - "시간: EP33 = 5/14 토 하루(가게 아침 → 오후 격납고 공사 → 저녁 → 밤 훅)"
  - "**군 자료 살포 정본(첨삭):** 군은 거인이 공개망 자료를 쓴다는 것을 눈치채고 매번 판독 자료를 뿌림 — 의도적 간접 지원(B2 암묵 협조. 직접 접촉·지휘는 없음)"
  - "**후처리 공사 정본:** 52미터 세척 = 비계+이동 조명+정·망치(2인 1조)+그라인더(한 손+거치대)+고압세척기(총대 반동). 발목 하나 반나절"
  - "**점검 절차 추가:** `점액 제거 뒤 구동저항 재측정` 칸 = 수아 호출 담당(세척 완료 후)"
  - "**용어 정본: 광물성 점액 띠**(고리 사용 금지)"
  - "굳은 잔해 물성: 돌보다 조개껍데기(금이 결을 따라 넓게 떨어짐)"
  - "기태 어록: `물 먹은 기계한테는 요일이 없다`(영진)·조수 호칭(단아)"
