  - "⑥ **`두 번째로 배양한 데서 둘이 나왔어. 그 검은 거하고, 너.` · `너도 내가 낳았어.`**"
  - "병원 = `…가면 알게 되니까.`(면역거부 0)"
  - "⑦ **`왜 떠났어요.`** → **미국 정보기관이 연구를 알고 찾아왔다 · 나를 데려가는 대신 너희 둘은 건드리지 않는다 · 너희 둘이 자유롭게 사는 게 조건 · 안 간다고 할 수 없었다 · 미국으로 갔다** · `그때 단아는 세 살이었어. 수아는 막 태어났고.`"

