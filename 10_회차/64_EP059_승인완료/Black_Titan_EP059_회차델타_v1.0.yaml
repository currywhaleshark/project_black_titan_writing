notes:
  - "**S9 9/11 완료.** 다음 = **EP60 「길목」 — 같은 교전을 시간 경과 0으로 이어받는다**"
  - "**EP60 잠금 예고:** 코칭(`무기를 쏜다고 생각하지 마라. 왼팔이 길어진다고 생각해`)이 **교신으로** 온다 → 쫓지 않고 **건물 사이 길목에 먼저 가서** 닻을 걸어 둔다 → 걸리고 → 버티고 → 당긴다 → **세 부족함이 한 동작에** → **신체 낯섦**(이겼는데 안 웃는다) → 훅 `아직 이름이 없다`"
  - "**★ EP60 물리 근거:** 좁은 데서는 **꺾는 값이 더 커진다.** 건물 사이에서는 직선밖에 못 간다"
  - "**미수령 잔여:** 수아 공책 · 서랍 사진 · **성호 100미터**(3차 청구 미결) · 가위값"
