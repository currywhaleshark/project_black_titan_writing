  - "**★ 등각류형 행동 정본:** 돌아온다 / 정면을 피하고 옆으로 치고 나간다 / 멈추면 지는 걸 안다 / **못 잡을 상대로 판단되면 떠난다**"
  - "**★ 질량 있는 속도의 서술 규격:** 지나가면 뒤늦은 파도 / 급선회 = 물이 벽처럼 섬 + 바닥이 활처럼 파임 + 뒤늦은 소리"
  - "**★ 부표가 순서를 반대로 잡는다** — 안쪽이 먼저 튀면 들어와서 지나간 것"
  - "**★ 갯벌의 역전:** 단단한 바닥에서는 **많은 다리가 이긴다**(EP4의 반대면)"
  - "**★ 미완결 회차의 상태 기록 방식:** SNAP에 `engagement_open` 블록 — 적 위치·기체 자국·장비 상태를 진행형으로 남긴다"
  - "**도구:** `check_draft`에 `집게형` 추가 / **머리말 표를 본문 검사에서 제외**(`strip_front_matter`) — 분량 측정이 약 230자 정확해짐"
  - "격언: `오는 게 아니라 벌써 왔어` / `눈으로 따라가는데 눈이 뒤에 있었다` / `본 게 늘 지나간 것이었다` / `가벼워서 빠른 게 아니었다` / `값을 치르는 쪽이 값을 안 치르는 쪽보다 빨랐다` / `힘이 남았는데 쓸 데가 없었다` / `보이는데 못 간다` / `둘 다 나쁜데 그중에 덜 나쁜 걸 고르는 거였다`"
