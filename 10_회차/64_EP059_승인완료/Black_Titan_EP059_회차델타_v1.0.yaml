notes_on_shape:
  - "**⚠ 이 델타는 종결된 사건의 기록이 아니다.** 회차가 교전 도중에 끊기므로 상태 변화의 상당수가 **미확정·진행 중**이다. EP60이 시간 경과 0으로 이어받아 종결한다"
changes:
  - category: "situational"
    field_path: "engagement.open"
    operation: "create"
    after:
      - "**⚠ 교전 미종결.** 퇴각도 격파도 없다"
      - "**진행 상태:** 저것은 도시 쪽으로 곧게 가는 중 / 거리 계속 벌어짐 / 이쪽은 **사슬 반쯤 나간 채 닻을 끌며** 쫓는 중"
      - "**기체:** 관통 0·대파 0. **스친 자국 누적** — 어깨·허리·왼쪽 종아리"
      - "**장비:** 통 밴드 **덜 조여짐**(급조 장착), 등판이 어제보다 낮게 앉음"
      - "**위치:** 외곽 수몰 시가지. 앞은 아직 물, 그 너머가 방재벽"
    evidence:
      scene: [2, 4, 5, 6]

  - category: "informational"
    field_path: "creatures.isopod"
    operation: "create"
    after:
      - "**★ 첫 지면 노출.** 마디 갑각·다리 여럿·길고 낮다. **기체 절반 — 사람 기준으로는 5층짜리가 옆으로 누워 달리는 크기**"
      - "**★ 질량 있는 속도:** 지나가면 물이 갈라지고 **한참 뒤에 파도가 밀려온다.** 급선회하면 **물이 벽처럼 서고, 드러난 바닥이 활처럼 파이고, 소리가 뒤늦게 터진다.** `가벼워서 빠른 게 아니었다`"
      - "**★ 행동 패턴:** 일대를 안 떠나고 **지나갔다가 크게 돌아 다시 온다.** 그래서 앞을 막을 수는 있다"
      - "**★ 싸움 방식:** 정면으로 안 온다. **틀어서 정면을 피하고 옆으로 붙어 치고 나간다.** 스치면서 긁는 것이 공격이다. **멈추면 지는 걸 저것도 안다**"
      - "**★ 여섯 번째에 원을 안 닫고 떠났다** — 못 잡을 상대로 판단한 것. **적이 계산해서 물러난 첫 사례**"
      - "**다리가 여럿이라 걸음을 안 고른다.** 부서진 걸 밟으면 부수고 지나간다"
      - "지면 지칭 = `빠른 놈`·`작은 것`. **작가용 명칭 0**"
    evidence:
      scene: [3, 4, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 미완성을 들고 나갔다.** 급조 장착·**덜 조인 채로**"
      - "**★ 여섯 번 막아서고 여섯 번 다 지나갔다.** 세 발 전부 빈 물 — **2단 발사의 정적 구간에 저것이 이미 딴 데 있다**"
      - "**★ 소리 순서가 뒤집혔다** — `본 게 늘 지나간 것이었다`"
      - "**★ 밀린 적도 크게 맞은 적도 없는데 자국만 늘었다.** `힘이 남았는데 쓸 데가 없었다`"
      - "**갯벌의 역전을 알아봤다** — 봄에는 하중이 한 점에 모이는 게 이겼는데 **단단한 데서는 많은 게 이긴다**"
      - "**EP9 회상:** 물 빠진 옛 도로·웅덩이·놀라 날아오르던 새. **오늘은 새가 없다**(이유 불명)"
      - "**끌고 가는 쪽을 골랐다** — `둘 다 나쁜데 그중에 덜 나쁜 걸 고르는 거였다`"
      - "※ **새 증상 0** / 원인 정리 0(EP60 몫)"
    evidence:
      scene: [2, 3, 4, 5, 6]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**관측 지원만.** `이백` → `삼백` → `오백. 더 벌어진다`. **전술 0**"
      - "**판단 한 줄:** `맨손으로 잡을 수 있는 놈이면 놓고 가`"
      - "**마지막에 교신이 조용해졌다** — 할 말이 없었다"
    evidence:
      scene: [2, 5, 6]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "부표 시각 세 개와 물때(**아홉 시까지 빠지고 그다음엔 찬다**). **전투 교신 0**"
    evidence:
      scene: 2

  - category: "situational"
    field_path: "living_conditions.observation"
    operation: "advance"
    after:
      - "**★ 부표가 순서를 반대로 잡았다** — 2번 → 5번 → 7번. **안쪽이 먼저 튀면 들어와서 지나간 것.** `들어와서 지나갔다는 거지`"
      - "**부표 간격이 봄 것들보다 훨씬 짧다.** 3월에는 그 사이에 준비를 했다"
      - "**대책 0**"
    evidence:
      scene: 1

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "no_change"
    after:
      - "**목격 0.** 새벽 다섯 시·외곽. 배도 안 나갔고 시장도 안 열었다. **여론 변화 0**"
    evidence:
      scene: 2

