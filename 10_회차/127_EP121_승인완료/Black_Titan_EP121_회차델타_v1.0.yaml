state_changes:
  lucy:
    - "**★★★★★ 시점 개시.** 대사는 교과서체이고 **서술은 유창하다** — 그 낙차가 이 인물의 형식이다"
    - "  독자는 EP116~118에서 딱딱한 사람으로 봤다. **말이 모자랐던 것이지 사람이 모자랐던 것이 아니다**"
    - "**★★★★ 거처 이동** — USS CARVER → **구래동 안전가옥**(LOC-08). 상시 육상 대기"
    - "  이동 사유 3줄: 미확인 대형체 활동 정지 확인 · 청해 방면 단독 방어로 전환 · 대기 위치 육상 변경"
    - "  **★★ 기체는 배에 남는다**(문서 명시)"
    - "**★★★ 문서 표기와 본인 어휘가 다르다** — 문서는 `미확인 대형체`, 본인은 **블랙 타이탄**을 안다"
    - "  `표기를 바꾸려면 상신을 해야 하고 (…) 이름을 알게 되었다는 것은 사유에 들어가지 않는다`"
    - "**★★★★ 땅이 안 움직인다** — 배는 늘 미세하게 움직였고 그건 세지 않는 종류였다"
    - "**★★★★★ 살던 집을 자로 읽는다** — 벽지의 사각형 넷 · 못 아홉 · 낮은 찬장 · 문틀 눈금 아홉"
    - "  **`제일 아래 것과 제일 위 것의 차이는 사십일 센티미터였다`**"
    - "  **★★★ 욕실의 다섯 번째 사각형** — `떨어진 것이 아니라 떼어 간 것이다`(거울)"
    - "  **★★ 읽되 해석하지 않는다.** 숫자는 얻고 의미는 못 얻는다"
    - "**★★★ 넣을 자리가 남는 것은 처음이었다** — 지급품 열네 점, 규정품 여섯 점"
    - "**★★★★ 사람이 줄어드는 시각이라는 것을 처음 만난다** — `배에서는 아무도 나가지 않는다`"
    - "  **밤에 집 안에 한 명, 밖에 두 명.** `확인했다. 확인하고 나서도 달라지는 것이 없었다`"
    - "**★★★★★ 불을 스스로 끈다** — `소등 시각은 정해져 있지 않았다` · 근거가 없어서 그냥 내렸다"
    - "**★★★★ 소리에 규칙이 없다** — 간격 4분·11분·2분·부재. `계산할 수 없으면 계속 듣고 있어야 한다`"
    - "  **★★ 잠들기까지 걸린 시간을 못 잰다** — `재려면 잠든 시각을 알아야 하는데, 잠들면 그것을 보지 못한다`"
    - "**★★★★★ 항목이 안 닫힌다** — 확인 항목 12개 전부 채웠고 답이 다 왔고 회신도 받았다"
    - "  **★★★ 12초** — 도단아가 이름을 대기까지 걸린 시간. `왜 12초였는지는 서식에 없었다`"
    - "  **★★★★ 그다음에 도단아가 한 것도 항목에 없었다** — 기록하지 않았다"
    - "  **마감: 종결로 넘겼다 → 넘어가지 않았다 → 다시 넘겼다**"
    - "**★★ 채점한다** — 팔 여덟 개 대응은 `교재에 없는 답이었다` · 두 번 다시 물었다"
    - "**★★★ 감정에 이름이 안 붙는다** — 원인을 소리로 기록한다. 독자만 다르게 읽는다"

  gaon:
    - "**★ ● 초출**(28 · 남해방위사령부 · 관리 담당) — 무엇을 관리하는지는 안 말했다"
    - "**★★★★ 친절이 아니라 유능이다** — 필요한 것을 먼저 말하고 불필요한 것을 안 말한다"
    - "  루시가 분류를 못 한다. **`모르는 것을 모른다고 하고 확인해서 준다고 하면 그건 보류다`**"
    - "**★★ 주는 것과 묻는 것이 어긋난다** — 쓰레기·물·시장 차 ↔ 경계 인원·출동 경로·이동 소요"
    - "  **둘 다 자기 일을 제대로 하고 있어서 갈등이 안 된다.** 어긋나기만 한다"
    - "**★ 「한 단어를 고쳐 옮긴다」는 미사용** — 통역 자리가 없었다. EP122~128 예약"

