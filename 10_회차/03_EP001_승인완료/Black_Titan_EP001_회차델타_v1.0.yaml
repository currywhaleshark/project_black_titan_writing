    after:
      - "청해 시민과 학생들이 수몰 구도심을 이동하는 거대 괴수의 실재를 목격하거나 재난경보로 인지함"
      - "검은 거인의 존재는 아직 공개되지 않음"
    evidence:
      scene: 4
      source_text_anchor: "청해 해안 재난경보. 해안가 주민 즉시 대피 바람."
  - category: "living_condition"
    field_path: "living_conditions.school"
    operation: "replace"
    before:
      - "현장체험학습 예정"
    after:
      - "6학년 현장체험학습이 재난경보로 중단되고 학생들이 학교에서 보호자에게 인계됨"
    evidence:
      scene: 4
      source_text_anchor: "학교 도착하면 바로 보호자 인계한다."
  - category: "logistical"
    field_path: "assets.youngjin_repair_shop.status"
