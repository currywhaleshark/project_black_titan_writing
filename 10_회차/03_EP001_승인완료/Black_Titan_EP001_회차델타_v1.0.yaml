    after:
      - "바닷가재형 회수개체가 수몰 구도심에 상륙해 연구단지 방향으로 이동 중"
      - "등장인물과 독자는 이를 파괴 목적의 침략으로 오해함"
    evidence:
      scene: 4
      source_text_anchor: "물에 잠긴 옛 건물 사이로 무언가가 움직이고 있었다."
