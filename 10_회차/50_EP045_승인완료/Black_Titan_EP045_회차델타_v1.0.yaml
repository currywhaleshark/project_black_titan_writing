notes:
  - "S8 5/10 완료. 다음 **EP46 「기록의 온도」 — 생활(후처리) 화.**"
  - "EP46 고정선(S8 개요): 군 기록 = 행동 양상 변화 첫 기재(`미식별 검은 거인` 문법 유지) / **외신 한 줄 = 화이트 센티널 사다리 1단**(내부망 뉴스 구석) / 학교 소문(공격당했다더라 — 걱정 여론) · 혜정·예진 수다 창구(수다 가드) / 영진 = 여름 장부가 두꺼워지기 시작 / 훅 = **남쪽 얕은 물의 다른 결**(집게형 접근 예고)"
  - "EP46 금지: 앵커 명명·설계(S9) / 루시·센티널 실체 노출(한 줄 암시까지) / 정체 확정 / 새 증상"
  - "EP46 인물: **혜정 복귀 필수**(간격 2)·예진·성호·한결 복귀 창구. 수아 = 학교 국면 가능"
