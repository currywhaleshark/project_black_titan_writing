changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**여름 첫 격파(6/13 월 밤).** 개수된 개체 격파 — 가시 서너 개 부러뜨림(마지막은 여러 개를 모아 쥐고 한 번에) → 몸통 노출 → 내려치기 → 붕괴·용해"
      - "**용해 물성 보강:** 검붉은 것이 물 위로 퍼졌다가 풀어짐. **쥐고 있던 파편도 손 안에서 흘러내려 사라짐 — 수거물 0**(정본 유지·시각적 확정)"
      - "지면 확인 사항 추가: **던진 물체는 부수지 못하되 흔든다**(조준 교란·발사 지연). 개체도 밀림의 규칙에서 예외가 아님"
    evidence:
      scene: [3, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**셈의 이전:** 빗소리로 귀가 막히자 **어깨로 오는 충격의 주기**로 간격을 셈(맞은 뒤 자세가 돌아오는 만큼). `한 번은 맞아 봐야 알 수 있는 셈` — 몸으로 줍는 방식의 자각"
      - "**던지기의 한계(핵심):** 자갈 크기는 무의미 / 큰 덩어리는 흔든다 / **손을 떠난 것은 닿는 순간 이쪽 것이 아니다 — 밀 수는 있어도 부술 수는 없다**"
      - "**앵커 씨앗 2단:** 필요한 것 = **팔보다 긴 것 + 손에서 놓지 않아도 되는 것.** `없다는 것과 필요하다는 것은 다른 이야기`(명명·요청 0)"
      - "**격파의 방법론(원시형):** 가시는 비틀어 꺾는다·두 번째부터 빨라진다·여러 개를 모아 쥐면 한 번에 꺾인다 / 몸통은 **부서질 때까지 내려친다**(기술 0 — `주먹을 어떻게 쥐어야 하는지도 제대로 몰랐다`)"
      - "**개수 흔적의 촉각 확인:** 가시 배열이 `자로 잰 것 같다` — 봄에는 고르는 게 일이었는데 지금은 손 가는 데마다 있음(`편하다는 게 이상했다`)"
      - "**밀어내기는 해결이 아니었다:** `봄에는 밀어내는 것으로 충분했다. 충분하다고 생각했었다. 지금 보니 그건 오늘로 미뤄 둔 것이었다`"
    evidence:
      scene: [1, 2, 3, 4, 5]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**대조 결론 지불(EP43 미지불 회수):** 통 뚜껑을 처음 열어 봄 가시 조각 실물 + 오늘 화면을 나란히 놓고 — **`봄 거랑 같은 데서 나온 건데요. 가시만 나중에 바뀐 거예요.`**(사실 진술·원인 0)"
      - "**귀환 점검 실무 재확인:** 손전등·기록판으로 발목→무릎→어깨 순 점검. **여름 피탄 자국 다섯 → 여덟**으로 계수·기록. 하부 점검은 이후로 예약(`물에 오래 있었으니까`)"
    evidence:
      scene: 6

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**첫 격파 귀환·무손상(관통 0).** 여름 피탄 자국 **여덟 개**(오른쪽 어깨 계열 — 수아 계수). 조종석 안쪽 벽에 손자국"
      - "무장 없음 유지. **투척은 유효 타격이 되지 못함이 실전으로 확인**(조준 교란까지)"
    evidence:
      scene: [3, 6]

  - category: "situational"
    field_path: "external_conditions.sea"
    operation: "advance"
    after:
      - "**엄폐 자원 전량 소진** — 물 위로 남아 있던 아파트 다섯 채가 교전 중 모두 낮아짐. 전장은 이후 재사용 시 엄폐 0 상태로 시작"
      - "여름 스콜 1회(교전 중반 개시 → 격파 직후 잦아듦)"
    evidence:
      scene: [1, 2, 5]

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**세다가 놓친 것을 동생이 대신 세어 놓음**(피탄 여덟 개) — 관측과 전투의 분업이 감정 층위로 처음 연결됨. 위로가 아니라 계수로 하는 방식(`많이 맞았어.`)"
    evidence:
      scene: 6

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**귀환 맞이 정본:** 수건 한 장 + `오래 걸렸다` / `오래 걸릴 만한 일이었다`. 칭찬·안도 표현 0으로 수고를 전달하는 방식"
    evidence:
      scene: 6

