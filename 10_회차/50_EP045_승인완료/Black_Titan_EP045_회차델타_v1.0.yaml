canon_additions:
  - "시간: EP45 = 6/13(월) 깊은 밤 → 자정 무렵 귀환(EP44에서 경과 0)"
  - "**자매 어투 정본(사용자 2026-08-12): 수아는 단아에게 존댓말을 쓰지 않는다**(존댓말은 영진에게만). 이전 회차 소급은 별도 검토"
  - "**귀환 절차 정본:** 귀환은 **격납고에서 맞는다** — 영진 = 수건과 실용적 한마디 / **수아 = 귀환 점검 담당**(봄에 정해진 뒤 남에게 넘긴 적 없음·손전등·기록판·피탄 계수). 가게로 가려면 **계단을 올라 철문**(지하↔가게 동선 정본)"
  - "**용해 물성 보강:** 검붉은 것이 퍼졌다가 풀어짐 + **쥐고 있던 파편도 손 안에서 흘러내려 사라짐**(수거물 0 확정)"
  - "**투척 정본:** 던진 물체는 **부수지 못하고 흔든다**(조준 교란·발사 지연). 손을 떠난 것은 이쪽 것이 아니다 — **앵커가 손에 이어진 무기여야 하는 인과**"
  - "**격투 성장 곡선 기점:** 기술 0의 내려치기. 이후 농게형 육탄전·합성괴수·앵커 운용이 전부 이 지점에서 출발"
  - "격언 계보: `알아냈다고 이겨지지는 않았다. 그래도 알아내기 전보다는 나았다` / `한 번은 맞아 봐야 알 수 있는 셈이었다` / `편했다. 편하다는 게 이상했다` / `이겼는데 이긴 것 같지 않았다` / `오래 걸릴 만한 일이었다`"
