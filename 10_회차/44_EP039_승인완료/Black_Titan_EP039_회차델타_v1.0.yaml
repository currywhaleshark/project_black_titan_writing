notes:
  - "S7 4/5 완료. 다음 **EP40 「마지막 회수」(중요 화 — 두 번째 결착/봄 결산/초여름 인계. 시간 경과 0 진입 후 귀환·다음 날까지). 봄 시즌 마감 화 — S7 종료장부 대조서+아크캡슐 S7+봄 마감 절차.**"
  - "EP40 고정선(개요 v1.2): **지시를 잃은 운반자**(기초 끌기 반복 — 흡착발 뗐다 붙일 때마다 중첩 갑판이 순서대로 벌어짐 → **단아 = 무작정 안 때리고 한 주기 끝까지 관찰**) → **뒤집는 맨손**(수축 때 뒤쪽 갑판 들리는 순간 손가락 넣고 몸 낮춤 → 당기는 힘 vs 버티는 힘 사이 → 갑판 손잡이 세우고 다리로 바닥 밀어 **옆으로 뒤집기**) → **운반기관 파괴**(드러난 아래쪽 — 흡착발·운반막 재폐합 시도 → 한쪽 막 발로 밟고 반대쪽 두 손 — 양방향 벌리기 → 중앙 수축고리·이동기관 파열 → 기능정지·**기초 옆에 뒤집힌 채 용해 개시**) → B2 봄 결산(순차 행동기록·정체 미확인·`미식별 검은 거인`만) → **B1 `끝났어` 발신** → 혜정 답(필기 사진 + `내일 보자. 성호가 내일 기어코 마지막 한 판 한대`) → **B4 다음 날**(마지막 한 판 요구·점수판 시비 — **개요 `표적 던지기` = 티볼 마지막 타석으로 정정**·쌍방 앙숙 완전 복귀) → C1 봄 증상선(피곤하지만 저림 재발 0·악력/보행/시야 정상·영진 기록 유지·후보 열어 두기·확정 진단 0) → C4 재분류 심의(작가용·해설 0) → **초여름 훅: 외해 감시화면 낮고 빠른 수중 실루엣 1프레임 — 형상 분석 공란·예상 속도 칸만 세 자릿수**"
  - "EP40 금지(개요): 재분류 = `심의 시작`까지(확정·전투형 해설 0), 속도형 형상·공격·아이언 앵커 비공개, 수아 탑승·적합성 0, 학교 파손 0, 새 급성 C1·통증성 피드백 누출·확정 진단 0, 외부/군 기록 `블랙 타이탄` 0"
  - "**S7 종료장부 대조 예고:** B1 항목의 `예진·한결과 귀가 준비` = 사용자 1안 재배치로 소멸 — 대조서에 사용자 승인 이탈로 기록(봄 결산 보강분 검토)"
