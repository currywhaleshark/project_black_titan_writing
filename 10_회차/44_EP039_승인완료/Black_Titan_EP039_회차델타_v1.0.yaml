canon_additions:
  - "시간: EP39 = 5/17 화 밤 연속(시간 경과 0). **전투 미종결 — EP40 = 시간 경과 0 진입(위기 지속 5호)**"
  - "**수몰 화물부두 수심 정본(사용자):** 블랙 타이탄 기준 가슴께 — 하반신 침수·상체 노출(밤에도 꽃이 추적 가능한 근거. 몸을 다 숨길 곳 없음)"
  - "**결착 정본(사용자 — 개요 이탈 승인):** 등반 아님 — 사각 징검다리 접근 → 맨 구간 노출 돌파 → **크레인 전도**(어깨→씨름 박자·정렬 직전) → 쓰러진 꽃에서 원반 역방향 비틀기"
  - "**꽃 근접 물성(첫 노출):** 꽃잎 팔 1개 = 블랙 타이탄 팔 길이·중앙 판 = 두 아름·매끈(`눈이라고 부르기로 한 게 미안해질 만큼 아무것도 없었다`)·접힌 채 상시 잔떨림"
  - "격언 계보: `나무를 흔들면 감이 떨어진다`(단아) / `서 있는 것은 넘어질 수 있다` / `처음 만들어 보는 손맛`(정지 결착)"
  - "**시간 지시어 원칙(정정 계기):** 연속 밤 국면에서 `어제` 금지 — 아까/밤새/조금 전 사용(EP38 소급 2곳 포함)"
