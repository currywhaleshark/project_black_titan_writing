state_changes:
  dana:
    - "**★★ `그럼 됐어`를 쓴다**(EP61 화자 역전). 혜정의 `저번에— / 아니다`를 **모른 척 넘어가는 대신 받았다.** `정확히 같은 이유로 정확히 같은 문을 닫았다` · **`닫히는 쪽에서는 그게 어떻게 들리는지, 이제 알았다`**"
    - "**★ 말할 자리가 없는 곳이 넷** — 집·학교·혜정·**정호의 관찰.** `누구도 안 물어서 못 하는 게 아니었다. 물어 줬는데 못 하는 것이었다`"
    - "**★★ 물고기의 신호를 알아듣는다** — `잡으러 왔던 것들과 부수러 오는 것들. (…) 이제 물고기들도 아는 모양이었다. **사람 중에 그걸 말로 하는 사람만 없었다**`"
    - "나흘째 그대로. 아침 확인을 **세지도 않는다** · 밥상 복귀에 맞춰 국에 안 말고 먹는다"
    - "**방학이 편할 거라고 생각했다 — `편할 거라고 생각한 게 오늘 제일 안 좋은 생각이었다`**"
  sua:
    - "**★ 봄 공책 옮겨 적기 완료**(3/2~5/18 · 두 달). **빈칸 스무 줄은 빈칸째로** — `못 채우는 걸 채운 척하면 그건 기록이 아니게 된다`"
    - "**끝났다고 말할 사람이 없다** — 말하면 표 얘기가, 표 얘기가 나오면 안 적은 칸이 나온다. **`이 집에는 말 안 하는 사람이 하나씩 더 늘고 있었다`**"
    - "언니 방 불을 문틈으로 확인하고 자기 불을 끈다"
  youngjin:
    - "어탐 수리 접수(센서 — 방학 지나서) · **밥상을 밥으로 복귀**(나흘 만 — 나은 걸로 하기로 한 셈)"
    - "`급할 것 없는 물건들이 요즘 작업대에 늘고 있었다`"

relationships:
  - "**★★ 혜정 — `저번에—` / `아니다.`**(EP67 계보). 자책은 지면 밖(단아 시점) — 걸레 두 번 짜기 · 닦은 데 또 닦기 · **손이 빠른데 같은 데를 두 번씩**"
  - "**★★ 예진 — 다리 수행.** 평소 말이 길지 않은 애가 **오늘 길다는 것 자체가 신호**(말투카드 정본). 조 교환 · `진짜 괜찮아?` 하나만. **혜정이 알아채고 고마워서 모른 척했을 것**"
  - "**★★ 배정호 ●(간격 64 회수 — 여름편 조연 소실 전량 해소).** 어부의 계기: **`고기가 사흘째 안 돌아옵니다`** — 봄에는 다음 날이면 돌아왔다. **§1-A의 첫 외부 확인**"
  - "**세 어른의 안 보는 법** — 기태(지나가는 눈) / **정호(둘러보지도 않음)** / 혜정(봤다)"
  - "성호 ○ — 사흘째 영상 얘기 · 나래 ○ — 창밖을 오래 보는 애"

world_changes:
  - "**★ 항 안 고기 실종 사흘째** — 봄 전투 때는 하루면 돌아왔다. **물고기가 먼저 안다**"
  - "임시 교실 반납 대청소 완료 · **내일 = 방학식**"
  - "봄 공책 → 여름 장부 이관 완료"

