state_changes:
  dana:
    - "**★ 어깨 회복 중** — 어깨까지는 무리 없고 그 위에서 걸린다. 걸리는 자리가 어제보다 조금 위"
    - "**★★★ 아침 확인 3단계** — 세기 시작(EP83) → 세지 않음(EP90) → **재는데 아무 데도 안 적는다**(EP93). 수아 표에도 0 · `안 적으면 아는 사람이 하나가 된다`"
    - "**★★ 역할 고착** — 총대·큰 렌치 불가 → **진행표 담당**(수아가 들던 종이). 그릇도 두 번에 나눠 옮김"
    - "**★★ 안 묻는 것의 완성형** — 왜 맞는 부품을 못 구하느냐고 묻지 않는다. `안 물어봐도 되는 것들이 하나씩 늘었고, 늘어난 것들은 다 그대로 있었다`"
    - "**★ 안 보는 것도 늘었다** — 수아가 밀어 둔 표를 펴 보지 않는다"
    - "**★ 요일이 다시 생겼다** — 개학이 가까워지니 열한 밤이 요일로 환산된다"
  yeongjin:
    - "**★★★ 조달 중단의 값이 하루 만에** — 이음매 **안쪽** 손상에 **맞는 부품이 없다**"
    - "**★★ 「정품」 개념 폐기**(사용자 정정) — 새로 만드는 물건이 거의 없는 도시. 뜯어 온 것·건져 온 것을 고쳐 쓴다. **규격이 맞으면 운이 좋은 것**"
    - "**★ 깎아서 맞춘다** — 한 손이라 바이스 고정에 시간. `두 손이면 한 번에 될 일이 세 번으로 나뉘었다`"
    - "**★★★ 관측 계통 하나를 미룬다** — `오늘은 된다`(= 오늘만 된다). 상자는 선반 밑으로"
    - "**★ 무해한 말 하나** — `내일은 좀 시원하다더라`(위로도 설명도 아님)"
  sua:
    - "**★★ 조심 — 말을 고른다.** 표를 정리하다 발견해도 말하지 않는다. **`…아니야` / `별거 아니야`**"
    - "**★ 사과는 안 했다** — 안 한 채로 하루가 지나감"
    - "**★ 저녁의 유일한 말** — `비 오면 시원하죠`. 원래 같으면 십 분이 붙었을 자리"
    - "**★ 설거지를 자기가 한다** — 말 없이"

relationships:
  - "**★★★ 배려가 거리가 된다** — 수아는 말을 고르고 단아는 `괜찮은데`를 안 한다(하면 안 괜찮은 일이 되므로). **둘 다 배려하는데 집이 더 조용해진다**"
  - "**★★ 단아가 화를 못 내는 이유** — `틀린 말은 아니라고 하면 된다. **맞는 말은 아니라고 할 수가 없다.**` + **`벽을 못 넘게 할 수 있었을지도 모른다`**(사용자 추가)"
  - "**★ 오미란 회수**(간격 17) — 좌판 절반 · 생활 불평 · 시들한 것 한 봉지"
  - "**★ 영진 ↔ 단아:** 도와줄까를 세 번 생각하고 안 함(`오래 걸리는 걸 오래 걸리게 두는 게 이 집의 방식`)"

world_changes:
  - "**★★★ 검문의 일상화(열흘째)** — 사람들이 순찰차 앞에서 **반 발짝 비켜 감**(통제가 아니라 습관) · 아이들이 옆에서 놀고 순경에게 껌을 받는다 · 미란 **`이제 저기 서 있는 게 안 이상해`**"
  - "**★★ 이상하지 않으면 안 묻는다** — 처음 사흘은 물었을 것이고, 대답이 없으면 사람은 묻기를 그만둔다. **걷힐 이유도 같이 없어진다**"
  - "**★★ 생활면 여파** — 큰길 검문으로 배송 지연(한 대 세우면 이십 분) → 시장 물건 절반 → **밥상 반찬 하나 감소**"
  - "**★ 미란의 벽 바깥 한 줄** — `우리 살던 데는 저런 것도 없었어`(하구래 · G0-015 · 단아는 뜻을 모름)"

canon_changes:
  - "**★★ 「정품」 개념 없음** — 대수몰 이후 청해의 부품 경제(고쳐 쓰기·건져 쓰기·재조합)"
  - "**★★★ 잔해가 남지 않는다**(G0-011의 정비 현장 적용) — 판 사이를 긁어 놨는데 **긁은 쪽은 흔적도 없다.** 자국만 남는다"
  - "**★ 기체는 수중 운용** — 녹 우려 없음(사용자 정정)"
  - "**★ 이음매 구조** — 겹판 · 나사 열두 개에 판 하나 · 판 스물몇 장"

