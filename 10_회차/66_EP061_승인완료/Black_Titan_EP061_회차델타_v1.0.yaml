changes:
  - category: "situational"
    field_path: "equipment.anchor_rig"
    operation: "advance"
    after:
      - "**★ 이름이 붙었다 — `아이언 앵커`.** **가족 내부 명칭**이고 밖에 나가는 이름이 아니다. **단아가 휴대폰 사전에서 `쇠`와 `닻`을 쳐서** 붙였다"
      - "**멋이 없다는 걸 다들 안다. 아무도 말 안 한다** — 영진은 원래 그런 걸 안 따지고, 수아는 언니가 정한 걸 그냥 적고, 단아는 알지만 다른 게 안 떠올랐다"
      - "**정비:** 뻘이 제일 일(사슬 마디·감개 안쪽). 자국 셋 중 **어깨만 갈았다.** 푸는 데 **두 시간**"
      - "**닻 끝의 콘크리트는 안 뗐다** — 오른쪽 벽에서 딸려 나온 것"
    evidence:
      scene: [1, 5]

  - category: "situational"
    field_path: "living_conditions.settlement"
    operation: "create"
    after:
      - "**★ 고철값 결산 완료.** 돈으로 안 했다 — **영진이 기태네 권양기와 발전기를 봐 주기로**(다음 주). **종이에 무게와 날짜만 남았다**"
      - "**★ 기태는 뭘 만들었는지 안 물었다** — `쓸 데가 있었으니까 썼지`에서 끝"
      - "**마당의 고철 거의 소진.** 형강 몇 개와 드럼통 둘"
      - "영진의 말이 봄과 같다 — **`돌게 만들면 되죠.`**(EP51 회수 · 주고받음이 뒤바뀐 채로)"
    evidence:
      scene: 3

  - category: "situational"
    field_path: "living_conditions.school"
    operation: "advance"
    after:
      - "**★ 6/28 하루 결석.** 영진이 담임(김주호)에게 **아프다고 둘러댔다**"
      - "**★ 혜정의 약속이 걸렸다**(EP32) — `아프면 아프다고 하기로 했잖아`"
      - "**★ 비대칭:** 단아는 **약속을 안 어겼다**(안 아팠으니 먼저 말할 게 없었다). **혜정 쪽에서는 어긴 걸로 보이고 정정할 수 없다**"
      - "**오해 3건:** 성호 = 겁 / 예진 = 집안일 / 혜정 = 약속 위반. **셋 다 틀렸고 셋 다 못 고친다**"
      - "혜정의 답 = `그럼 됐어. 필기 다 해 놨으니까 걱정 말고` → **`화를 냈으면 차라리 나았을 것이다`**"
      - "예진은 한 줄 — `푹 자.` **뭐가 아프냐고 안 물었다**"
      - "**다음 주 청소 구역 = 창가**"
    evidence:
      scene: 2

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**개체 표:** `길고 낮음. 다리 여럿.` / `밀어서 감. 도는 게 아님.` / `얕은 데로만 감.` / `멈추면 못 일어남.` **이름 0**"
      - "**★ `남은 것` 칸이 처음으로 안 늘었다** — `폐허니까.`"
      - "**★ 기체 표에 칸 신설**(봄부터 한 번도 안 늘렸던 표). 그 칸 때문에 이름이 필요해졌다"
      - "**★ 적의 목적 변화를 표에서 알아챘다:** `봄에 온 것들은 다 타이탄을 잡아가려고 했는데 요즘은 전혀 안 그래` — 가시 → 팔 부러뜨리기 → 깔아뭉개기 → **상대도 안 해 줌.** **이유 0·대책 0**"
      - "**★ 자리 = 격납고 화면 앞(상시).** 특별한 일이 없으면 늘 같이 본다"
    evidence:
      scene: 4

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 이름을 붙였다** — 휴대폰 사전으로. **멋이 없다는 걸 안다**"
      - "**★ 팔이 길어졌다는 감각이 남았다.** `놓을 생각을 안 했다`가 계속 걸린다. **아직 낯설고, 낯선 게 나쁜 건 아니라는 것도 안다**"
      - "**★ 없어지면 그냥 팔이 된다** — `그게 좋은 건지는 잘 모르겠다`"
      - "**만든 게 아니라 모은 것:** 인양장의 체인·도르래 / 금요일 큰 차의 통과 등판 / 마당의 닻 / 주말 밤"
      - "**장부의 간격이 눈에 보인다** — 3월은 멀고 6월은 붙어 있다. **세다가 그만뒀다**"
      - "**아픈 것과 쓴 것의 구분**(봄에 배운 것) — 팔이 뻐근하고 다리가 무거운 건 아픈 게 아니다"
      - "※ **새 증상 0**"
    evidence:
      scene: [1, 2, 5, 6, 7]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**담임에게 아프다고 둘러댔다** — 뭐라고 했는지는 안 말했고 단아도 안 물었다"
      - "**값을 노동으로 정했다.** `돌게 만들면 되죠.`"
      - "**명명에 개입하지 않았다** — `이럴 때 뭐라고 하는 사람이 아니다. 좋다고도 안 하고 그게 뭐냐고도 안 한다`"
      - "**밤에 장부를 폈는데 뭘 적으려고 편 게 아니었다**"
    evidence:
      scene: [2, 3, 5, 7]

  - category: "relational"
    field_path: "relations.dana_gitae"
    operation: "advance"
    after:
      - "**간격 3 회수.** `어이, 조수` 유지 · `조수, 다음 주에 또 봐`"
      - "**미세한 긴장 존속** — `던져 놓고 대답을 안 기다린다. 그러니까 매번 조금 긴장된다`"
      - "**짚을 건 짚고 안 물을 건 안 묻는 사람**(EP51 `이건 고철이 아닌데요` 계보)"
    evidence:
      scene: 3

