state_changes:
  sua:
    - "**★★★ 관통당했다** — 등에서 배로 · 허리(요추) · 예고 0 · 소리 0"
    - "  `닿았다고 생각한 순간에 이미 지나가 있었다. 등에서 배로. 뒤에서 앞으로. 그 사이에 아무것도 없었다`"
    - "**★★★ 고개가 안 내려간다** — 보려고 했는데 못 본다"
    - "  `하려는 것과 되는 것 사이에 뭔가가 있었고, 그건 아침부터 지금까지 한 번도 없던 것이었다`"
    - "  **★★ EP101 우세의 근거가 정확히 반대로 뒤집힌다**(지연 0 → 지연 발생)"
    - "  **★ 씬 5에서 확대:** 목이 안 돌아간다 · `그 사이에 있는 게 넓어져 있었다`"
    - "**★★★ 인지 순서:** ① 아프다(이름이 붙자 그전 것까지 한꺼번에) ② **배를 만진다 — 손은 간다 · 아무것도 안 뚫려 있다** ③ **안 없어진다** ④ `여긴 내 몸이 아닌데`"
    - "  `손으로 만지는 자리와 아픈 자리가 같은 자리인데, 하나는 멀쩡하고 하나는 아팠다. 둘 다 자기 배였다. / 아까까지는 그게 하나였다`"
    - "**★★★ 척수** — 등 한가운데를 타고 올라옴 · 지나가는 자리마다 켜지는 느낌 · **목까지 오자 숨 쉬는 방법이 생각 안 남** · 원인·계통 설명 0"
    - "**★★ 근접 이행 — EP101의 자기 원칙을 스스로 깼다**"
    - "  회전은 **바깥만 깬다**(원은 넓게 지나가는 대신 얕게 지나간다) → **안까지 가야 끝난다**"
    - "  `규칙을 정한 것도 자기고 바꾸는 것도 자기였다`"
    - "  근거: 촉수 여덟 개 전부 아래에 늘어짐 · 부리 정지 · **위험이 없어 보인다**"
    - "**★★ 앵커를 쏘지 않고 들어가서 찔러 넣는다** — 무른 데가 길었다 · 팔이 껍데기에 닿을 때까지"
    - "**★★★ 끝났다는 확인 4중(전부 사실 · 그런데 틀렸다):** 안 움직임 · 촉수 0 · 부리 벌어진 채 멈춤 · **소리 없음**"
    - "**★ 뽑는 데 두 손 + 발로 껍데기를 짚음** · 한 번 미끄러짐 · 빠질 때 뒤로 한 걸음 밀림"
    - "**★★ 몸 최고점 유지** — 하나도 안 힘들다 · 시작할 때보다 지금이 더 잘 움직인다(관통 직전까지)"
    - "**★★ 의식이 멀어진다**(실신 확정은 EP103)"
  dana:
    - "**★★ 끝났다는 말에 숨을 놓았다** — `오늘 안에 끝났고 동생은 멀쩡했고 자기가 한 말이 나쁜 결과로 안 갔다`"
    - "**★★★ 걸음이 멈춘다** — 걸으며 흔들리던 화면이 **한 번 크게 흔들리고** 안 움직임"
    - "  **★★★ 관통을 봤다. 다만 못 읽었다** — `그게 무슨 흔들림인지는 몰랐다. 걷다가 뭘 밟아도 화면은 흔들렸다`"
    - "**★★★ 알 방법이 없다** — 밖에서 찍는 데가 없다 · 일어서 봐야 화면이 안 달라지는데 일어섰다"
    - "**★★ 동생이 보는 것을 자기도 본다 — 둘 다 모른다**"
    - "**★ 발화 = 이름 한 번**(그 전에 영진에게 `뭐야.` 하나)"
  youngjin:
    - "**★★ 근접을 막지 않는다** — 확인만 요구(`촉수 확인하고 가라` → `천천히 가라`)"
    - "**★★★ `앞에 조각 많다. 밟지 말고 돌아 나와라`** — 평범한 절차어가 **돌아서게 만든 말**이 된다"
    - "**★★ 볼 항목이 아니던 데를 본다** — 압력·온도·결속만 보던 사람이 처음으로"
    - "**★ 대답 없는 호출 2회**(`수아야` · `수아야. 대답해라`)"

enemy:
  - "**★★ 죽지 않았다** — 확인 4중이 전부 사실이었는데 틀렸다"
  - "**★★★ 뭐가 뚫었는지 지면 0** — 포신·발사·구조 서술 전량 금지"
  - "**★ 위장의 정체 지면 0** — 수아가 알 방법이 없다"
  - "**★★ 용해 안 됨** — `녹지는 않는데요` → `물이 얕으니 시간이 걸릴 거다`"

new_element:
  - "**★★★ 미사일 + 와이어 한 줄** — 시야 옆을 스쳐 뒤로 · 끌려가며 늘어짐 · **어디서 오는지 안 보임** · 용도 설명 0"
  - "**★★★ 뒤에서 폭발** — 등이 먼저 밀리고 소리는 그다음 · **뭐가 터졌는지 못 봄**"
  - "**★★★ 하얀 거인** — 왼쪽에서 앞으로 · 천천히 · 이쪽만 하거나 조금 더 큼"
  - "  **★ 물을 미는데 물이 앞으로 안 밀린다**(이유 서술 0)"
  - "  **★★ 여기 뭐가 있는지 이미 아는 걸음** — 뛰지도 멈추지도 않는다"
  - "  **이름·소속·무장 0 · 루시 대사 0 · 얼굴 0** · 수아는 하얗다는 것만 안다"

canon_new:
  - "**★★ 용해 속도는 수심에 좌우된다** — 물에 닿는 면이 적으면 느리다(EP103 잔해 근거)"
  - "**★ 조종석 스케일 척도 = 기체의 팔뚝.** 「사람 키」는 쓰지 않는다(EP101 부리 소급 정정)"

author_device:
  - "**★★★ 문체 회수 완결:** EP101 씬 3에서 버린 조작 어휘가 **EP102 씬 4 첫머리에서 복귀**"
  - "  약 1.5화 분량 동안 조작 어휘 0 → 경고음·계기·결속 표시·조종석이 한꺼번에"
  - "  **복귀 자체가 사건.** 설명 문장 0"
  - "**★★★ 시야 공유 정합:** 조종석 시야뿐이므로 **관통물의 목격이 0** — 모르는 것이 아니라 **못 본 것**. 사실은 나중에 전해지고(수아의 말·기체 손상·군의 조사) **장면만 안 전해진다**"
  - "  보이는 것은 **발치의 물이 검붉어지는 것**뿐 · `어디서 나오는지는 안 보였다`"

