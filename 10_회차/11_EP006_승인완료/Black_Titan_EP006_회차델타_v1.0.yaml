notes:
  - "S1 아크 마감 화 — 마감 절차(종료 장부 대조·아크 캡슐)는 Gate E와 함께 수행."
  - "예진의 인지 여부는 의도적으로 미확정(서술 확정 제거) — 여름에 어느 쪽으로도 회수 가능."
  - "강한결 반장, §6-6 인물 첫 노출 규칙, §6-7 줄바꿈 규칙이 이 화의 첨삭에서 파생됨."
