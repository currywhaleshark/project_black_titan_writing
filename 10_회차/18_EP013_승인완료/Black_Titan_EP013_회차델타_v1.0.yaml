  approved_at: "2026-08-04"
  approval_note: "초고 v0.1 → 사용자 수정 2건(체육대회 4월 27일 수요일, 수아 방과후 배경) → 모바일 첨삭 3건 → `승인처리하자`. S3 도입 화."
based_on_snapshot: "SNAP-012 v1.0"
produces_snapshot: "SNAP-013 v1.0"
changes:
  - category: "living_condition"
    field_path: "characters.dana.commitments"
    operation: "merge"
    after:
      - "**4월 시간표 성립 — 학교 / 수리점 / 훈련 세 칸.** 수첩에 직접 적음(셋째 칸은 `집안일`로 위장 표기)"
      - "부품 가는 날 = 네 번째 부담(주말 오전, 줄질). 조달품은 바로 못 쓴다는 것을 손으로 배움"
      - "확신 상태: `시간표만 지키면 다 지킬 수 있다`(소아크 실패의 전제 — 작가용)"
    evidence:
      scene: [1, 2, 3]

  - category: "relational"
    field_path: "relations.dana_hyejeong"
    operation: "advance"
    after:
      - "**B1 국면 전환 — 질문에서 실무로.** 단아의 `집안일` 핑계에 혜정은 `어.` 한 글자. 캐묻지 않음(봄 직접 질문 예산 소진 준수)"
      - "혜정이 단아 몫 준비물을 따로 묶어 둠(색 테이프 두 번, 이름 세 글자, 가위 동봉). 그 주에 두 번 — 두 번째 봉지에는 동그라미 하나"
      - "단아의 외상 장부 자각 심화 — 고맙다는 말이 늦고 작게 나옴. 동그라미의 뜻은 묻지 못함(미회수)"
    evidence:
      scene: 1

  - category: "resource"
    field_path: "supply_line.gitae"
    operation: "advance"
    after:
      - "**기태 조달 1차 물량 도착**(목요일) — 상자 3개, 전표 1장. 기태 본인은 미등장(글씨·오토바이 없음, 물건만)"
      - "분류 결과 세 무더기: 쓸 수 있는 것 / 갈아야 맞는 것(최다) / 못 쓰는 것"
      - "실런트 1통 폐기(뚜껑 안에서 굳음), 강판은 두께 맞으나 구멍 간격 제각각, 따개비 자국 = 갈아 낼 목록"
      - "장부: 오른쪽 무더기는 숫자, 가운데 무더기는 별표(손이 갈 시간). 4월 칸 부족"
    evidence:
      scene: 2

  - category: "informational"
    field_path: "characters.sua.state"
    operation: "merge"
    after:
      - "**B3 첫 생활세계 — 3학년 바이올린 방과후수업.** 사유: 3학년 하교가 1시간 빠르고 4월부터 영진이 조달·정비로 바빠져 언니와 하교를 맞춤(영진의 판단). 바이올린 선택은 수아 본인"
      - "**이하랑과 첫 접점** — 다른 반, 방과후에서만 만나는 사이. 같은 마디에서 같이 틀리는 관계로 시작"
      - "부품 분류에서 라벨 읽기 담당 — 셋 중 제일 말 없고 제일 안 틀림"
      - "**조종석 응시 1컷**(계단 앞, 해치 열린 상태). 아무도 알아채지 못함 — 독자 전용. 전투 참여·분석·발화 0"
    evidence:
      scene: [2, 4]

  - category: "external"
    field_path: "external_conditions.city"
    operation: "open"
    after:
      - "**첫 이상 징후: 3회 점멸.** 금요일 방과후, 교실 조명과 연구단지 철탑 항공등이 같은 간격으로 세 번 꺼졌다 켜짐"
      - "반응은 짧은 웅성거림까지 — 원인 추정·불안 서술 0. 아이들은 형광등 문제로 넘김"
      - "발전량 자체의 이상은 아직 드러나지 않음(EP14 진입선)"
    evidence:
      scene: 4

  - category: "school"
    field_path: "living_conditions.school"
    operation: "merge"
    after:
      - "**체육대회 4월 27일 수요일 확정**(사용자 지시 — 2050년 기준 수요일)"
      - "계주 대표 = 도단아·이성호(반대 0). 마지막 주자는 다음 체육 시간에 달려서 정하기로 — 미회수 약속"
      - "응원 연습 수·금 방과후 30분. 단아는 두 번 다 불참"
      - "성호의 구호 시안: `이겨라 우리 반. 검은 거인처럼.` — 애칭의 학교 내 일상 사용"
      - "4월 초 청해: 낮은 초여름 온도, 야외수업·행사가 이 몇 주에 몰림(`날씨가 허락할 때`)"
    evidence:
      scene: 1

