state_changes:
  dana:
    - "**★ 마감 판정 — 안 나았다.** `이틀을 잤다. (…) 확실해진 것은 나은 게 아니라는 쪽이었다.` **감기가 아니면 뭔지로 못 넘어간다 — 부표가 먼저 울었다**"
    - "**★★ 철문을 안 닫았다.** 아파서. 아침 순서상 마지막으로 내려간 사람이다. **본인은 저녁에야 안다** — `기억이 안 나는 게 대답이었다`"
    - "**★★ 근접 기피 발생.** `가까이 가서 끝내는 그림이 먼저 그려졌다. 그려지는데 **가슴이 싫다고 했다**` · **`아는 몸은 처음이었다`**"
    - "**★★ 앵커 관통.** `걸리라고 쏜 것이었다. 걸리지 않고 허공에 멈췄다. 로켓 불꽃이 터져 나오고 (…) 그 자리를 그대로 통과했다.` **본인이 제일 놀란다** — `앵커는 거는 물건이었다. (…) 뚫은 적은 없었다`. **이유 지면 0**"
    - "**전투 페널티:** 버클에서 왼손 미끄러짐 · **앵커 반 박자 지연 2회** · **조준 중 흐림 1회** · 얕은 숨 · 도는 게 느림"
    - "**은신 파훼 = 물결 읽기.** `보는 것을 그만두니까 보였다`"
    - "**★ 혜정에게 답장을 못 한다** — `고맙다고 보내면 왔다 간 걸 아는 게 되고, 왔다 간 걸 알면 집이 비어 있던 걸 아는 게 된다`"
    - "**★★ `봉지는 왔는데 말이 안 왔다`**"
  youngjin:
    - "**지하에서 화면 공유 수신**(정본 — 외출 0). `부표는 형체를 잡는 물건이 아니다`"
    - "학교에 결석 전화 — **`감기랍니다`**. `지난달에도 한 거짓말이었다. 그때는 다 거짓말이었고 오늘은 반쯤 진짜였다`"
    - "**★ 관통에 대해 대답하지 않는다** — `뚫리는 거였어?` / `……` / **`고생했다. 나와라.`** 짐작은 가능하나 말하지 않는다"
    - "**철문이 열려 있는 것을 발견하고 닫는다. 누가 안 닫았는지 알면서 안 묻는다**"
  sua:
    - "등교(`너는 학교` / `……응`). **나가면서 몇 번이나 뒤돌아봤다**"
    - "귀가 후 **닫힌 철문 앞에서 잠깐 멈춘다** — `멈춘 이유는 본인만 알았다`"
    - "표에 **2** 기입. **수열 6·5·4·3·2 완성.** **`다음 칸이 가리키는 숫자를 수아는 적지 않았다`**"

relationships:
  - "**★★★ 혜정 밀착 — 시리즈 최초.** `혜정은 줄을 안 만드는 애였다. (…) **오늘은 줄이 저절로 만들어졌다**`"
  - "**★★ 학교를 빼고 온다.** 가방 두고, 조퇴 신청 0 — **시리즈 첫 규칙 위반.** `지각을 한 적도 없는 애가 어디를 어떻게 나가는지는, 나가면서 알게 됐다`"
  - "**★★★ 승강기를 봤다.** 통로 끝 철문 → **문짝 두 개 너비의 화물용 승강기** · **표시등이 아래** → **`이 집 밑에 뭔가 있었다`**. **정체 도달 0 · 거인 0 · 기자재 0**"
  - "**★★ 문지방을 안 넘는다** — `들어가면 알 수 있을 것 같았고, 알 수 있을 것 같아서 안 들어갔다`"
  - "**아무것도 안 만지고 안 옮긴다.** 봉지를 문고리에 걸고 간다. **벨 0 · 문자 0**"
  - "**★ 본 것을 어디에도 안 꺼내기로 한다** — `두는 데를 정할 때까지는`. **EP74 직결**"
  - "예진 ◐ — 창가 줄로 넘어와 `단아가 감기라고?`. **같은 데서 걸렸다가 금방 넘어간다**"
  - "김주호 ○ — `도단아는 감기래` ×2. 두 번째는 끝이라는 뜻"

world_changes:
