    - "그 종이를 **자기 서랍**에 넣는다(수아의 표가 있는 방이 아니라) — 협의 0 · 각자의 기록"
    - "**떡볶이를 산다**(EP74 약속 이행 · 갚는다는 말 0) · **매일 약속은 안 한다** — `지킬 수 있는 것만 약속하는 사이가 됐다`"
    - "**★ 자기 방학의 모양이 안 그려진다** — 자는 것 말고는. `자고 나면 나을 것이고, 나으면 그때부터 그리면 될 것이었다`"
    - "이레째 그대로. **새 증상 0**"
  sua:
