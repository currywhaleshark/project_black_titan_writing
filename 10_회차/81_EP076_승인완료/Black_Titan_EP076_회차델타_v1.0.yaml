  - "**혜정 ● — 떡볶이 자리에서만 명랑 복귀**(`봄부터 알던 혜정`). 헤어질 때 **명령형 복귀 「방학이라고 연락 끊지 마.」**"
  - "**예진 ●** — 3단평가 위로가 위로가 아닌 위로 · `중립은 계곡도 좋고 바다도 좋아` · 성호 흉을 `걔한테는 그게 방학이지`로 닫는다"
  - "**성호 ◐** — 방학 관측 계획 40일 · **`안 나온 것도 기록이야`** → `세는 애들은 학년이 달라도 같은 말을 했다`(수아와 무자각 공명)"
  - "김주호 ○ — `방학 잘 보내라. 개학 때 보자.` **질문을 닫는 어른의 마지막 한 줄** · 나래 ○ 공책을 가방 제일 안쪽에"

