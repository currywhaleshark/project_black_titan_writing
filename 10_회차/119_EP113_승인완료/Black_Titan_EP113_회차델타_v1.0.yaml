state_changes:
  myeongjun:
    - "**★★★★ 미군과 첫 대면** — 8/31로부터 **열사흘**"
    - "**★★ 배석을 넷에서 둘로 줄인다** — `아는 사람이 많으면 관리해야 하고` · 이유는 말 안 함"
    - "  **★ `그게 지휘관이 할 판단인지는 따로 생각하기로 했다`**"
    - "**★★★★ 「보류」가 무너진다** — `필요한 서류는 이미 양쪽에 다 있습니다`"
    - "  **`나흘 동안 아무것도 안 하면서 이걸 지키고 있다고 생각했다. 지키고 있었던 게 아니라 그냥 안 움직이고 있었던 거였다`**"
    - "**★★★ 이름 셋을 듣는다** — 도영진·도단아·도수아 · **손끝 리듬이 멈춘다**"
    - "  **★★ 이쪽 서류는 하나가 크고 둘이 작다** · **저쪽 문서에는 그 차이가 없다**"
    - "  `그 크기 차이가 지금까지 뭔가를 막고 있었는데`"
    - "**★ 「그건 아이들입니다」** → **헤일이 부정하지 않는다**(반박이 없으면 밀어붙일 자리도 없다)"
    - "**★★★★ 「공동 자산」 수신** — `사람한테 쓰는 말은 아닌 것 같은데요` → `저희 문서상 용어입니다`"
    - "  **★ 표현을 바꿔 주겠다는 제안을 거절한다** — `그러면 그냥 쓰시죠`(배려를 받으면 요구가 어려워진다)"
    - "**★★★★ 관할 문제를 정면으로 짚는다** — `이건 제 권한이 아닙니다` · `신서울에 하셔야 합니다`"
    - "  → **`했습니다`**(지난달 실무 협의 · 이달 초 문서 · 답신 미수령)"
    - "  **★★★ 확인 불가** — 이번 달 연락선은 지난주에 나갔다 · 회선 순번을 당기려면 **사유 문서가 남는다**"
    - "  → **`현장 사안은 여기서 결정되는 걸로 알고 있습니다`**"
    - "  **★★ `권한이 없다고 물러설 수가 없었다`** — 맡을 사람이 없는 자리"
    - "**★ 안 묻는 것 셋:** 자료 출처(대답 안 옴) · **하얀 것**(인정하면 문서 근거, 부정하면 반증 불가) · 다음 일정(물으면 기다린다는 뜻)"
    - "**★★★ 여론 카드의 함정 인식** — `카드를 쓰려면 말을 해야 하고, 말을 하면 카드가 없어진다`"
    - "  **`쥔 걸 못 쓰는 사람은 시간이 갈수록 약해진다`** → 그래서 저쪽이 시한을 안 건다"
    - "**★★★ 자진의 구조를 읽는다** — `그때는 그냥 자백으로 읽었다. 지금 보니 자백이 아니었다`"
    - "  **★ 목적·30년 전 관계는 여전히 0**"
    - "  **★★ `정하지 못한 걸 다행이라고 생각한 적도 있었다. 칸이 없는 게 보호가 되고 있었다`**"
    - "**★ 가야 할 이유가 생긴다** — `조서로는 안 됐다` · **결심 문장 0**"
    - "  `간다는 게 무슨 뜻인지는 오늘 밤에 생각하기로 했다`"
    - "**★★ 투덜이 안 나온다** — `우리가 하는 일은`이 올라오다 만다"
    - "  **`못 하는 걸 말로 덮으면 그다음에는 말도 안 남는다`**"
    - "**★★★ 흰 거인에 대한 분노 최초 지면화** — `언제 어떻게 만들었는지도 모를 자기들 거인을 한 번 밀어넣고는 여태껏 연락은 그게 전부였다`"
    - "**★★★★ 조의의 어긋남을 짚는다** — §setting 참조"
  marcus_hale:
    - "**★★★ 첫 등장** — 미군 연락장교 · 40 · **영관급**(정확한 계급 비공개)"
    - "정복 아님 · 회색 재킷 · 가방 하나 · **서류를 안 꺼낸다**"
    - "**★★ 외운 문장은 완벽하고 즉흥은 통역을 거친다** — 인사·조의·직함이 정확하다"
    - "**★ 이름 셋을 읽는 데 종이를 안 봤다** — 외웠다"
    - "**★★★ 협박 0 · 시한 0 · 언성 0 · 다음 일정 0**"
    - "**★ 조문 번호를 안 댄다** — `번호를 대면 이쪽이 그 번호를 들고 법무에 간다`"
    - "**★★ 무례하지 않다** — `이 사람은 이기려고 온 게 아니었다`"
    - "**★ 「글쎄다」식 회피 없음** — 모르는 건 모른다고 하고 아닌 건 아니라고 한다"
    - "  `표현을 바꾸면 내용도 바뀝니까` → **`아닙니다`**"
    - "**★★★★ 조의를 표하고, 사망자가 없다는 지적에 `알고 있습니다`라고 답하고, 고쳐 말하지 않는다**"
    - "**★ 악수한 손이 굳어 있지 않았다** — 책상에서만 일한 손은 아니다"
  yunseojin:
    - "**★ 배석 축소 지시에 이유를 안 묻는다**"
    - "**★★ 나가면서 한 번 돌아본다** — 뭘 물으려던 얼굴 · **안 물었다**"

