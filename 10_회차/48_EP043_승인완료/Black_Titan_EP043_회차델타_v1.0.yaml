canon_additions:
  - "시간: EP43 = 6/11(토)~6/13(월 밤 22:30 실루엣)"
  - "**여름 절차 재가동 정본:** 장부 대조(일상과 한 책상)·가족 공유(열린 미닫이)·공개 통지·규칙 문자·몸 만들기·조종석 예열"
  - "**혜정 반의식 정본(패턴 곡선 1단):** 통제 실무를 즉시 정리하되 이유를 자문하지 않음 / 문자 `또 시작인가 보네. 알지? 늦으면 늦는다고`"
  - "**학습된 도시 정본:** `무서워하는 법도 는다` — 소문을 절차로 소화·걱정을 오래 들고 있지 않음"
  - "관측 문법: `잔잔한 화면을 오래 보는 법 — 눈이 아니라 귀로 보는 것`"
  - "**금지어 신규 등재(첨삭 계기): `화`(작가용 회차 단위) 지면 사용 금지**"
  - "격언 계보: `낯익다는 감각은 답을 주지 않는다. 어디서 봤는지를 찾아 줄 뿐이다` / `아는 척은 봄에도 없었다` / `저 얼룩 하나하나가 봄의 영수증`"
