notes:
  - "S8 3/10 완료. 다음 **EP44 「다른 여름」(중요 화 — 첫 피격·투사체 무효).**"
  - "EP44 고정선(S8 개요): 출격·조우 → **첫 가시 사격**(이쪽을 겨냥해 쏘는 첫 동작 — 봄에 없던 것) → 첫 피격의 충격(자신감 봄 최고점에서의 첫 동요 — 균열 축) → **투사체 무효 발견**(맞는데 뚫리지 않는다 — **현상만·역장 서술 금지 유지**) → 무효인데도 무서운 이유(**의도의 공포**) → 원거리 상대에 맨손이 닿지 않는 답답함 개시 → 훅: 가시 연사 속에서 접근 각을 재는 단아(발사 간격의 리듬이 들리기 시작)"
  - "EP44 개체 잠금: **개수 흔적 = 가시 재정렬·기부 두터움·작살형 끝**(위화감 층위·해설 0). 이동함(봄의 부동과 대비). 회수 목적 잔존(도시 아닌 기체 조준)"
  - "EP44 금지: 격파(EP45 몫)·가시 조각 대조 결론(EP45)·역장 원리·`개수` 지면·새 증상"
