notes:
  - "**S9 2/12 완료.** 다음 = **EP53 「버틸 데」 — 전투(격파).** 교전이 이어진다(시간 경과 0)"
  - "EP53 격파 잠금(S9 개요 v1.5): 빈 소리를 다시 밟음 → **수아 종이의 한 줄과 겹침** → 밀리는 걸 이용해 **복개 구간 위로 유인** → **자기 발로 상판을 깬다**(좁은 접지 = 국부 하중·넓게 깔린 저것은 못 하는 일) → 폭 전체가 동시에 꺼짐 → 기울어져 드러난 **바닥 쪽 면**을 침"
  - "**대가:** 배수 시설이 무너진다 → **물이 안 빠진다**(S9~S10 생활 잔류)"
  - "⚠ **`네 덕분이야`(EP49) 반복 금지** — 수아에게 값을 치르는 방식은 EP53 브리프에서 새로 정한다"
