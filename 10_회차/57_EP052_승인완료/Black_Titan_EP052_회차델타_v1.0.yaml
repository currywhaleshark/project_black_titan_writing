  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-13"
  approval_note: "브리프 정정 5차(2목적 이행·잔재주 제거·지반 붕괴·붕괴 유도 장치·삼분법 배치) → Level 6 → 초고 → 첨삭 5건 → `그래 그러자`. **S9 2/12.** 동반: 작가용 개체 명칭 소급정정 7곳"
based_on_snapshot: "SNAP-051 v1.0"
produces_snapshot: "SNAP-052 v1.0"
changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**신규 개체 교전 개시(질량형):** 낮고 넓은 갑각 하나 — **높이는 기체 허리께인데 폭은 전조등 좌우 끝까지.** 매끄러운 곡면(이음매·돌출 0). 다리 미확인(물 아래·소리 안 남)"
      - "**행동 정본:** 때리지 않고 **대고 민다**(닿는 순간 소리가 없다). 자세가 무너지면 **앞쪽을 들어 올려 깔아뭉개려 든다** — **위에서 오는 힘은 처음**"
      - "**★ 표적 전환 확인(2목적 이행의 첫 지면 증거):** 도착 시 **수문 쪽으로 직진**하고 있었다(도시로 들어가려는 걸음). 타이탄이 막아서자 **그 자리에서 몸 전체가 돌았다** — 배가 먼저 돌고 왼쪽 끝이 먼저, 오른쪽 끝이 나중. **도는 시간이 다 보였다**"
      - "**성을 안 낸다.** 밀려도 멈추지 않고 소리도 안 낸다. 봄의 것들과 반대"
    evidence:
      scene: [3, 4]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 표적은 바뀔 수 있다:** `저건 원래 청해로 들어가려던 거였다. 내가 앞에 서니까 나로 바꾼 거다.` → **`바꿀 수 있다는 게 무서웠다`**(EP44 `저건 나를 부수려고 왔다`의 확장 — 이번엔 **오다가 바꿨다**)"
      - "**밀림의 성질:** 힘이 밀리는 게 아니라 **발이 간다.** `버티는 데는 다 버티고 있는데 발바닥이 바닥 위에서 그냥 미끄러졌다` / **`밀리는 게 아니라 실려 가는 것에 가까웠다`**"
      - "**접지의 대비:** `저것은 바닥에 붙어 있었다` ↔ `52미터짜리 몸이 발바닥 두 개로 서 있었다` → **`저건 누워 있고 나는 서 있다`**"
      - "**EP47 역상 자각:** `그때는 발이 너무 잘 박혀서 못 뺐다. 그게 힘들었는데, 지금 생각하니 박히기라도 했었다`"
      - "**세게 딛는다고 안 미끄러지지 않는다:** `세게 딛는 만큼 발바닥이 바닥을 문질렀고, 문지르니까 더 갔다`"
      - "**위에서 오는 힘은 처음이다:** `봄에도 여름에도 힘은 앞에서 왔지 위에서 온 적은 없었다. 무릎이 그걸 몰라서 한 번 접혔다`"
      - "**흘리기가 막힌다(EP48 기술의 첫 실패):** 폭이 두 배라 **흘려보낼 쪽에도 저것이 있다.** `흘릴 데가 없었다`"
      - "**잡을 데가 없다:** 등이 통째로 한 덩어리·곡면. `집게는 잡을 데가 있었다. 가시도 잡을 데가 있었다. 잡고 꺾을 수 있으면 그건 어떻게든 되는 거였다` — **3연타(인장)의 예고**"
      - "※ **자각 0로 남긴 것:** 발밑에서 난 **빈 소리**(`통을 두드리면 나는 소리 비슷했다`). `들었는데 그게 다였다` — 수아의 종이와 연결 0. **EP53 격파의 씨앗**"
    evidence:
      scene: [3, 4, 5]

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**수아의 지형 종이(출격 전):** 간척지 도면 — 얕음·단단함·뻘, 그리고 **`물 빠지는 데`**(다른 선보다 진하게 여러 번 덧그음). 출처 = **수리비 장부**(`저기 펌프 고쳐 준 적 있잖아`)"
      - "**전투용이 아니다.** `물 표 만들다가 같이 그렸어` — **용도 자각 0.** 수아는 그게 무기가 될 줄 모른다"
      - "단아는 **대충 보고 접었다.** `물이 빠지든 말든 지금 알 바 아니었다` — **EP53에서 걸리게 하는 장치**"
      - "※ **전투 교신 0** 유지(EP38 예외 보존)"
    evidence:
      scene: 2

  - category: "situational"
    field_path: "external_conditions.sea"
    operation: "advance"
    after:
      - "**개체가 방재선 안쪽으로 들어옴:** 7번 → 5번 → **간척 방조제 안쪽.** 바다에서 나와 벽 안으로 들어온 **첫 사례**(갯벌까지 나온 적은 있어도 안쪽은 처음)"
      - "**신규 전장 = 간척 방조제 안쪽 얕은 물.** 수심 **기체 무릎 아래**(역대 최저)·바닥은 갯벌이 아니라 **콘크리트 슬래브 + 물이끼**(안 빠지는 대신 **안 걸린다**)·엄폐 0·평평함·저층 구조물 몇 채(허리 높이·밟으면 부서짐)"
      - "**배수 암거(지면 미설명):** 물 빼는 수로가 격자로 깔려 있고 **일부 구간은 상판을 덮었다.** 덮인 데 아래는 빈 통로 — **EP53 격파의 지형**"
      - "**배수진 = 수문.** 기체 어깨 높이의 회색 문 두 짝. 뒤로 물길이 안쪽으로 이어짐. **부서지면 논·길·동네로 물이 간다**"
    evidence:
      scene: [1, 2, 6]

  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**설비 파손 개시:** 저층 구조물 한 채 밟아 부숨 + **바닥 슬래브 균열.** 부수려던 게 아니라 발 놓을 데가 거기밖에 없었다(`아, 미안.`)"
      - "**통제 경보 절차 정착:** 골목 스피커 세 번·쉬고·세 번 / 셔터 내리는 소리가 몇 집 건너 하나씩 / 아주머니가 애 이름 부르는 소리. **봄에 배운 순서대로 동네가 움직인다**"
      - "**밤이므로 목격 0**(사람은 다 들어감·형체 확인 0)"
    evidence:
      scene: [1, 5]

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**교전 중(미종결).** 관통 0·손상 표시 0. 자세 붕괴 다수·**두 걸음 밀림**. 무장 없음"
      - "조종석 = 기울기·어깨띠 하중·유도등 흔들림. **통증 0**"
    evidence:
      scene: [4, 6]

