canon_additions:
  - "시간: EP52 = 6/20(월) 학교~밤. 교전은 밤·미종결"
  - "**★ 작가용 개체 명칭은 지면 금지.** 등장인물은 저것들을 분류해서 부르지 않는다. **`-형`이 붙는 순간 작가용**이고, `가재`·`문어` 같은 생물 이름을 비유로 쓰는 것은 정상. **승인본 7곳 소급정정 완료**(EP9 2·EP10 4·EP48 1)"
  - "**과거 개체 지칭법:** 시기 + `괴수`(**`3월의 첫 괴수`**) / 몸의 특징(`팔 여덟 개짜리`) / 맨 지시어 / 군 문서는 `대상`·`개체`"
  - "**도시 이름 = 청해**(단아의 내면 서술에서도 그렇게 부른다)"
  - "**밀림의 어휘:** 밀리는 게 아니라 **실려 간다**. 버티는 데는 다 버티는데 발만 가는 상태"
  - "**전장 정본:** 간척 방조제 안쪽 — 무릎 아래 수심·**콘크리트 슬래브 + 물이끼**·엄폐 0·배수 암거 복개 구간(미설명)·배수진 = 수문"
  - "**질량형 개체 정본:** 때리지 않고 대고 민다 → 앞을 들어 올려 깔아뭉갠다. **기교 0.** 성을 안 낸다"
  - "격언 계보: `준비하는 날과 나가는 날이 붙어 있으면, 준비한 것 같지가 않다` / `바꿀 수 있다는 게 무서웠다` / `저건 누워 있고 나는 서 있다` / `알면서도 말해야 하는 게 있다` / `그냥 계속 왔다. 그게 더 나빴다`"
