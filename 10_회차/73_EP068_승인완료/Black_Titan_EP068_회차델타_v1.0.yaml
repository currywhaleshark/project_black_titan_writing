state_changes:
  dana:
    - "**★★ 처음으로 놓쳤다.** 무리에 덮여 시야가 지워진 사이 한 마리가 도시 쪽으로 빠졌다. **단아가 발견한 게 아니라 학교에서 공지가 왔다**"
    - "**★★ 해결 동작이 사각을 만들었다.** 수문 기둥에 **등을 대고 문질러** 한꺼번에 떨어뜨렸고, **그동안 앞쪽만 봤다.** 실수가 아니라 **방법의 값**"
    - "**★ 안 보이는 게 맞는 것보다 무서웠다.** 밀리지도 않고 얹혀 있는 상태 · **장갑을 갉아 대는 소리** · `손이 어디로 가야 할지 몰라서 멈춘 몇 초가 오늘 제일 길었다`"
    - "**★ 도약체 대응법을 오늘 배웠다** — `뛰는 것들은 뛰기 전에 반드시 웅크린다`. **앵커가 착지점을 먼저 친다**(EP44 계보)"
    - "**★★ 멈춘 걸 한 번 더 쳤다.** 알면서 쳤다 — §1-I 호승심과 다른 층위의 감정"
    - "**★ 영진의 사면이 사면으로 안 들렸다.** `위로를 받을 만한 일을 한 기억이 없었다`"
    - "**★★ `아무도 모른다는 건, 다음에도 모른다는 뜻이었다`**"
    - "**★ 저녁 통화를 못 걸었다.** 숨겨야 하는 건 **화장실 간다고 나가서 안 돌아온 것**. `끊기지 않은 건 저쪽이 걸었기 때문이었다`"
    - "몸살 **증상 0**"
  youngjin:
    - "**★ 부표를 문자 두 자로 알렸다** — `부표`. 몇 번인지도 어디인지도 없다(**바로 아래로 내려갔다는 뜻**)"
    - "**복개 구간을 확인했다.** `저기는 화면에 안 잡힌다` · 회색 띠를 손가락으로 한 번 따라 그었다"
    - "`몇 마리였어?` / **`모른다.`** — 절차만 말한다. **위로·격려 0**"
  sua:
    - "**★★ 세려고 했는데 못 셌다.** 두 번째부터 겹쳤다. **말은 하지 않았다**(전투 교신 0 유지)"
    - "**간격 칸에 4를 적었다.** EP67에서 못 적은 칸이다 — `한 획이었다`"
    - "**★ 그 밑이 또 비었고, 이번에는 연필을 대지도 않았다**"
    - "**★★ `오늘 못 센 게 하나 더 있었다. 그건 표에 적을 칸이 없었다`**"

world_changes:
  - "**톡토기형 다수 격파**(간척지 유수지 · 수요일 오후). **개체 수 미상 · 끝까지 안 준다**"
  - "**★★ 별동 1개체가 복개 수로로 빠져 학교에 도달** — 부표·화면 어디에도 안 걸림"
  - "**★★ 청해남초 파손** — **체육관 지붕** 한쪽 함몰 + **본관 4층 6학년 교실**(창벽·사물함 26칸·전자칠판). **운동장 파임**"
  - "**인명 피해 0.** 하교 조치 완료 상태였다 — **운이었다**"
  - "유수지 **수문 구조물 1기 파손**(등을 문지르면서)"
  - "간격 수열 = 6 → 5 → **4**"

canon_changes:
  - "**★ 부표 통보 경로 확립** — 학교 중 부표가 걸리면 **영진이 문자로 두 자를 보낸다.** 부표 자체는 가게에서 소리로 울린다(EP59)"
  - "**★ 경보 선후는 지형이 정한다** — 항 근처면 목격이 빠르고(EP64), 방조제 안쪽이면 **부표가 먼저**(EP68)"
  - "**★★ 복개 수로 = 관측 사각.** 유수지에서 시내 초입까지. **화면상 회색 띠**"
  - "**교신 표기 = 큰따옴표**(겹낫표 금지 · 검사 등재)"
  - "**척도 규칙** — 52미터 기준을 사람 기준으로 되돌리지 않는다"
  - "**청해남초 = 본관 4층에 6학년 교실**"

foreshadow:
