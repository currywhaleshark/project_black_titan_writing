    note: "신규 등재 — 장갑 균열 이음매의 `덜 닦인` 검붉음(영진만 목격, 걸레 소각). 표면: 정비 중 얼룩/체액 잔여. 진실: 생체 순환액. 서술은 무심함만 — 출처 암시 어휘 금지 유지. 다음 직접 진전: 후반 봄"
