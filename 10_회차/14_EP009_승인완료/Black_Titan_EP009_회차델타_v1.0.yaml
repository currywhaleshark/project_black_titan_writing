  - id: "B1-HYEJEONG-CONCERN"
    operation: "NO_CHANGE"
  - id: "FS-001-DANA-VISION"
    operation: "NO_CHANGE"
    note: "전투 후 피로는 통상 수위, 신경 신호 0"
  - id: "FS-004-PIERCING-FEAR"
    operation: "NO_CHANGE"
    note: "문구·상상 재사용 0 확인"

