      - "비대칭 유지: 성호는 단아의 정체·인과 모름(가방 사건도 음험함으로만 해석), 단아의 죄책감은 행동으로만 존재"
    evidence:
      scene: [3, 5]

  - category: "emotional"
    field_path: "characters.dana.state"
    operation: "advance"
    after:
      - "**영웅관 전환 완성: `이기면 된다` → `누가 안 다쳤는지 끝까지 세는 것까지가 싸움`**(셈에서 빠진 항의 자각)"
      - "새 시간표의 첫 줄(비공개): 싸움 전에 대피계단부터 — 다음 싸움의 사전 셈 결심"
      - "이름의 무게 처리: 잠 설침 → 교실 복귀로 완화(`구분이 안 가는 채로, 나쁘지 않았다`)"
      - "오독 형성: `더 조심하면 모두 지킬 수 있을 수 있음`(개요 잠금 — 여름 반증 예정)"
    evidence:
      scene: [1, 3, 4, 5]

  - category: "informational"
    field_path: "characters.seongho.state"
    operation: "advance"
    after:
      - "**깁스·목발 등교(전치 몇 주·염좌+인대).** 영웅-대가 병렬 첫 발화: `그래도 우리를 지켰다`(발표체가 깨지는 반 박자)"
      - "깁스 첫 줄 발표 예고(미정 — 소품 창구), 마지막 주자 결정전 소급 의심(당시 쿨함 자기 전복)"
    evidence:
      scene: [2, 3, 5]

  - category: "relational"
    field_path: "relations.dana_hyejeong"
    operation: "advance"
    after:
      - "창백함 지적(추궁 질문들의 줄을 전부 지나침) + **재편성표에 두 이름 보존**(기다린다는 대답)"
      - "단아의 자각: 갚아야 할 목록이 길어지는 감각(갚는 법은 모름 — 여름 창구)"
    evidence:
      scene: 4

  - category: "living_condition"
    field_path: "living_conditions.school"
    operation: "advance"
    after:
      - "일상 복귀(5/2 월). 성호 자리 재배치(뒷문 쪽·목발 반경), 체육대회 재편성표 게시(계주 명단 보존 — 날짜 미정 = 대기)"
      - "소문 신화 4차 갱신(끌려갔다 이긴 검은 거인 — 거리 인플레), 라디오 `수거물 없음` 4차"
    evidence:
      scene: [1, 2, 4]

