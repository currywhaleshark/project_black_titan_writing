notes:
  - "S7 1/5 완료. 다음 **EP37 「꽃이 먼저 돈다」(중요 화 — 동시 접촉/첫 오판).**"
  - "EP37 고정선(개요 v1.2): 진입 → **크레인 꼭대기의 것이 펼쳐짐**(꽃잎 팔·떨림·일제히 눕기·중앙 원반 회전·젖은 장갑의 짧은 기름막 광택 — 탑승 전 새 탐색파 증상 0) → **한 박자 뒤 바닥 전체가 따라옴**(군부형 — 갑판 말아 올림·운반막으로 허리+팔 하나 덮음·절단 0·외해로 끌기) → **오판: `저 납작한 걸 뒤집으면 끝이야`**(눈앞의 것 = 주력 판단 — 이음매 두들겨 1회 탈출·넓은 몸에만 집중) → **첫 재지정**(방향 바꾸자 꽃이 다시 돌고·광택·지연 선회 — `꽃→광택→늦은 선회` 순서 첫 제시) → B2: 역할별 위치 기록·부두/항로 소개만"
  - "EP37 훅(개요): **크레인 기둥 뒤로 숨는 순간 군부형이 멈칫 — 높은 꽃은 다시 펼쳐지지만 중앙 원반과 기체 사이에 굵은 철골이 걸려 있다**(시야선 단서 1호)"
  - "EP37 금지(개요): 두 개체 = 공격·살해 기능 0(바다나리형 광선·투사체·찌르기·촉수 0), 탑승 중 탐색파 공명 증상 0, 수아 조언 0, 앵커·군 마무리·학교 피해 0. 계통·상쇄 이유 비공개"
