  - "**깁스 첫 줄 정본:** `다 나으면 도단아부터 이긴다`(다친 첫날 자필 — 한 달 매달고 다님)"
  - "**규칙 3호(씨앗):** 끝나면 끝났다고 보내기 — 혜정의 세 자리 체계(연락·건강·귀환)"
  - "기록: 단아 티볼 합계 54(최고 22미터)·성호 40+1타석 이월"
  - "영진 어록: `기다리는 쪽이 유리하다. 조급한 쪽이 진다`(공 치는 건 다 비슷하다)"
