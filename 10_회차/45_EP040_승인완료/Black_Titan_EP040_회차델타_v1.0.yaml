    after:
      - "**규칙 3호 실전 완결:** `끝났어` 발신 → 필기 석 장 + `아까 보니까 니 공책 반이 백지더라. 보고 베껴 놔. 내일 보자. 성호가 내일 기어코 마지막 한 판 한대`(어디였는지 0)"
      - "**신규 정본: 혜정 = 단아 짝(옆자리).** `옆자리는 못 속이는 자리` — 낮에 보고 그 자리에선 말 안 하고 밤에 챙기는 문법"
      - "**세 자리 완성:** 늦으면 늦는다고·아프면 아프다고·끝나면 끝났다고 — 봄 감정선 완결(컵볶이 지불 포함)"
    evidence:
      scene: [3, 5]

  - category: "relational"
    field_path: "relations.dana_seongho"
    operation: "resolve"
    after:
      - "**재대결 종결: 54 대 54 동점**(성호 마지막 타 14미터 — 줄자 3회 확정). `재대결의 재대결` 예약(+성호의 달리기 추가 요구 — `다 낫고 나서 말해`)"
      - "**쌍방 앙숙 기본값 완전 복귀**(`봄에 부러졌던 것들이 다 붙은 운동장`)"
    evidence:
      scene: 4

  - category: "physical"
    field_path: "characters.dana.physical"
    operation: "advance"
    after:
      - "**C1 봄 증상선 확정:** 전투 후 피곤(근육·숨 층위)·열 손가락 정상·악력/보행/시야 정상 — **저림 재발 0.** 영진 기록 `이상 없음`+여백(후보 열어 둠·확정 진단 0)"
    evidence:
      scene: 3

  - category: "informational"
    field_path: "characters.myeongjun.knowledge"
    operation: "advance"
    after:
      - "봄 결산 보고: 순차 행동기록(높은 것 먼저·낮은 것 한 박자 뒤 — 관측 기간 일관) 확보. 정체·발원지·조종 주체 미확인. `미식별 검은 거인`만 사용. 민간 복귀·안전점검 우선"
    evidence:
      scene: 3

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "무손상 귀환·격납고 대기. 봄 시즌 전적: 7전 6승 1자발퇴각(작가용 셈 — 지면은 `다섯 번 부수고 두 번 멎게 함` 결)"
    evidence:
      scene: [2, 3]

