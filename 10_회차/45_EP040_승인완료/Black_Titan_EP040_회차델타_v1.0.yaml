canon_additions:
  - "시간: EP40 = 5/17 화 밤(결착) → 5/18 수(학교·컵볶이) → 수요일 밤(장부 덮음). **봄 시즌 종료**"
  - "**혜정 = 단아 짝(옆자리) 정본**(사용자 — 낮에 보고 밤에 챙기는 짝 문법)"
  - "**결착 2호 정본:** 주기 관찰→손가락→배지기→양방향 벌리기(격언: `저 틈은 저놈이 직접 벌려 준다`)"
  - "**동점 정본: 54 대 54**(성호 마지막 타 14미터·줄자 3회). 미지불: 재대결의 재대결(+달리기)"
  - "**시즌 1 엔딩 정본(사용자):** 적 예고 없이 마감 — 장부 한 권(3월 말~5/18)·`내일 적어도 되는 날짜`·`봄이 그렇게 끝났다`"
  - "**여름 = 미정(사용자):** 개요의 초여름 훅·속도형·아이언 앵커·재분류 확정 = 전부 보류함(여름 기획 게이트에서 재결정)"
  - "격언 계보: `옆자리는 못 속이는 자리` / `화낼 데가 없으면 화가 웃음이 된다` / `잔잔한 그래프를 잔잔하다고 믿기까지`"
