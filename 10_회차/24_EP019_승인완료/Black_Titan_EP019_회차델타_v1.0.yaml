      - "종목 기록: 피구 반 대항(단아·성호 같은 팀 — 아웃 동점), **장애물경주는 학년 혼합 조 편성**(사용자 정정 — 뜀틀·그물·징검다리·직선 4구간, 조원 구간 선택제)"
      - "대피 개시 — 훈련 문장이 실전 속도로, 학년별 줄, 3학년 선발 이동"
    evidence:
      scene: [1, 2, 3, 5]

  - category: "relational"
    field_path: "relations.dana_seongho"
    operation: "advance"
    after:
      - "**앙숙 리듬 완전 복구 + 닮은꼴 전시:** 손가락 개수 경쟁, 튕긴 공 귀속 시비, `그건 작전이고 내 건 관종이고?`/`어. 정확해.`"
      - "**거울 챙김 장전(S4 핵심 밑돌):** 성호 = 그물 구간 무언 자원(요란한 완수로 은폐) / 단아 = 두 구간 대타(반 박자 사이 자원). 서로만 알아보고 서로에게만 시비"
      - "계주 승부 3차 유예(동점→계주 이월→사이렌 불발) — EP24 `깁스 풀리면` 예약의 연료"
      - "우진 `둘이 사귀냐` → 동시 `안 사귀거든!`(비연애 경계 소화 장치)"
    evidence:
      scene: [2, 3, 4]

  - category: "informational"
    field_path: "characters.hangyeol.state"
    operation: "open"
    after:
      - "**강한결 첫 지면 등장(EP6 언급 후 13화 만):** 본부석 기록 담당 — 아웃 집계표를 짚어 시비 종결(`동점.` 한 단어), 다시 셀 수 없게 만든 표, 조 편성표 줄 긋기 행정"
      - "확립된 기능: 말 대신 종이로 정리하는 반장(열 걸음과 한 단어)"
    evidence:
      scene: [2, 3]

  - category: "threat"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**해안 대피 사이렌 발령**(계주 출발 직전) + **배수로 역류**(바다→학교 방향, `방향이 틀린 물`) — 개체 형체 미노출"
      - "작가용: 문어형 접근 — 침수구역 진입 전조. 학교·타이탄 위치 미특정 상태 유지"
    evidence:
      scene: 5

  - category: "emotional"
    field_path: "characters.dana.state"
    operation: "merge"
    after:
      - "**시계를 보지 않은 하루** — 시각 숫자가 지면에 없는 화(EP13 반전). `방학 같기도 하고, 다른 아이들의 매일 같기도` 한 하루의 정서적 높이 확보"
      - "훅에서 셈 전환 — 대피 행렬·수리점 길·빠질 모퉁이(`이 셈을 시작하는 순간 방학 같던 하루는 끝나 있었다`)"
    evidence:
      scene: [4, 5]

  - category: "relational"
    field_path: "relations.dana_hyejeong"
    operation: "merge"
    after:
      - "렌즈 1문항 + **명단의 대답**(이름을 지우지도 옮기지도 않음), 결승 전 물통(`이겨` — 명령형의 온기), 반 남긴 물"
    evidence:
      scene: [1, 4]

