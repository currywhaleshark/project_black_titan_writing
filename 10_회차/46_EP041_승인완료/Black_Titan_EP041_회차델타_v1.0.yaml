canon_additions:
  - "시간: EP41 = 6/6(월) 재검·가족 저녁 → 6/7(화) 수금·새 장부. **여름 시즌 개시**"
  - "**재검 기원 정본(첨삭 확정):** EP18 「도수」 = 4월(1월 아님) — 재검 대기 2개월"
  - "**기후·복장 정본 집행 개시:** 온난화 세계·6월 = 한여름(`초여름` = 과거 대비 인용만 허용)·초등 사복. 격언: `여름은 오고 싶을 때 와서 갈 생각을 안 했다`"
  - "**발표회 정본:** 금요일·수아+하랑 한 곡 반씩. **수박 = 발표회 날 구매(만장일치 — 신규 소약속)**"
  - "**주호 수위 집행 1호:** 미리 적힌 조퇴 확인서(무언)"
  - "여름 장부 정본: 매조지 후 개시(6/7)·첫 기록 = `이상 없음`"
  - "격언 계보: `걱정의 크기와 결말의 길이는 비례하지 않았다` / `결과를 이미 아는 사람의 몫은 그릇을 채워 주는 것` / `계획은 세울 때가 제일 맛있었다`"
