  - "EP42 고정선(S8 개요): **하랑 바이올린 발표(● — 앵커 필수·간격 16)** — 수아와 한 곡 반씩(EP41 정본). 관객석 가족+친구들·수박 약속 지불. 동그라미(가방 2호) 회수 배치. 성호 재활 진전 지속"
  - "EP42 훅(개요): 외해 관측 — **낯익은 결의 신호 하나**(영진, 옛 기록을 꺼내 대조 시작 — 명언 0. 성게형 재래 예고)"
  - "EP42 금지: 위협 실체 노출 0(신호 층위만), 새 증상 0, 수아 발표 = 사림 결(뾰족함 0·잘하고 싶음의 온도)"
