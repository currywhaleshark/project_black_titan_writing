notes:
  - "S7 2/5 완료. 다음 **EP38 「꽃이 눈이야」(중요 화 — 협동 압박/수아의 단 한 번 관찰).**"
  - "**⚠ EP38 시간대 충돌(브리프 결정 필요):** EP37 = 화요일 저녁~밤 확정인데 EP38 B1 개요 = 학교 재난방송·귀가 준비(주간 전제). EP38 = 시간 경과 0 진입이라 학교 장면 성립 불가 → 브리프에서 B1 처리 방안 결정(예: 혜정·예진 생활 층위 재배치 vs 개요 이탈 승인)"
  - "EP38 고정선(개요 v1.3): 힘 분산(흡착발·중첩 갑판)·**잘못 고른 방패**(폐건물 = 낮은 각도만 차폐 — 꽃에게는 상체 노출·광택 스침 → 군부형 정면 돌파〔부수 피해 — 공격 기능 아님〕·재포박) → **진짜 차폐**(기둥+창고 벽 겹친 각도 — 원반까지 가려진 순간만 멈칫) → **수아 문면: `언니, 큰 건 눈이 없어. 꽃이 눈이야.`**(처음이자 마지막 개입 — 이후 위치·시야·타이밍 지시 0) → 단아 재해석(`본다→간다` 회로 단절로 목표 전환 — 구조물·각도 선택은 단아) → 훅: 크레인 기초 일직선 이동·꽃도 따라 돎·군부형 방향 못 받고 납작하게 멈춤"
  - "EP38 금지(개요): 수아 발언 = 역할관계 한 문장뿐(적합성·원격감각 증명 0), 군부형 돌파 = 새 공격기관 아님, 혜정 두 번째 메시지 전송 0"
