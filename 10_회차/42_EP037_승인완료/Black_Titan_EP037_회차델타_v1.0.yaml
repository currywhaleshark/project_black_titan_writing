canon_additions:
  - "시간: EP37 = 5/17 화 저녁~밤(접촉 개시 — **전투 미종결 클리프행어. EP38 = 시간 경과 0 진입, 위기 지속 3호**)"
  - "**개화 정본:** 잔떨림→일제 눕기→원반 회전. 원반 = 기체 이동 추적(걸음 시험 확인). 팔 끝 잔떨림 상시"
  - "**군부형 접촉 정본:** 이불 덮이는 감각(무겁기만 함·아프지 않음), 이음매 골 = 유일한 공략점(우그러지기만 — 아래 장이 받침), 끝자락 = 잡으면 접히기만"
  - "**단아 지칭 정본:** 위 = `꽃`·`위엣 놈` / 아래 = `넓은 놈`·`납작한 놈`(명명 아닌 생활 지칭)"
  - "혜정 문면: `어. 뭘 보내야 되는지는 알지`(규칙 3호 수신 측 정착)"
  - "격언 계보: `세는 동안에는 겁이 앉을 자리가 없다`(다섯 번 사이에 배운 것)"
