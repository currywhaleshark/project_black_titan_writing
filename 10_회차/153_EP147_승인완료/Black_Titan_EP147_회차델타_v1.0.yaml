note: >
  EP146 직후. 현서가 EP145 약속(`수아는 저녁에 데려다 드릴게요`)대로 수아를 집에 데려다준다.
  차 안에서 수아가 처음으로 다리 얘기를 먼저 꺼내고, 두 달 동안 혼자 들고 있던 순서를 처음 입 밖에 낸다.
  현서가 갓길에 차를 세우고 순서를 뒤집는다. 면역거부 0(G0-030) · 센티널 정체 0(EP153) · 청자고둥 계보 0.

reveal_to_characters:
  - "**수아가 믿어 온 순서(처음 지면화 · EP106 `자기가 안다고 생각했다` 회수)** — 그날 뒤에서 들어온 게 수아 몸을 지나갔다 · 자국 없이 안쪽을 끊었다(사진에 안 찍히는 데) → **수아가 다쳐서 타이탄이 섰다** → 그날 뒤로 셋이 다 다른 데 · `수아가 다친 게 먼저였다`"
  - "**수아가 처음 입 밖에 낸다** — `뒤에서 들어온 게 저를 지나갔어요. 그래서 제가 다쳐서 타이탄이 선 거죠?`"
  - "**현서 ① `그날 뒤에서 찔린 건 네 몸이 아니야. 타이탄이야. 타이탄이 허리를 찔렸어.`** · 그 괴수는 약해진 척하고 네가 돌아서는 걸 기다렸다 · 숨겨 뒀던 걸 길게 찔러 넣었다 · 허리 뒤로 들어가 배 앞으로"
  - "수아 받기 — 등에서 배로 · 방향이 같다 · **배에 있던 건 진짜였다. 타이탄 배였다. 그래서 만져도 없었다**"
  - "**현서 ② 같은 데서 나와서 타면 이어진다**(네가 움직이면 타이탄이 움직이고, 타이탄이 다치면 너도 아프다) · **그날은 아주 깊었다** · 수아 `처음부터 잘 맞았어요. 아무것도 안 고쳤는데.` → `타이탄은 너한테 따로 맞출 게 없었어. 그래서 잘 탔고, 그만큼 깊이 이어졌어.`(6-7 정본 · 자연스럽게 받아들여졌지만)"
  - "**현서 ③ 타이탄이 다친 자리가 네 몸에 그대로 옮겨 왔다 · 허리에서 다리로 가는 신경 = 다리한테 움직이라는 말을 전하는 길** · 수아 받기 = EP106 `세우라는 말이 무릎까지 안 갔다` → 가는 길이 끊어져 있었다"
  - "**현서 ④ `검사에서 안 나오는 건 그래서야. 네 몸에는 찔린 자리가 없으니까. 네 몸이 먼저 다친 게 아니야.`** → **수아 때문이 아니었다**"
  - "`…나아요?` → **`…모르겠어. 이렇게 된 사람은 너밖에 없어서, 어떻게 되는지 본 사람이 없어.`**(끊지 않고 한 번에) · 재활 목표(휠체어) 0"
  - "**`언니도 알아요?` → `아니. 너한테 먼저 말하는 거야.` / `언니한테 말해도 돼요?` → `네가 정해.`**"

