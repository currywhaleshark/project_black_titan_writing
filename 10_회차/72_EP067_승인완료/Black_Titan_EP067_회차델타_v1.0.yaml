state_changes:
  dana:
    - "**열이 내렸다. 증상 0.** `이틀 자고 나으면 감기다` — **여름감기 정리가 완성됐다.** 지나가면 없던 일이 된다"
    - "**★ 성호의 날짜 낭독을 듣는다.** 4월 27일·5월 12일·5월 15일·6월 23일·지난 토요일. **다 아는 날이고, 그날 어디에 서 있었는지까지 안다.** `그걸 아는 사람이 이 교실에 자기 하나뿐`"
    - "**★ 방학 계획을 대답하지 못한다.** 언제 비는지를 모른다 — `아는 건 언젠가 또 나온다는 것뿐`. **`그때 가 봐야 알지`**(아침에 성호가 한 말)"
    - "**★★ 혜정의 사진을 받는다.** 문자 목록 · 글자 0 · **토요일 칸이 비어 있다.** 밑에 한 줄 — **`이번 주는 계속 오늘처럼 통화하자`**"
    - "**★★ `알았어` 넉 자를 보낸다.** 미안하다도 그럴게도 지웠다. **지키지 못할 것을 알면서 보냈다** — EP69로 가는 빚"
    - "**계획표의 동그라미가 비어 있다.** `앞으로 뭘 할지 몰랐다. 뭘 하게 될지는 알았다`"
    - "**들킨 줄은 모른다.** 혜정의 늦은 웃음도 `아니다`도 그냥 넘어갔다"
  sua:
    - "**★★ 세지 않고 아는 것을 처음 봤다**(하랑의 발). `빈 데에도 박자가 있다`"
    - "**★ 간격 칸 다음 줄을 적지 않았다.** 알 것 같은데 안 적었다 — **안 일어난 걸 적으면 기록이 아니라 예보다.** 눌린 자국만 남았다"
    - "봄 것 옮겨 적기 계속 — 시각 빈칸 **열몇 줄.** `봄의 빈칸은 안 적은 것이고 방금 그 칸은 안 적기로 한 것인데, 종이 위에서는 둘 다 똑같이 하얬다`"
    - "**전투 교신 0 유지**"
  youngjin:
    - "**해안도로 복구의 값.** 입찰 · 공기 · 예산. `싸게 잘하면 좋고, 싸게만 하면 이 년 뒤에 또 한다`"
    - "**방파제 예산이 도로로 갈 수 있다** — `미뤄지겠지`. **누가 나쁘다는 말은 0**"
    - "왼팔 결손 준수(국그릇 한 손) · 화계 5종 준수"

relationships:
  - "**★★ 혜정 — 인지 개시.** 성호가 `지난 토요일`을 말할 때 **웃는 게 반 박자 늦었다.** 쉬는 시간에 **어디·왜는 안 묻고**(EP33 정본) 잔소리로 대신했다. **`너 요즘—` 하다가 `아니다`**"
  - "**★ 확신이 아니라 서운함이다.** 혜정은 결론을 내지 않았고 낼 생각도 없다. **§1-E의 비난 쪽이 아니다**"
  - "**★ 김주호(담임) — 안 묻는 어른.** 조퇴 건에 **몸은 괜찮으냐고만** 묻고 넘어갔다. `왜 조퇴했는지는 봄부터 한 번도 물은 적이 없었다`"
  - "**성호 = 라이벌 리듬 복원.** 「안 갔으면 못 보지」 / **「도릴라 너 진짜」**. 돌아섰다가 **얻을 게 없다는 걸 알고 도로 돌아갔다**"
  - "**★ 하랑 ●(간격 24 회수).** 봄에는 쉼표를 못 셌는데 **자기도 모르게 터득했다.** `밟으면 알지` · **`배웠다는 것도 몰랐다`**"
  - "**★ 장우진 ●(간격 42 회수).** 큰 손짓 · 후드 주머니. **시늉이 볼 때마다 커진다**"
  - "예진 ◐ — **길이가 완충**(안 낸 사람 설명)"

canon_changes:
  - "**★ 담임 배치 확정 — 단아네 = 김주호 · 수아네 = 임유정**(사용자 확정 2026-08-16)"
  - "**★ 문재호·배유림은 둘 다 3학년**(수아네). 단아 반 조연 = 장우진·최나래·혜정·예진·성호·한결"
  - "**★ EP57 정본 — 성호는 언덕에서 봤다.** 옥상 목격담은 **다른 애 것이고 흐지부지됐다**"
  - "**`사 분` 표기**(EP57 지면 준수)"
  - "**안전 지도 = EP36에서 제출 완료** · **떡볶이 이자 = EP41에서 종결**"
  - "**여름방학 생활계획표 신설** — 방학식(7/22) 전 제출물"

