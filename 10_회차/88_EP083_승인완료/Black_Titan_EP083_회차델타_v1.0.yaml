state_changes:
  dana:
    - "**★★ 회복 정점** — 부엌 왕복 · 접수 복귀(사흘 치 처리) · 밥 한 그릇 · **아침 확인을 다시 세기 시작**"
    - "**★★★ 정지 해제 · 복귀전 수행** — 몸이 말보다 먼저 움직임(봄의 순서가 안 멈춤) → `내가 갈게`"
    - "**★ 저격수전:** 피탄 1회(충격만 · 통증 재점화 0) · **도탄 실패 경험**(각도가 없다) · **타이밍 결착**(열리기 전에 쏴서 열릴 때 도착)"
    - "**★ 자기 방식의 재확인** — `수아라면 쟀을 것이다. (…) **자기 것으로 하는 게 맞았다**`(EP82 열등감의 조용한 반전)"
    - "**★★★ 개운함(경고 장치)** — `좋은 감각에 출처를 묻는 사람은 없었다`"
    - "**계획이 앞뒤가 맞는다** — `여름감기 같은 것이었고, 감기는 지나갔고` · `앞뒤가 맞는 계획을 세우고 자는 밤은 편했다`"
  youngjin:
    - "**★★ 정지 해제 판단** — 엿새의 데이터 + **`당분간`에는 출구가 필요했다** → 조건 **`길어지면 끊는다`**(구체 기준은 안 정함 — 정하면 출격이 늦으니까)"
    - "**★★★ 미완 추론** — `길이와 다음 날 사이에 무슨 관계가 있는 것 같기도` → **좋은 날이라 오래 안 붙듦**"
    - "`수고했다` 복귀(잘했다는 다시 아끼는 자리로) · 수건 던지는 손이 안 늦음"
  sua:
    - "**★ 자리를 내주는 쪽이 된다** — 체육복 안 입음 · 모니터 옆 점검표 · **`조심해`**(엿새 전 언니 말의 반환)"
    - "**언니의 회복을 세고 있었다**(말은 안 함) — `나아지는 걸 말로 짚으면 나아지는 게 멈출 것 같은, 근거 없는 조심성`"
    - "피탄 순간 **점검표를 구긴다**(본인 모름) · 점검 속도가 빨라짐"
    - "**★★ 서랍이 셋이 됐다** — 가벼움 · 안 남는 것 · 오늘 것. **`열면 한꺼번에 보이는 물건`**"

relationships:
  - "**혜정 ◐ — `너 목소리 돌아왔네` / `물에 만 목소리였어`.** **남이 말해 주는 회복** · **떡볶이 다음 주 예약**(거절당한 사람이 두는 여유)"
  - "**★ 수아 → 단아:** `조심하라고 해 준 덕분이다`(공을 동생에게 돌리는 언니) · 점검표에 뭔가 더 적고 안 보여 줌"
  - "이하랑 ○ — 활이 긋는 자세로 진행(반 줄) · 성호 ○ 언덕(간헐)"

