state_changes:
  dana:
    - "**★★ 출격일 완전 회복** — 팔이 끝까지 올라감(나흘 만). 아침 확인은 여전히 **아무 데도 안 적는다**"
    - "**★★ 오독의 근거가 구체적이다** — 비대칭 집게 = **뻘밭에서 부러뜨렸던 것.** 그래서 **아는 상대**로 읽는다"
    - "**★ 첫 교전 정상 수행** — 간격 파악 · 결속 해제·사출·점화 · 명중 → **그런데 안 밀린다**(`안 밀리려면 어디를 붙잡고 있어야 한다`)"
    - "**★★★ 인식 신설 — 둘이 붙어 있다** — 여태는 하나가 변한 것이었다. **바다 생물 모방이 기본**이고 거기서 뭐 하나가 커지거나 두꺼워졌다. 이건 위와 아래가 다르다(「합성」 지면 0)"
    - "**★★★ 구조적 약점 노출** — 감기면 **잠금 장치가 눌려 결속 해제가 안 된다.** 앵커는 순서대로 하는 물건이라 첫 단계가 막히면 끝. **EP91 사슬도 팔이 있어야 돌린다**"
    - "**★★★ 집게 유도 2단(승리 방식):** ① 몸을 반 뼘 틀어 **제 집게로 제 몸통을 치게** 함 → 반 바퀴만 헐거워짐 → **`아직이다`** ② 가슴 타격을 **머리로 눌러** 감은 몸통을 찌르게 함 — **자기도 모르게 나온 자세**"
    - "**★ 마무리** — 왼팔이 나온 만큼 사출. 위아래 이어진 자리에 **로켓이 계속 타며 깊이 파고듦** · 되감기가 **안의 것들을 헤집고 당김**"
    - "**★★ 귀환 후 개운함**(EP83 계보) — 무섭던 것을 풀었고 방법을 찾아냈다"
    - "**★★★ 다음 날(8/25) 하강** — 일어나 앉는 데 **순서 필요**(팔월 초 순서를 이 주 만에 몸이 기억) · 걸음 사이가 길어짐 · 다리 반응 지연"
    - "**★★★ 설명 후보 전량 부재** — 무리 0 · 큰 피격 0 · 장시간 0. **`잘 싸운 날 나빠지면 잘 싸운 게 아무 상관이 없다는 뜻이 된다`**"
    - "**★★ 곡선의 확정** — 이기고 지고, 잘하고 못하고와 **무관.** 탄 날이 있으면 그다음이 있다"
    - "**★★★ 본인 결론: 나가지 않는 것밖에 없다** — **그런데 그건 이미 해 봤고, 알고 나서도 나갔다**"
    - "**★ 8/31에 동그라미** — 일곱 밤이면 낫겠지 → **EP86 실수의 재연**(`될 수도 있다는 건 안 될 수도 있다는 뜻이었다`)"
  sua:
    - "**★ 레이더 판독** — 이번엔 **점 하나.** 크기까지만 나오고 모양은 안 나온다"
    - "**★★ 관측 표가 현실을 못 담는다** — 정체 칸 하나에 둘. `두 줄로 쓰면 두 마리가 돼` → 슬래시 + **`큰 집게 / 뱀 같은 거`**"
    - "**★ 칸을 그은 사람은 하나가 하나로 오는 것만 봤다**"
    - "**★ 단아는 아무렴 어떤가 싶다** — 같은 장면이 두 사람에게 다른 무게(기록하는 쪽만 걸린다)"
    - "**★ 조심 지속** — 여전히 말이 적다(가시 3 후유)"
  yeongjin:
    - "**★ 깎은 부품 장착** — 들어가긴 하는데 원래 것처럼 딱 붙지는 않는다"
    - "**★ 물어봐야 대답이 정해져 있는 질문은 요즘 안 한다**"
    - "**★ 점검 판정** — `안쪽까지는 안 갔다` · 접힌 자리는 **기계로 편다**(부품이 안 드는 게 요즘 제일 좋은 소식)"

world_changes:
