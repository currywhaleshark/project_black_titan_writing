canon_additions:
  - "시간: EP58 = 6/27(월) 등교~밤. EP57(6/24 금)에서 **주말이 낀다**"
  - "**★ 앵커 리그 조작계(BT-01A v0.3):** 조종간 스위치 셋 — 잠금/사출/되감기. **각도도 세기도 없다**"
  - "**★ 장착은 공사다:** 천장 크레인 + 체인블록, **두 시간**. 밖에서는 안 푼다"
  - "**★ 격납고 천장 크레인의 지면 사용(LOC-02 v0.2 §2.2-C):** 정비 용도 허용 · **반입구 위 운용 0**"
  - "**★ 2단 발사 서술 규격:** `푸슉` → 정적 → 불 + 가속. 원리 설명 0"
  - "**★ 수아 4금:** 잘난척 · 남 탓 · 변명 · 말 끊기. 계산이 맞았는데 결과가 안 나와도 **자기 쪽부터 본다**"
  - "**팔 훈련 계보 정정:** EP50(**6/18 밤**) 시작 — 봄이 아니다. EP58까지 **아흐레**"
  - "**도구:** `check_translationese` F-5가 `표적`을 오탐 → 어간 제외로 수정, 승인 57화 회귀 PASS"
  - "격언: `일어나는 게 인사가 아니라 시작이었다` / `익숙해지면, 이라는 말은 아직 안 익숙하다는 뜻이었다` / `잠그고, 쏘고, 감는다. 그게 다였다` / `던진 건 나가면서 느려진다 … 이건 반대였다` / `힘이 문제였으면 차라리 나았다` / `고쳐 주려면 진짜를 말해야 하고, 진짜는 말할 수 있는 게 아니다` / `틀렸으면 고치면 되는데 맞았는데 안 되면 고칠 데가 없다`"
