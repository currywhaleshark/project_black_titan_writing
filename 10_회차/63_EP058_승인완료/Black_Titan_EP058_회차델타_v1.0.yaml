notes:
  - "**S9 8/11 완료.** 다음 = **EP59 「보이지 않는다」 — 그 내일에 등각류형이 온다**"
  - "**EP59 잠금 예고:** 미완성을 들고 나간다 → 트인 데에서 못 잡는다 → **저것이 싸워 주지 않고 도시 쪽으로 간다** → **궁지에서 끊는다**(퇴각 0). EP60이 같은 교전을 이어받는다"
  - "**미수령 잔여:** 수아 공책 · 서랍 사진 · **성호 100미터**(3차 청구까지 미결) · 가위값 · 앵커의 씨앗"
