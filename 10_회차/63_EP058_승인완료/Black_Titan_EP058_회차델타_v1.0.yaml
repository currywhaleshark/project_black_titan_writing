schema_version: 2
chapter: 58
approval:
  status: "GATE_D_PASS"
  approved_by_user: true
  approved_at: "2026-08-14"
  approval_note: "브리프 v0.4 → Level 6 v1.1 → 초고 → 코멘트 6건 + 첨삭 6건 → `그래`. **S9 8/11 · 전투 0 · 명명 재독 검사 통과.**"
based_on_snapshot: "SNAP-057 v1.0"
produces_snapshot: "SNAP-058 v1.0"
changes:
  - category: "situational"
    field_path: "equipment.anchor_rig"
    operation: "create"
    after:
      - "**★ 시제품 완성(주말 사이·6/25~6/26).** 세 덩어리 — 왼팔뚝 외측 **통** / 앞에 물린 **닻**(두 갈래 갈고리 + 자루) / 등에 얹는 **등판**(커버 덮인 감개). 사슬이 통에서 나와 어깨 위를 지나 등판으로. 형상 정본 = **BT-01A v0.3**"
      - "**마감:** 도장 없음·표면 거칢·용접 자국 그대로. 기체는 검은데 이건 회색. **손으로 만든 티가 난다**"
      - "**★ 조작 = 조종간 스위치 셋** — 잠금 / 사출 / 되감기. **각도 조절도 세기 조절도 없다.** 통 옆 레버는 정비용 수동 잠금"
      - "**★ 2단 발사:** `푸슉`(맥 빠지는 소리·반동 거의 없음) → **정적**(떨어지는 것처럼 보인다) → **불이 붙고 나가면서 빨라진다**"
      - "**★ 몸이 달라진다:** 등 위쪽이 뒤로 당기고 왼팔이 처진다. 왼팔이 **반 박자 늦게** 나가고 팔꿈치가 끝까지 안 굽는다. 사슬이 늘 늘어져 걸을 때 소리가 난다"
      - "**★ 장착은 공사다:** 천장 크레인 + 체인블록 + 발판, **두 시간**. **밖에서는 안 푼다** — 현장은 감고 물리고 잠그는 데까지"
      - "**회수:** 안 걸리면 감아야 하고, 감는 동안 **그 팔을 못 쓴다**"
      - "**이름 없음.** 지면 지칭 = `그것`·`닻`·`사슬`·`통`·`등판`. 명명은 EP61"
    evidence:
      scene: [2, 3]

  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**마당의 고철이 거의 다 없어졌다.** 남은 건 형강과 드럼통 — **무거운 것부터** 없어졌다"
      - "**★ 격납고 천장 크레인 지면 초출**(LOC-02 v0.2 §2.2-C) — 정비 용도 허용·반입구 위 운용 0"
      - "**간척지는 밤에 빈다.** 낮에는 복구반, 밤에는 아무도 없다. 지난달 침수 자리는 아직 물이 안 빠졌다"
      - "**무너진 창고 한 벽이 표적으로 쓰였다** — 아홉 번 쏘는 동안 한 번도 안 맞았다"
    evidence:
      scene: [2, 3, 6]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 안 맞는다.** 아홉 발 — 넘어가고, 못 미치고, 스치고, 옆으로 가고, 어디 갔는지 못 본 것도 있다"
      - "**★ 몸이 아는 것과 어긋난다:** `던진 건 나가면서 느려진다 … 이건 반대였다`. 손을 놓는 순간에 어디로 갈지 알 수가 없다. **`힘이 문제였으면 차라리 나았다`**"
      - "**★ EP50 회수 — 아흐레.** 팔 들기는 **6/18 밤(성호와 언덕)** 시작. 그날은 두 번째가 여덟, 세 번째가 여섯이었다. 오늘은 아홉 번 쏘고 감는 동안 안 떨렸다. **그런데 오늘 그게 아무 소용이 없었다** — 버티는 건 되는데 보내는 게 안 된다"
      - "**★ 성호의 3차 청구를 못 받았다.** 금요일·목요일·다음 주 다 못 정했다. **미룬 이유를 말할 수 없다**"
      - "**★ 예진이 틀린 근거로 편들어 줬다.** `성호는 틀리게 알고 있고 예진도 틀리게 알고 있는데, 둘 다 고쳐 줄 수가 없었다`"
      - "봄에 처음 조종석에 앉았을 때와 겹쳐 봤다 — `그때는 팔이 낯설었고 지금은 팔에 붙은 게 낯설다`"
      - "※ **새 증상 0.** 팔 뻐근함은 노동의 여운"
    evidence:
      scene: [1, 2, 3, 5]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**시제품 제작·인도.** 만드는 과정은 안 보여 줬다. 설명은 **절차뿐**"
      - "**★ 시험을 멈췄다** — `물 들어온다. 사슬이 젖은 채로 감기고 있어. 더 하면 감개가 상해.` 위로도 격려도 아닌 **판단**"
      - "**한 손으로 크레인 조작기를 쥔다.** 위치가 맞으면 멈추고 안 맞으면 다시 올린다. 조이는 건 발판에 올라가서"
      - "**`오늘은 여기까지`** / **`내일 다시 한다`**"
    evidence:
      scene: [2, 6]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**★ 궤도를 그렸다.** 두 마디로 꺾인 선(떨어지는 구간 + 살아나는 구간). **틀린 그림이 아니었다**"
      - "**★ 원인을 특정했다** — `불 붙는 데가 매번 달라`. 종이에 못 그리는 것이 손에 달려 있다. **다만 결론은 안 냈다**"
      - "**가게에서 화면으로 참관**(현장 동행 0). 종이를 카메라에 대고 보여 줬다"
      - "**★ 자기 쪽부터 봤다** — `아냐. 내 그림이 틀렸나 봐.`(수아 4금 정합)"
    evidence:
      scene: 4

  - category: "relational"
    field_path: "relations.dana_seongho"
    operation: "advance"
    after:
      - "**3차 청구.** 성호는 **동점을 못 견딘다** — `동점이 왜 안 끝난 건지는 성호만 안다. 다른 애들은 다 끝난 걸로 쳤고 성호만 안 잊었다`"
      - "**★ 성호가 겁으로 읽는다:** `너 봄에는 안 이랬어` / `뛰기 싫으면 싫다고 해`. **오해는 안 풀린다**(S10 자산)"
      - "다만 몰아붙이는 애는 아니다 — `나 계속 물어보는 거 나도 좀 그렇거든`"
    evidence:
      scene: 1

  - category: "relational"
    field_path: "relations.dana_yejin"
    operation: "advance"
    after:
      - "**간격 8 회수.** 갈등 장면에서 **문장이 길어지는 유일한 인물** 이행. 가방끈을 잡는 손 · 화제를 반 발짝 옮기기(`오늘 급식 미역국이래`)"
      - "**★ 틀린 근거로 편들어 준다.** 시청 방문을 이유로 짐작했고, 그건 사실이 아니다. **호의가 한 번 더 아프게 만든다**"
    evidence:
      scene: 1

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**★ 단아가 수아를 읽는다:** `언니 탓도 장비 탓도 할 수 없는 게 수아 성격이라는 걸 알기에 단아는 잠자코 들었다`"
    evidence:
      scene: 4

