  dana:
    - "**★ 무게가 처음으로 짐이 됐다.** 발이 들어가고, 빼면 반대쪽이 들어가고, 무릎까지. **버틸수록 깊어진다** · **힘을 빼야 안 빠진다**"
    - "**★ EP52~53의 답이 안 통했다.** 몸이 `밀릴지는 내가 정한다`를 먼저 꺼냈는데 **밀리지가 않았다.** `밀리는 데는 방향이 있고 가라앉는 데는 없다`"
    - "**★ 봄 계통을 얼굴로 알아봤다.** 왼쪽 턱이 멀쩡하다 → **다른 놈.** `같은 얼굴에 성한 턱을 달고, 하는 짓만 달라져서 왔다`"
    - "**★ 양팔로 좌우 턱을 잡아 메다꽂았다.** 봄(EP35)에는 왼팔 봉쇄로 오른주먹 하나였다 — **지금은 양쪽이 다 있다**"
    - "**★ 박힌 닻을 뽑아 두 번째에 끊었다.** 계보상 가장 잔인한 마무리"
    - "**★★ `속이 안 좋았다. 그리고 그것보다 이긴 게 더 컸다`** — §1-I ② 지면화"
    - "**★ 몸살 산발 ①** — 귀환 후 저녁 **열.** 여름감기로 본인이 정리. **EP63과 연결 0**"
    - "**도시 쪽으로 물러난 값을 안다.** `저것이 여기로 온 건 단아가 끌고 왔기 때문이었다`. **말한 적 0**"
  youngjin:
    - "`힘 주면 더 들어간다. 빼.` — 관측·지형 층위 유지"
    - "**`설 데가 있으면 싸우는 건 금방이야`**"
    - "`그럼 어디였어야 하냐` — **답을 주지 않는 되물음.** 헹구던 손을 멈추지 않았다"
  sua:
    - "이마를 짚고 **찬물을 받아 상 옆에 놓고 갔다.** 마시라는 말 0"
