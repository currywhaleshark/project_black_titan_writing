state_changes:
  dana:
    - "**★★ 넷이 한 날에 겹쳤다** — 가슴 것 · **미열 37.4** · **왼손 저림 3회** · **시야 흐림 1회**. 산발일 때는 하나씩 왔고 서로 안 이어졌다"
    - "**★★ 전부 따로따로 설명이 된다**(맞아서 · 여름감기 · 무리 · 잠). `설명이 없는 건 하나도 없었다` — **겹쳐 보는 사람이 없다**"
    - "**★★★ 아파 본 적이 없다.** 이틀 규칙은 **남들 걸 빌려온 셈**(혜정·반 애들). **EP61의 `아프다`는 결석용 거짓말이었다** — `아프다는 말을 그런 데에 먼저 써 버렸다`"
    - "**★ 비교 대상이 없다** — `지금 이게 그건지 아닌지 댈 데가 없었다` · **`처음 아픈 사람은 자기가 얼마나 아픈 건지 모른다`**"
    - "**★ 저림 3회.** 세 번째는 **아무것도 안 하는데** 온다. `간격을 세는 건 수아가 표에서 하는 일이었다. 자기 손에 대고 그걸 하게 될 줄은 몰랐다`"
    - "**★ 병원에 못 간다** — 일요일 휴진 · 미열 · 손은 지금 멀쩡. **`보여줄 게 없는 몸을 들고 갈 수는 없는 일이었다`**"
    - "**★ 설정값 질문을 안 묻는다.** 물을 자리가 있었는데도 — `둘밖에 없었고, 시간도 있었고, 물소리도 없었다`. **안 묻게 된 것이 변화**"
    - "**겹침의 자각에서 멈춘다** — `시작점은 넷 다 같은 날이었다. / 거기까지 가기 전에 멈췄다`"
    - "**본인 마감:** `내일 아침에 안 나았으면, 그건 감기가 아니다`"
  sua:
    - "**★ 수아도 아파 본 적이 없다** — 3학년이 되도록 감기 0. 겨울에 반이 통째로 앓을 때도 혼자 멀쩡. **`그때는 그게 다행이라고만 생각했다`**(단아의 인식 — 이유 추궁 0)"
    - "하랑이네 마당 연습 — **`마당에서는 안 세기로 했어. 하랑이랑 약속했어`**(세는 애가 안 세기로 한 약속)"
    - "**곁눈질 계속** — 컵을 오른손으로만 드는 것 · 일어날 때 왼손 안 짚는 것. **말 0**"
    - "**★ 물컵을 왼손 쪽에서 오른손 쪽으로 옮겨 놓는다**(새 물을 따라서)"
    - "**표에 점이 하나 더 는다** — 어제 점 옆에. **점 두 개가 나란해졌다**"
    - "죽에 김가루를 올린다 · **평소에 안 하던 문틈 인사**(`잘 자`)"
  youngjin:
    - "**★ 일요일에 가게를 안 연다.** 반쯤 열어 두던 문이 바닥까지 내려와 있다. 이유 무언"
    - "이마 짚기(EP66은 수아였다) · **체온계** → **37.4** · `두 번 재도 같다` · **버리지 않고 손 닿는 데 둔다**"
    - "`내일 학교 못 가겠으면 가지 마라` — **처음으로 내일을 먼저 꺼낸다**. 단아 `갈 수 있어`. **둘 다 판정 없이 지나간다**"
    - "`뭐 필요한 거 있냐` — 그 사람의 안부 인사 · 그릇을 단아 앞의 것부터 걷는다"

relationships:
  - "**★★ 혜정이 제일 먼저 짚는다.** `너가?` / **`너 감기 걸리는 애 아니잖아.`** — 유치원 때부터 같은 반, 같은 겨울 여섯 번. **`못 본 걸 세고 있었던 것도 아닌데 안 봤다는 건 알고 있었다`**"
  - "**★ 단아가 우기고 혜정이 물러선다** — `걸렸어` / `진짜?` / `진짜.` **한 박자.** `……여름감기 오래간다?` **남은 것은 EP73에서 회수**"
  - "혜정의 새 계획 = **바다 물놀이**(넷째). `나가는 게 일인 사람하고 들어가는 게 놀이인 사람이 같은 바다를 두고 다른 말을 하고 있는 것`"
  - "끊는 인사 **`내일 봐.`** — **내일 학교에서 본다는 전제**(EP73에서 깨진다)"
  - "**이하랑 ○** — 마당 연습 발견(소리가 흩어져서 틀려도 티가 덜 난다) · 옆집 아주머니가 **틀린 데서 박수**"

