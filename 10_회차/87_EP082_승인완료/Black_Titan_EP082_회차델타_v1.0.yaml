state_changes:
  dana:
    - "**★★★ 「내가 없어도 되는구나」** — 대체 가능성의 발견. **`놓여나는 것과 밀려나는 것이 같은 문장으로 왔다`**(안 나가도 되면 아파도 된다)"
    - "**★★ 열등감의 형태 확정** — `나는 부수는 걸 몸으로 하는데, 저 애는 재서 한다` · 압궤 결착을 **두 번 돌려 봐도 자기가 떠올리는 그림이 안 그려진다**"
    - "**★ EP81 `잘하더라` 회수** — `진심이었다. 진심이 아닌 것도 조금 섞여 있었다`"
    - "**★ 표가 싸움이 됐다** — `표는 표고 싸움은 싸움이었다` → `어제 표가 싸움이 됐다`"
    - "**★★ 「괜찮다」의 뜻 변질** — `괜찮은 게 좋은 일이 아닌 상태` · **안 나가는 것에 붙어 있는 괜찮음**"
    - "영상을 혼자 본다(**셋이 같이 보자는 말을 아무도 안 꺼냄**) · 조종석 쪽을 안 본다 · 잠이 얕아짐"
  sua:
    - "**★★ 안 재는 것이 둘** — ① 가벼움(`떠올리면 지금도 조금 그랬다` · **왜 안 세는지도 안 셌다**) ② 죽인 것이 안 남는 것(`남지 않는 게 이상한 건지 아닌지도 재지 않았다`)"
    - "**자부심은 셈이 된다** — `잘해서 온 거였다. 그건 셈이 되는 감정이었다`"
    - "**★ 하랑의 지적에 대답 못 함** — `수아 오늘 기분 좋아 보여` → 한 박자 늦은 `아니야`"
    - "**★ 출격 횟수 칸이 없다는 것을 알아 둔다** — `둘이 되면 달라진다`(말은 안 함)"
    - "첫 출격 다음 날 근육통(**정상 반응** · 단아의 것과 명시적 구분) · 자세가 달라짐(어깨가 덜 굽음)"
  youngjin:
    - "**★★★ 조절 범위 확장 개조** — 좌석 레일 두 마디 연장 · 안전띠 잠금 구멍 2개 추가. **수아 몸에 맞추는 게 아니라 둘 다 되는 자리로.** `되돌릴 수 있는 조정이 아니었다` · **`이 조종석은 오늘부터 두 사람 자리였다`**"
    - "**★★ 죄책감:** `하나만 물려주는 줄 알았다` · **`뺏는 거면 차라리 나았을 것이다. 늘린 것이었다`** · `지금 자리를 하나 더 만들고 있는 것도 나다`"
    - "**★ 손이 안 멈추는 이유:** `어긋난 자리에 애가 앉는다` → **`유일하게 할 수 있는 게 그것뿐일 때 사람은 그걸 사랑이라고 부르기도 했다`**"
    - "**★★ 시운전:** `큰애 자리에서 작은애 자리까지 한 번에` → **`잘 됐다. 잘 된 게 제일 나빴다`**"
    - "**★ 국그릇을 수아 앞에 먼저 놓는다**(봄부터 늘 단아가 먼저였다 — 단아가 봄)"

