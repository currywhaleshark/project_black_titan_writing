canon_additions:
  - "시간: EP28 = 5/10 화 하루(아침 교실 → 방과후 바이올린 → 저녁 지하)"
  - "**3학년 교실(LOC-03 계열):** 일인일역 역할표(게시판 자석 2개 부착), 아침 일기장 걷기, 화분·우유 당번"
  - "**임유정 인물핵:** 담임. 온도 평평·짧은 말·재배분(`남의 것 해 주는 거, 나쁜 거 아니야. 근데 네 이름 있는 칸부터.`)"
  - "**하랑 정정:** 바이올린 = 수아와 같이 시작(동기 — `석 달 선배` 아님). 둘이 주고받는 곡, **다음 주 발표 예고(소지불)**"
  - "**지하 정합:** 수아 자리 = 안전선 바깥(걸레·물품 상자). 지하의 칭찬 문법 = 쓸모 있는 것이 자리를 얻음(벽의 스패너 크기순·작업대의 종이)"
  - "**점검 절차 정본:** 외장→관절→냉각→밀봉(EP28부터). 새 점검 장부 = 날짜·항목·특이사항·확인자 칸"
  - "수아의 베끼기 규칙: 뭉개진 획은 앞뒤로 짐작+물음표, 물음표는 물어서 지움"

