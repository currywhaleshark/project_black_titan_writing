changes:
  - category: "situational"
    field_path: "external_conditions.enemy"
    operation: "advance"
    after:
      - "**격파 완료(6/15 오후).** 큰 집게가 왼팔을 물고 **작은 집게가 관절을 잡아 함께 비트는** 협업 공격 확인 — 큰 것은 힘, 작은 것은 정확함"
      - "**신체 구조 확인:** 몸통 앞쪽에 **녹빛 눈자루 두 개**(껍질이 아닌 유일한 부위·가까워져야 보임). 집게 관절은 **한쪽으로만 접힌다**"
      - "**발성 확인:** 눈자루가 상하자 **쇳소리**. 단아는 그것을 `저쪽이 곤란하다`는 뜻으로 읽음 — 그간의 싸움에서 익힌 해석"
      - "결착: 눈자루 꺾기 → 작은 집게 → 큰 집게 → **박치기**. 용해·수거물 0"
    evidence:
      scene: [3, 4, 5]

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**흘리기:** 정면으로 받으면 뒤로 가고 비스듬히 받으면 옆으로 간다. **옆은 넘어지는 방향이 아니다**(EP47 전도의 학습)"
      - "**무거움의 양면:** 걸을 때 발을 박아 넣던 무거움이 **붙잡고 버티는 자리에서는 이점**이다. 다족은 뜬 채로 다니는 대신 버틸 데가 없다"
      - "**어제의 방법이 오늘 안 통한다:** 세게 치면 다 되는 게 아니다. 부러뜨릴 가시도 드러난 속도 없는 상대가 있다"
      - "**구속의 두 종류:** 봄의 것은 **가두려고 넓게** 감았고, 이건 **망가뜨리려고 골라서** 문다. `넓게 잡은 게 무섭다고 생각했는데, 좁게 잡는 게 더 무서웠다`. 통증 0·**어긋남**의 감각"
      - "**관절에는 방향이 있다:** 한쪽으로는 접히고 반대쪽으로는 막힌다. **막히는 쪽이 부러지는 쪽**(촉각으로 습득)"
      - "**박힌 발은 바닥이 될 수 있다**(불리한 지형의 첫 이용)"
      - "**쇳소리 = 저쪽이 곤란하다는 뜻**(소리를 읽는 법)"
    evidence:
      scene: [1, 2, 3, 4, 5]

  - category: "informational"
    field_path: "characters.dana.history"
    operation: "advance"
    after:
      - "**유년의 몸싸움 정본(회상·신규):** 여덟아홉 살 무렵 놀이터 미끄럼틀 뒤, **수아를 울린 덩치 큰 남자애**와 흙투성이로 뒹굶 → 그 애 눈에 흙이 들어가 아무것도 못 하게 됨 → **직후에 박치기로 코피.** **이름은 기억나지 않음**"
      - "**격투의 출처:** `어떻게 하는 건지 배운 적은 없었다. 배울 데도 없었다. 그냥 어릴 때 그렇게 해 본 적이 있었다` — 배운 적 없는 아이의 싸움이 어디서 오는지가 여기서 정해짐"
    evidence:
      scene: [4, 5]

  - category: "situational"
    field_path: "assets.black_titan"
    operation: "advance"
    after:
      - "**격파 후 기립 상태.** 왼팔 관절이 두 집게에 물려 비틀렸으나 **관통 0·손상 표시 0**(구속·비틀림까지). 이마 접촉 있음(박치기)"
      - "**여운:** 팔은 멀쩡한데 **어긋나던 감각이 남아** 폈다 접을 때마다 한 번씩 지나감(증상 아님·전투 후 반응)"
    evidence:
      scene: [3, 6]

  - category: "situational"
    field_path: "external_conditions.sea"
    operation: "advance"
    after:
      - "밀물 진행 — 정강이 → 허벅지 위. 개펄이 더 물러짐. 잔량 한 시간 반 → 한 시간"
    evidence:
      scene: [1, 3]

  - category: "relational"
    field_path: "relations.dana_sua"
    operation: "advance"
    after:
      - "**부재한 채로 스침:** 수아는 이 회차에 등장하지 않지만, 결착의 방아쇠가 된 기억이 **수아를 지키려던 싸움**이다. 감정 서술·다짐 0 — 사실만"
    evidence:
      scene: 4

