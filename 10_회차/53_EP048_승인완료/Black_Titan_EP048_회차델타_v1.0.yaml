canon_additions:
  - "시간: EP48 = 6/15(수) 오후, EP47에서 경과 0"
  - "**유년의 몸싸움 정본:** 놀이터·미끄럼틀 뒤·**수아를 울린 덩치 큰 남자애**·흙·**박치기로 코피**·이름 기억 안 남. 단아 격투의 근원"
  - "**개체 구조 정본(농게형):** 녹빛 눈자루 두 개(껍질 아닌 유일한 부위)·집게 관절은 한쪽으로만 접힘·눈자루가 상하면 힘이 느슨해짐"
  - "**쇳소리 정본:** 개체의 유일한 발성. 단아는 그것을 저쪽이 곤란하다는 신호로 읽는다"
  - "**격투 성장 곡선 2단:** EP45 힘(부서질 때까지 내려침) → **EP48 몸이 기억한 싸움**(눈·되돌려 꺾기·박치기)"
  - "**서술 결정:** `꺾인 집게는 아직 검은 손이 잡고 있다` — 현재형 1문장 유지(사용자 확정). 그 순간만 시간을 멈추는 용법·남용 금지"
  - "격언 계보: `옆은 넘어지는 방향이 아니다` / `넓게 잡은 게 무섭다고 생각했는데, 좁게 잡는 게 더 무서웠다` / `막힌다는 건, 그쪽이 부러지는 쪽이라는 뜻이었다` / `뭔가 해냈다는 뜻이다` / `놀이터에서도 아무도 안 봤다`"
