  approved_at: "2026-08-12"
  approval_note: "브리프 v0.2(결착 4단 구조 지시) → 초고 → 리듬 패스 → 첨삭 8건 → `이렇게 마무리하자`. S8 8/10 — 중요 화·첫 육탄전."
