canon_additions:
  - "시간: EP56 = 6/23(목) 낮 반나절(썰물 → 밀물) + 저녁"
  - "**★ 사체는 죽어야 녹는다(EP5 정본의 이면):** `사체는 착수 후 붉게 풀려 확산·소실`의 전제 — **살아 있으면 안 녹는다.** 떼어낸 것을 물에 두면 다시 붙는다. **부숴야 처리가 끝난다**"
  - "**★ 뒤처리가 노동의 절반:** 떼는 것보다 **옮기는 게 길다.** 위에서 뗀 것은 **아래에서 받아야** 한다. 마무리는 무른 아래쪽을 눌러 부수는 일 — 불쾌하되 해 줘야 하는 일"
  - "**★ 병따개 = 아크 문법:** 맞는 공구가 없으면 뜯어낸 걸 쓴다. **EP61 앵커(있는 것의 합계)의 축소판 리허설**"
  - "**★ 사다리 3연타 확정:** 거리(6월 초) / 지지(EP52~53) / **걸 데(EP56)**"
  - "**★ 장부 옆 칸 = 세 줄** + 여백 `이건 관측에 안 걸렸다.` 소급 기재 자체가 인식의 사건"
  - "**★ 분류의 역설:** 괴수로 분류됐다는 건 치우러 올 사람이 **없다**는 뜻이다"
  - "**★ 통제해도 본다:** 길을 막으면 안 보는 데로 간다. 목격 3단 완성"
  - "격언 계보: `저건 사람을 죽일 수 있고 나는 안 죽는다` / `알아도 말할 데가 없었다` / `셋 다 안 됐는데 셋이 다 다른 이유로 안 됐다` / `손에 든 거 다시 봐. 그게 뭐로 보이나` / `떼는 것보다 옮기는 게 길었다` / `알고 나서 한 자리와 모르고 한 자리가 벽에 나란히 남았다` / `분하려면 상대가 있어야 하는데 저건 끝까지 이쪽을 안 봤다`"
