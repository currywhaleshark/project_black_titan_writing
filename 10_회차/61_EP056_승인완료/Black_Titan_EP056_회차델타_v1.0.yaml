changes:
  - category: "situational"
    field_path: "living_conditions.neighborhood"
    operation: "advance"
    after:
      - "**★ 방재벽 외벽 부착 개체 = 괴수로 분류(6/23 아침):** 남해방위사령부 명의 공개망 통지 **문장 두 개** — 분류 + 해당 구역 어선 운항·잠수 인원 통제. **누가 언제 오는지는 없다**"
      - "**★ 전량 제거 완료(6/23 낮, 반나절):** 판 다섯 장. 블랙 타이탄이 **무단으로** 처리했다"
      - "**★ 벽은 복구되지 않았다:** 뗀 자리마다 둥근 테두리 자국과 누렇게 삭은 안쪽. **첫 번째 뗀 자리는 크게 뜯겨 있다**(접시만 하게 떨어져 나간 데 + 둘레를 따라 홈처럼 판 자국)"
      - "**뒤처리:** 떼어낸 판을 마른 바닥에 모았다가 **하나씩 부숴서 처리** → 바닷물에 떨어지며 **검붉게 녹아 소실.** 남은 잔해 0"
      - "**통제선 유지:** 벽 쪽 길 차단. 다만 난간·옥상·언덕에서 다 보인다"
    evidence:
      scene: [1, 4, 5, 6]

  - category: "situational"
    field_path: "living_conditions.city"
    operation: "advance"
    after:
      - "**★ 목격 3단 완성 — 눈으로, 낮에, 가까이.** EP9 사진 → EP49 영상(화질 나쁨·무음) → **EP56 직접**(거리 200미터도 안 됨·맑음)"
      - "**막아도 본다:** 길을 막으면 길에서 안 보는 데로 간다. 어제 그 자리에 있던 사람들이 조금 뒤로 물러났을 뿐"
      - "**★ 여론 = 불안:** **`벽이 저래도 되는 거야?`** 웅웅거리는 소리가 끊기지 않는다. 봄과 다르다(비명 → 정적 → 박수의 리듬이 없음)"
      - "**비난·항의·환호 0**(S10 학교 파손 몫 보존). **조종석·조종자 인지 0**"
    evidence:
      scene: 5

  - category: "informational"
    field_path: "characters.dana.knowledge"
    operation: "advance"
    after:
      - "**★ 저것은 기존 괴수와 같은 것이다** — 자기가 본 녹색 + 영진의 장부 + 수아의 개체 표 셋이 맞았다"
      - "**★ 갈퀴는 이쪽에 미약하다:** 감겨도 손가락이 그냥 움직이고 팔을 흔들면 따라 흔들린다. **굵기가 손가락 하나쯤** — 사람 팔에 감기면 어느 정도인지는 굳이 생각 안 해도 안다"
      - "**★ 갈퀴의 성질:** **당기면 조이고 밀고 들어가면 풀린다.** 위험해서 푼 게 아니라 어떻게 되나 보다가 알았다 → **어제 그 사람들이 왜 오래 걸렸는지 알겠다. `알아도 말할 데가 없었다`**"
      - "**★ 위협과 난이도의 분리:** `무서운 건 없어졌는데 일은 그대로 남아 있었다`. 저항은 미약한데 붙은 힘은 세다"
      - "**★ 사다리 3연타 = 걸 데가 없다:** 손가락이 안 들어가고 / 손바닥이 미끄러지고 / 두들기면 벽이 먼저 깨진다. **`셋 다 안 됐는데 셋이 다 다른 이유로 안 됐다`**"
      - "**★ 대비 인식:** `저건 갖고 있었다 … 힘은 없는데 걸 줄은 안다 / 이쪽은 손밖에 없고 손은 미끄러진다`"
      - "**★ 병따개(영진에게 받은 것):** 맞는 공구가 없으면 **뜯어낸 걸 쓴다.** 얇은 날 → 밀어 넣고 비틀면 걸린다 → **벽을 안 깨고 떨어진다**"
      - "**높이가 곧 작업량:** 위는 붙어서 **한 손**으로. 같은 동작인데 두 배쯤 걸린다"
      - "**★ 뒤처리를 안 하면 다시 붙는다:** 물에 두면 떠내려가 딴 데 붙거나 가라앉아 밑에서 붙는다. **부숴야 녹는다**"
      - "**★ 이겼다가 안 붙는 전투:** `분하려면 상대가 있어야 하는데 저건 끝까지 이쪽을 안 봤다` / **`그냥 힘이 빠졌다`**"
      - "**★ 존재 이유의 손끝 확인:** `저건 사람을 죽일 수 있고 나는 안 죽는다. 그래서 지금 여기 나와 있는 거였다` — **한 줄로 끊고 결의 0**"
      - "※ 새 증상 0"
    evidence:
      scene: [1, 2, 3, 4, 5, 6]

  - category: "informational"
    field_path: "characters.youngjin.knowledge"
    operation: "advance"
    after:
      - "**★ 앞 권 장부로 동일성 확인:** 4월 줄(`함몰부 안쪽 녹색. 흔들림 없음. 밝아지지도 어두워지지도 않음.`)·5월 줄(`가시 뿌리 사이마다 녹색. 어디를 보는지 알 수 없음.`) → **`같은 거네.`**"
      - "**★ 병따개 조언(지원 범위 §2-B의 결정적 사례):** `맞는 공구가 없으면 뜯어낸 걸 쓴다. 나사 없으면 못 박고 못 없으면 철사 꼬고.` + **`손에 든 거 다시 봐. 그게 뭐로 보이나.`** — 답이 아니라 보게 만드는 말"
      - "**뒤처리 절차 지시:** `물에 놔두면 안 된다. 떠내려가면 딴 데 붙고 가라앉으면 밑에서 붙는다.` → `한 군데다 모아 둬. 물 안 닿는 데`"
      - "**★ 장부 옆 칸에 두 줄을 더 놓음:** `떼어낼 것이 없다.` 를 적고, **위에 `닿을 것이 없다.`(6월 초 것)를 소급해서 끼워 넣었다.** 세 줄이 나란해짐 → 여백에 **`이건 관측에 안 걸렸다.`**"
      - "**셋이 같은 종류임을 알아봤다** — 다만 언어화 0·앵커 착상 0"
    evidence:
      scene: [1, 3, 4, 6]

  - category: "informational"
    field_path: "characters.sua.knowledge"
    operation: "advance"
    after:
      - "**★ 개체 표로 동일성 확인:** EP50에서 만들 때 **앞엣것들을 기억으로 채웠다.** 못 본 것은 단아에게 물어 적었다. 눈 색 칸이 따로 없어 **행동 칸에 같이 썼다**"
      - "**`전부 녹색이에요.` / `하나도 안 빼고요.` / `안 적힌 것도 기억나요. 색만은 다 기억나요.`**"
      - "**출격 지원 = 물때 전달:** 무릎·허벅지·허리 세 줄. **시각 수치는 안 쓴다**(물때 정본 미확정). 전투 교신 0"
    evidence:
      scene: 1

  - category: "relational"
    field_path: "relations.dana_youngjin"
    operation: "advance"
    after:
      - "**말 안 했던 것을 다음 날 말한다** — EP55에서 삼킨 목격이 여기서 나오고, 그것이 확인의 첫 조각이 된다"
      - "**병따개 = 신뢰의 실물화.** 영진의 말이 처음으로 **전투 안에서** 결정적으로 작동했다"
      - "돌아오는 길 교신 = 물이 어디까지 왔는지 한 번. 대답은 `무릎`"
    evidence:
      scene: [1, 4, 6]

