implementation:
  override_rule: G0-004는 조종체계, 포스 피드백, 조작 지연, 단아·수아의 동조 차이에서 이전 설정·플롯·개요의 축약 또는 충돌 표현을 즉시 대체한다.
  no_event_retcon:
    - S1부터 S6까지 승인된 전투 상대, 승패, 생활선, 공개 순서, 인물 관계는 바꾸지 않는다.
    - 아이언 앵커의 현행 첫 등장 시기는 유지한다.
    - G0-002의 1차 계통 탐색파와 블랙 타이탄 상쇄 규칙은 유지한다.
  source_firewall:
    - 과거 원고의 조종 묘사는 스타일·복원 단서로만 참고한다.
    - 과거 원고의 괴수, 무장 등장 시기, 전투 사건은 현행 승인본으로 가져오지 않는다.
  completed_patches:
    - 통합설정집 조종체계 문단 복구
    - 전체 플롯에 단아의 통증성 피격·출격불가와 수아 대체출격·동조 강화의 여름 중반 인과 및 여름방학 마지막 날 이후 공개선 복구
    - S1 v3.5 및 심사서 v1.5 개정
    - S6 v1.4 및 심사서 v1.4 문구 수정
