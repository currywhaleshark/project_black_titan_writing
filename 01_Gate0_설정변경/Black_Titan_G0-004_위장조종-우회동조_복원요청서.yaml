request:
  id: G0-004
  title: 세미다이렉트모션 위장조종과 우회 신경동조 복원
  revision: 1.3
  status: APPROVED
  approved_by: user
  approved_at: 2026-07-31
  placement_updated_at: 2026-07-31
  source_integrated_at: 2026-07-31
  authority: current_user_correction
  change_type: omitted_canon_restoration

change_summary:
  before:
    - 현행 통합설정집과 봄 승인본에는 단아의 VR 반응값에 맞춘 조종계, 거대한 몸의 감각, 반복 접속 부담만 남아 있다.
    - 세미다이렉트모션, 근전도 입력, 조종간의 제한된 기능, 감쇠된 포스 피드백, 심리적 필터를 거친 우회 동조의 인과가 소실됐다.
    - 단아의 통상 반응 지연과 수아의 더 짧은 지연·간헐적 즉각 반응을 설명하는 공통 원리가 빠졌다.
    - S6 EP035의 손 저림 원인 후보에 아이언 앵커 미등장 시기와 맞지 않는 조종간 압박이 들어갔다.
    - 서술규칙 문체카드는 위장조종의 통증 차단을 절대 규칙처럼 요약해 감정 격화 시 통증성 피드백 누출을 수용하지 못한다.
  after:
    - 표면상 블랙 타이탄은 조종자의 실제 몸동작을 복제하지 않고 움직이려는 근전도와 운동 의도를 읽어 기체의 동일 동작으로 변환하는 세미다이렉트모션 방식이다.
    - 조종간은 팔다리와 몸통의 기본 동작용이 아니라 아이언 앵커처럼 블랙 타이탄의 신체도식 밖에 있는 외부무장을 조작하기 위해 존재한다.
    - 표면상 포스 피드백은 블랙 타이탄이 받는 접촉, 압력, 관절 부하와 몸의 위치 감각을 약하게 조종자에게 돌려주어 거대한 몸의 조종감각을 보조한다.
    - 실제로 세미다이렉트모션은 직접 신경동조를 피하기 위한 공학적 위장이자 안전 우회로다. 조종자의 의식적인 운동 의도와 심리적 신체상을 필터로 삼아 블랙 타이탄과 간접 동조한다.
    - 이 우회는 원시 감각과 통증의 환류를 감쇠하지만, 의식적 운동 의도를 한 차례 거치므로 단아에게 통상 약 0.5초의 조작 지연을 만든다.
    - 단아는 1차 계통 조종자로서 우회 필터가 대체로 작동한다. 다만 감정이 격화되면 간헐적으로 연결이 강해져 압력·부하 피드백이 통증으로 돌파할 수 있다.
    - 단아는 이 통증성 피드백을 표면상 설정값 또는 피드백 감도 오류로 이해하고 영진에게 따지는 장면을 갖는다. 영진은 단순 보정 문제로만 넘길 수 없는 이상을 인지한다.
    - 수아는 블랙 타이탄과 같은 2차 계통이므로 영진의 예상과 달리 우회 필터가 약하거나 충분히 작동하지 않는다. 그 결과 조작 지연이 단아보다 짧고, 간헐적으로 동조가 성립하면 의도와 기동이 즉각 이어진다.
    - 수아의 짧은 지연과 즉각 반응은 기량 우위가 아니라 높은 계통 적합성과 더 위험한 직접 연결 가능성의 징후다.
    - 단아의 설정값 항의 장면과 수아의 첫 즉각 반응은 모두 여름 중반의 수아 대체출격 소아크에 복구한다.
    - 단아가 전투에서 코너에 몰려 감정적으로 격화되고, 강해진 연결을 통해 피격의 압력·부하를 통증으로 돌려받은 뒤 격납고에서도 감정이 풀리지 않은 채 영진에게 날카롭게 항의한다.
    - 반복 접속에 따른 단아의 신경손상이 이 시기 가속되어 결국 출격 불가 판정을 받고, 그 공백이 수아의 대체출격을 성립시킨다.
    - 수아는 거듭 출격할수록 우회가 약해지고 동조 강도가 높아져 블랙 타이탄의 거대한 몸이 자기 몸처럼 움직이는 감각을 얻으며, 이를 내심 쾌감으로 받아들인다.
    - 이 쾌감은 힘에 취한 타락이나 공격 충동이 아니라 지연 없이 몸이 맞물리는 신체적 해방감으로 제한한다.
    - 여름방학 마지막 날이 지나기 전에는 우회 신경동조, 계통 적합성, 단아의 손상 원인을 실체적 진실로 공개하지 않는다.

