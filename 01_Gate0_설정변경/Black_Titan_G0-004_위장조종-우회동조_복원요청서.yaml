  CANON-FORCE-FEEDBACK:
    normal_return:
      - 접촉 위치
      - 압력
      - 관절 부하
      - 자세와 신체 위치감각
    gain: attenuated
    normal_pain: suppressed
    purpose:
      surface: 거대한 몸의 조종감각 보조
      hidden: 원시 감각과 통증을 약화해 직접 신경동조 위험을 줄임
    breakthrough_condition:
      operator: 단아
      trigger: 감정 격화로 우회 필터가 약해질 때
      possible_result: 통증성 압력·부하 피드백의 일시적 누출
  CANON-HIDDEN-BYPASS:
    actual_mechanism: 심리적 신체상과 의식적 운동 의도를 필터로 거치는 우회 신경동조
    direct_neural_synchronization_avoided: true
    tradeoff:
      - 감각 피드백 약화
      - 통증 환류 억제
      - 미세한 조작 지연
    cover_is_wholly_fake: false
    note: 근전도와 운동의도 해석은 실제 안전 우회로의 입력층이지만, 기체 기동의 궁극 원리는 생체 신경동조다.
  CANON-DANA-CONTROL:
    lineage: first
    normal_bypass: mostly_effective
    normal_latency: approximately_0_5_seconds
    emotional_surge:
      connection_strength: intermittently_increases
      latency_may_shorten: possible
      painful_feedback_may_break_through: true
    surface_misread: 포스 피드백 설정값 또는 감도 오류
    long_term_risk: 교차계통 반복 접속에 따른 면역거부성 신경손상
  CANON-SUA-CONTROL:
    lineage: second_same_as_black_titan
    youngjin_expected_bypass_behavior: false
    bypass_strength: weak_or_inconsistently_effective
    latency_relative_to_dana: shorter
    intermittent_full_synchronization:
      possible: true
      response: immediate
    repeated_sorties:
      synchronization_strength: progressively_increases
      body_schema_integration: black_titan_feels_like_own_body
      subjective_response: private_pleasure
      pleasure_character:
        - 지연 없이 거대한 몸이 의도대로 맞물리는 신체적 해방감
        - 힘에 취한 타락·공격 충동·중독 확정으로 묘사하지 않음
    narrative_meaning:
      - 단아보다 높은 자연 적합성
      - 직접 동조와 강한 감각 환류의 위험
      - 단순한 조종 실력 우위로 해석 금지
  CANON-MID-SUMMER-SUBSTITUTION:
    trigger_chain:
      - 단아가 전투에서 코너에 몰린다.
      - 감정 격화로 연결 강도가 높아진 상태에서 피격을 당해 통증성 포스 피드백을 경험한다.
      - 귀환 뒤 격납고에서도 감정이 가라앉지 않아 영진에게 설정값·감도를 날카롭게 따진다.
      - 교차계통 반복 접속에 따른 누적 신경손상이 가속되어 단아가 출격 불가 상태가 된다.
      - 단아의 공백 때문에 수아의 대체출격이 성립한다.
      - 수아는 거듭된 출격에서 더 강한 동조와 자기 몸 같은 거대 신체감을 경험한다.
    old_version_motif_policy:
      mantis_shrimp_type: not_restored_as_canon_by_this_request
      preserved_scene_function:
        - 난타전 또는 이에 준하는 압박
        - 단아가 코너에 몰림
        - 감정 격화
        - 아프게 맞는 통증성 피드백
        - 격납고까지 이어지는 날선 감정

disclosure_layers:
  dana_and_sua_surface:
    may_know:
      - 세미다이렉트모션
      - 근전도와 운동의도 입력
      - 약화된 포스 피드백
      - 외부무장용 조종간
      - 단아의 약 0.5초 지연
    must_not_know_initially:
      - 심리적 필터를 거친 우회 신경동조
      - 블랙 타이탄의 생체 신경기원
      - 단아와 수아의 계통 차이
  youngjin_knowledge:
    knows:
      - 세미다이렉트모션과 포스 피드백의 표면 사양
      - 위장조종이 직접 신경동조를 피하는 안전 우회로라는 실체
      - 블랙 타이탄의 생체 신경기원
      - 단아와 수아의 서로 다른 계통
      - 교차계통 반복 접속의 위험 가능성
    did_not_predict:
      - 수아에게 우회 필터가 약하거나 불안정하게 작동함
      - 수아의 짧은 지연과 간헐적 즉각 반응
    narrative_response:
      - 단아의 통증성 피드백을 단순 설정 오류가 아닐 수 있다고 의심
      - 수아의 예상 밖 반응을 관찰하지만 여름방학 마지막 날 이전에 정답을 설명하지 않음
  author_only_until_reveal:
    - 위장조종은 직접 신경동조를 피하기 위한 안전 우회로다.
    - 단아의 통증성 피드백은 설정 오류가 아니라 간헐적 연결 강화다.
    - 수아의 짧은 지연과 즉각 반응은 우회 실패와 2차 계통 자연동조 때문이다.
    - 단아의 여름 중반 출격불가는 교차계통 반복 접속으로 가속된 누적 신경손상의 결과다.
    - 수아가 거대한 블랙 타이탄을 자기 몸처럼 느끼는 쾌감은 직접 동조 강도가 높아지는 징후다.
  reveal_boundary:
    real_mechanism_earliest_window: after_summer_vacation_last_day
    prohibited_before_boundary:
      - 우회 신경동조의 실체를 정답으로 설명
      - 단아의 출격불가를 교차계통 면역거부성 손상으로 확정 설명
      - 수아의 자기 몸 같은 감각을 2차 계통 자연동조로 확정 설명
      - 블랙 타이탄의 생체 신경기원을 확정 공개
  reader_progression:
    - 먼저 근전도 기반 세미다이렉트모션과 포스 피드백을 정상적인 로봇 조종기술로 이해한다.
    - 단아의 0.5초 지연과 간헐적 통증을 설정 불량 또는 전투 부하로 오독할 수 있다.
    - 수아의 더 짧은 지연과 즉각 반응이 나타난 뒤 두 사람의 차이가 단순 보정 문제가 아님을 의심한다.
    - 단아의 출격불가와 수아의 대체출격을 거치며 통증·지연·거대 신체감이 같은 조종계의 서로 다른 이상으로 보이게 한다.
    - 여름방학 마지막 날 이후의 폭로에서 포스 피드백, 조작 지연, 신경손상, 수아의 자기 몸 같은 감각이 모두 우회 신경동조와 계통 차이의 흔적이었음이 밝혀진다.

continuity_checks:
  prohibited_misreadings:
    - 단아가 팔다리 기본동작을 조종간으로 직접 조작한다.
    - 조종석이 단아의 실제 전신 동작을 모션캡처해 그대로 복제한다.
    - 정상 포스 피드백이 블랙 타이탄의 원시 통증을 무감쇠로 전달한다.
    - 단아의 모든 반사행동이 지연 없이 즉시 블랙 타이탄에 나타난다.
    - 수아의 즉각 반응을 연습량이나 천재적 조종 실력만으로 설명한다.
    - 단아의 통증성 피드백과 장기 신경손상을 같은 현상의 동일 수위로 취급한다.
    - 단아가 한 번 아프게 맞은 사건만으로 즉시 신경손상 판정을 받고 출격 불가가 된다.
    - 수아의 쾌감을 전투광화, 공격성 상승, 힘에 취한 타락, 즉각적인 중독으로 묘사한다.
    - 여름방학 마지막 날 이전에 영진이나 서술이 수아의 감각을 자연동조의 정답으로 해설한다.
  required_distinctions:
    - 포스 피드백의 일시적 통증 누출은 연결 강도의 순간 상승이다.
    - 반복 접속 뒤 시력·저림·신경증상은 교차계통 접속의 누적 손상선이다.
    - 탐색파 공명 증상은 기체 밖 단아에게 일어나며 G0-002의 별도 원리를 따른다.
    - 외부무장이 없는 봄 전투에서 조종간은 팔다리 동작의 원인으로 쓰지 않는다.

downstream_rules:
  S1:
    - EP2 영진의 표면 설명에 세미다이렉트모션, 근전도·운동의도 입력, 약화된 포스 피드백, 외부무장용 조종간을 포함한다.
    - EP2의 VR 반응값은 근전도 패턴과 심리적 신체상 필터를 단아에게 맞춘 보정값으로 기능한다.
    - EP3 첫 기동에서는 실제 몸을 움직이지 않아도 움직이려는 순간 블랙 타이탄이 뒤따라오며, 통상 약 0.5초 지연과 거대한 몸의 약화된 압력·위치감각을 체험한다.
    - 우회 신경동조와 생체성은 공개하지 않는다.
  S2_TO_S6:
    - 승인된 전투 사건과 승리법은 유지한다.
    - Gate C와 본문에서 단아의 평범한 신체동작이 조종간 조작으로 묘사되지 않도록 검수한다.
    - 단아의 반응은 통상 지연을 전제로 쓰되, 감정 격화 시에만 예외적인 짧아짐 또는 통증성 피드백 누출을 허용한다.
  S6:
    - EP035 손 저림 원인 후보에서 조종간 압박을 삭제한다.
    - 비우세손 카운터 충격, 과긴장, 교차계통 반복 접속 부담을 서로 확정하지 않은 후보로 유지한다.
    - EP035의 오른손 저림은 전투 후 C1 신호이며, 전투 중 통증성 포스 피드백과 동일시하지 않는다.
  SUA_FUTURE:
    - 수아의 첫 실제 조종 장면에서 단아보다 짧은 지연을 관찰 가능한 차이로 제시한다.
    - 간헐적 즉각 반응은 수아 자신과 영진 모두 예상하지 못한 사건으로 둔다.
    - 즉각 반응과 함께 감각 환류 위험이 커진다는 대가를 보존한다.
    - 첫 즉각 반응의 배치창은 여름 중반으로 잠근다.
    - 첫 대체출격 한 번에 완전한 자기 몸 감각을 확정하지 않고, 거듭된 출격에 따라 동조 강도와 신체감각이 점진적으로 높아지게 한다.
    - 수아는 거대한 몸이 자기 의도와 지연 없이 맞물리는 감각에 내심 쾌감을 느끼지만 이를 영진이나 단아에게 곧바로 설명하지 않는다.
    - 여름방학 마지막 날 이전에는 이 감각을 2차 계통 자연동조로 명명하거나 해설하지 않는다.
  DANA_FEEDBACK_SCENE:
    - 단아가 전투에서 코너에 몰리고 감정적으로 격화된 상태에서 아프게 맞는 장면을 먼저 배치한다.
    - 통증은 감정 격화로 연결이 강해진 순간 피격 압력·부하가 포스 피드백을 뚫고 들어온 결과이며, 누적 신경손상 그 자체와는 구분한다.
    - 귀환 뒤에도 단아의 감정이 풀리지 않아 격납고에서 포스 피드백 설정값 또는 감도가 잘못됐다고 영진에게 날카롭게 따진다.
    - 영진은 표면상 보정을 약속하거나 점검하지만, 작가용으로는 설정 오류가 아님을 의심한다.
    - 배치창은 여름 중반으로 잠근다.
    - 이후 반복 접속 손상이 가속되어 단아가 출격 불가가 되고, 수아 대체출격의 직접 원인이 된다.
    - 정확한 전투 상대와 회차는 여름 Level 3·4 설계에서 잠근다. 구버전의 공작갯가제형은 장면 기능의 출처일 뿐 현행 괴수로 자동 복구하지 않는다.
  MID_SUMMER_PLACEMENT_LOCK:
    status: APPROVED
    required_beats:
      - 단아가 코너에 몰려 감정적으로 격화된 상태에서 통증성 피격을 경험
      - 단아의 포스 피드백 설정값 항의
      - 누적 신경손상 가속과 단아의 출격불가
      - 수아의 대체출격
      - 수아의 간헐적 즉각 반응
      - 반복 출격에 따른 수아의 동조 강화
      - 블랙 타이탄을 자기 몸처럼 느끼는 수아의 내밀한 쾌감
    season: 여름
    window: 중반
    exact_subarc: 수아_대체출격_소아크
    exact_episode: PENDING_SUMMER_LEVEL_4
    relative_order:
      - 단아의 감정 격화와 통증성 피격
      - 격납고의 날선 항의
      - 신경손상 가속 확인과 출격 정지
      - 수아의 첫 대체출격과 짧은 지연·간헐적 즉각 반응
      - 거듭된 출격과 자기 몸 같은 감각·내밀한 쾌감
      - 여름방학 마지막 날 이후 실체적 진실 공개
    same_scene_required: false
    disclosure_guard:
      - 두 장면 모두 표면상 조종계의 설정·반응 차이로 읽힐 수 있어야 한다.
      - 수아의 즉각 반응만으로 2차 계통 자연동조나 생체 신경기원을 확정 공개하지 않는다.
      - 영진은 단순 보정 문제가 아닐 가능성을 의심할 수 있으나 즉시 정답을 설명하지 않는다.
      - 수아의 자기 몸 같은 감각과 쾌감은 내면 감각까지만 묘사하고 원인·계통·생체성을 설명하지 않는다.
      - 실체적 진실의 공개는 여름방학 마지막 날이 지난 뒤에만 허용한다.

