request:
  id: G0-002
  title: 1차 거체 계통 탐색파와 블랙 타이탄 상쇄
  status: APPROVED
  approved_by: user
  approved_at: 2026-07-30
  authority: current_user_correction

change_summary:
  before:
    - 괴수의 탐색파가 단아에게 반응하지만 수아의 무반응 원리가 잠기지 않았다.
    - 인큐베이터가 블랙 타이탄을 회수 대상 계통으로 인식하는 듯한 표현이 남아 있었다.
    - 거미게형은 블랙 타이탄 위쪽에서 근접 반응을 측정하는 행동으로 설계됐다.
  after:
    - 인큐베이터는 과거 확보한 1차 거체의 신경·역장 서명에 맞춘 탐색파를 사용한다.
    - 1차 거체 계통인 단아만 기체 밖에서 탐색파에 공명한다.
    - 2차 거체 계통인 수아와 블랙 타이탄은 탐색파에 공명하지 않는다.
    - 단아가 블랙 타이탄에 탑승하면 타이탄의 2차 계통장이 탐색파를 상쇄해 단아의 반응도 사라진다.
    - 괴수들은 블랙 타이탄을 동족이나 회수 대상으로 알지 못하고, 1차 거체 탐색을 방해하는 이동식 상쇄원으로 기록한다.
    - 거미게형은 블랙 타이탄의 상쇄권을 벗어나 탐색을 계속하려 더 높고 깨끗한 탐색 지점으로 이동한다.

