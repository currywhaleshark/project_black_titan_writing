downstream_rules:
  S1:
    - EP1 탐색파는 1차 계통 전용이며 기체 밖 단아에게만 공명한다.
    - EP4 블랙 타이탄 출현과 동시에 1차 계통 반응이 사라져 인큐베이터는 이동식 상쇄원을 기록한다.
  S2:
    - 성게형은 1차 계통 잔류반응을 수동 청취하며 강한 능동 탐색파를 쓰지 않는다.
    - 블랙 타이탄 출현은 목표 확인이 아니라 탐색 방해의 재출현이다.
  S3:
    - 단아의 탐색파 공명은 탑승 전 좁은 탐색빔이 지나갈 때만 허용한다.
    - 탑승 뒤 탐색파 증상은 멈춘다.
    - 거미게형은 상쇄권을 피해 더 높고 먼 고지로 이동한다.
    - 해결법은 블랙 타이탄을 이동식 재머 겸 몰이벽으로 사용해 안전한 종착 고지로 몰아넣는 방식이다.
  S4_TO_S7:
    - 포박·운반형은 블랙 타이탄을 동족으로 회수하지 않는다.
    - 블랙 타이탄을 탐색 방해물로 묶거나 이동시키거나, 실제 1차 계통 목표 발견 시 회수한다.

