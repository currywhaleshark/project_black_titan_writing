request:
  id: G0-010
  title: 역장 비가시화와 계통별 음향 설계 잠금
  revision: 1.0
  status: APPROVED
  approved_by: user
  approved_at: 2026-08-02
  authority: current_user_correction
  change_type: sensory_presentation_lock
  origin: 2026-08-02 사용자 지시 — 역장의 가시성과 블랙 타이탄·괴수의 소리에 대한 확정

problem:
  - 통합설정집 v2.3은 역장의 물리 규칙만 규정하고 그것이 눈에 보이는지를 정하지 않았다.
  - 그 공백 때문에 초고 v0.1·v0.2와 G0-008 v0.2 초안이 역장을 `아지랑이 같은 얇은 막`으로 임의 가시화했다. 승인된 적 없는 표현이다.
  - 블랙 타이탄과 괴수의 소리는 어느 문서에도 규정이 없어 매번 임의로 붙을 위험이 있었다.

existing_canon_kept:
  - 통합설정집 v2.3 [651] 인간의 탄도·열·폭발·방사선은 표면을 실질적으로 파괴하지 못한다. 다만 운동량과 압력은 전달된다.
  - 통합설정집 v2.3 [652] 동종 역장이 접촉하면 상호 간섭·중화가 일어나 괴수와 타이탄은 실제 손상을 주고받을 수 있다.
  - 통합설정집 v2.3 [818] 군의 무력함은 "아무것도 못 함"이 아니라 "결정타를 줄 수 없음"으로 표현한다.

field_visibility_lock:
  visible: false
  rule: 역장은 눈에 보이지 않는다. 막·아지랑이·빛·왜곡·파문 같은 어떤 시각적 형태도 부여하지 않는다.
  narration_ban_until: 가을
  detail:
    - 가을 전까지 본문은 역장이라는 개념 자체를 서술하지 않는다. 이름도, 원리도, 존재도 언급하지 않는다.
    - 서술자는 역장으로 결과를 설명하지 않는다. 결과만 보여 준다.
  permitted_now:
    - 재래식 화력이 괴수에게 통하지 않는다는 사실.
    - 괴수와 블랙 타이탄은 서로 실제로 피해를 주고받을 수 있다는 사실.
  how_to_show_without_field:
    - 포탄과 폭발이 괴수에게 닿았는데도 갑각에 자국이 남지 않는다.
    - 충격으로 몸이 밀리거나 자세가 흐트러지지만 그뿐이다. 파괴는 일어나지 않는다.
    - 반대로 블랙 타이탄의 팔과 어깨는 괴수에게 실제로 힘을 전달한다. 밀리고 눌리고 방향이 바뀐다.
  prohibited:
    - "`아지랑이 같은 막`, `폭발이 막의 바깥에서 끝났다` 같은 역장 가시화 표현."
    - 인물이 화력 무효의 원인을 추정하거나 이름 붙이는 것.
    - 서술자가 `통하지 않는 이유가 있었다` 식으로 존재를 암시하는 것.

audio_lock:
  black_titan:
    permitted:
      - 묵직한 발 소리
      - 장갑이 서로 닿거나 스치는 소리
    prohibited:
      - 구동음, 모터음, 유압음, 서보음 등 기계 작동음 일체
      - 숨소리, 울음, 맥동 같은 생물적 소리 일체
    reason: 기계로도 생물로도 확정되지 않은 상태를 유지한다. 생체성 노출은 여름 마지막 전투다.
    note: 소리가 적다는 사실 자체가 이 기체의 인상이다. 조용한 무게로 읽히게 한다.
  lobster_retrieval_01:
    permitted:
      - 쇠를 긁는 듯한 소리. 상황에 따라 낸다.
    usage:
      - 위협하거나 밀어낼 때
      - 단말마
    prohibited:
      - 포효, 울부짖음 같은 감정이 읽히는 발성
      - 대사처럼 기능하는 소리, 소통 시도로 읽히는 소리
      - 매 공방마다 붙는 상시 효과음
    note: 소리에 감정을 싣지 않는다. 쇠 긁는 소리는 의사 표현이 아니라 물성이다.
  environment:
    note: 규모감은 개체의 소리가 아니라 환경의 반응으로 만든다. 물, 잔해, 공기, 거리에 따른 소리의 지연이 그 역할을 한다.

affected_artifacts:
  - artifact: Project_Black_Titan_통합설정집_v2.3.docx
    action: REVISE
    replacement: Project_Black_Titan_통합설정집_v2.4.docx
    reason: 역장 항목에 비가시성과 가을 전 서술 금지를, 기체·괴수 항목에 음향 규정을 추가한다. G0-007·G0-008·G0-009와 같은 회차에 처리한다.
    note: 정사 원문 개정이므로 사용자 승인과 별도 작업이 필요하다.
  - artifact: Black_Titan_G0-008_바닷가재형회수개체_외형확정_변경요청서_v0.2.yaml
    action: REVISE
    replacement: 동 문서 v0.3
    reason: "`field.appearance`의 아지랑이 묘사를 철회하고 음향 항목을 추가한다."
  - artifact: Black_Titan_EP003_회차브리프_v1.3_GateC후보.md
    action: REVISE
    replacement: 동 문서 v1.4
    reason: 역장 가시화 표현을 제거하고 화력 무효를 결과로만 보여 주도록 바꾼다. 음향 잠금을 금지 목록에 추가한다.
  - artifact: Black_Titan_EP001_1화_벚꽃과사이렌_v1.0_GateD승인.md
    action: KEEP
    reason: 역장 언급이 없다. `콰앙!`은 집게와 팔의 충돌음이며 기체 구동음이 아니다.
  - artifact: Black_Titan_EP002_2화_격납고_v1.0_GateD승인.md
    action: KEEP
    reason: 정지 상태의 기체이며 구동음·생물음 묘사가 없다. 본 잠금과 일치한다.
  - artifact: Black_Titan_S7_EP036-040_화별개요_v1.3_GateB승인.md
    action: KEEP
    reason: 역장 가시화나 음향 규정을 포함하지 않는다.

decision:
  status: APPLIED
  decided_at: 2026-08-02
