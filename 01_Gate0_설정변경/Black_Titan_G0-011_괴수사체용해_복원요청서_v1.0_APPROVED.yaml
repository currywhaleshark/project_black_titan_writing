request:
  id: G0-011
  title: 괴수 사체 용해 설정 복원
  revision: 1.0
  status: APPROVED
  approved_by: user
  approved_at: "2026-08-03"
  authority: current_user_correction
  change_type: old_canon_restoration
  origin: 2026-08-03 사용자 구술 — "구판에서는 파괴당한 후 세포를 결합하던 역장이 허물어지면서 물에 닿으면 붉게 녹아내리는 설정이었음. 그래서 회수 후 분석이 어려워지는 설정으로 이어졌고"

problem:
  - 구판의 괴수 사체 설정이 통합설정집 v2.3에 이관되지 않았다.
  - 그 공백 때문에 EP004 브리프 v0.2가 `사체는 깊은 수역으로 침몰, 봄에는 인양 불가`라는 임시 기본값을 만들었다. 본 요청서가 이를 대체한다.

restored_setting:
  principle: 괴수가 파괴되면 세포를 결합하던 역장이 허물어진다. 결합을 잃은 사체는 물에 닿는 자리부터 붉게 녹아내려 흩어진다.
  consequence:
    - 사체의 회수·보존·분석이 극도로 어렵다. 군이 확보할 수 있는 것은 용해 후 잔여물·영상 기록 수준이다.
    - 괴수의 생체 구조·기원에 대한 인류 측 정보 축적이 구조적으로 지연된다.
  consistency_check:
    - 통합설정집 v2.3 [651] 역장은 세포 표면에서 형성된다 — 죽음으로 역장이 꺼지면 결합이 풀린다는 인과가 기존 규칙의 자연스러운 연장이다.
    - 통합설정집 v2.3 [652] 동종 역장 접촉만 실제 손상을 준다 — 블랙 타이탄의 맨손 격파가 유일한 사체 발생 경로이므로, 용해는 사실상 블랙 타이탄 전과 직후에만 목격된다.
    - EP005 개요(군은 실패 보고 정리·기록만 수행)와 정합 — 사체 연구 축이 열리지 않는 이유가 설정으로 뒷받침된다.
    - 여름 마지막 전투의 `타이탄의 검붉은 순환액` 공개와 시각적으로 공명한다(같은 피 법칙의 복선). 봄에는 이 공명을 서술로 짚지 않는다.

narration_lock:
  - 본문은 현상만 보여 준다 — 죽은 괴수가 물에 닿은 자리부터 붉게 풀려 녹아 흩어진다. **원인(역장 붕괴)은 가을 전까지 서술·명명·추정 금지**(G0-010 역장 비가시 원칙의 연장).
  - 용해는 죽음 확정 후에만 일어난다. 전투 중 부분 용해·출혈성 연출로 쓰지 않는다.
  - 색은 `붉게`까지만. 피·혈액·살점 등 생체 확정 어휘를 붙이지 않는다. 등장인물은 그것이 무엇인지 모른다.
  - 군·시민에게는 `괴수의 사체가 물에서 붉게 녹아 사라졌다`는 관측 사실만 공개된다.

terminology_correction:
  - term: 역장
    wrong: "逆場, Reverse Field — 통합설정집 v2.3 [650]의 현행 표기"
    correct: "力場, Force Field"
    decided: "2026-08-03 사용자 정정"
    note: 본문은 한글 `역장`만 쓰므로 승인 원고에는 영향이 없다. v2.4 개정 시 한자·영문 병기를 교정한다.

affected_artifacts:
  - artifact: Project_Black_Titan_통합설정집_v2.3.docx
    action: REVISE
    replacement: Project_Black_Titan_통합설정집_v2.4.docx
    reason: 역장·괴수 항목에 사체 용해를 추가한다. G0-007~010과 같은 회차에 처리한다.
  - artifact: Black_Titan_G0-008_바닷가재형회수개체_외형확정_변경요청서_v0.1.yaml
    action: KEEP
    reason: 외형 확정과 충돌 없음. 사체 거동은 본 요청서가 담당한다.
  - artifact: Black_Titan_EP004_회차브리프_v0.2_GateC후보.md
    action: REVISE
    replacement: Black_Titan_EP004_회차브리프_v0.3_GateC후보.md
    reason: 사체 침몰 기본값을 용해로 교체하고, 용해 목격을 공개 정보에 반영한다.

decision:
  status: APPLIED
  decided_at: "2026-08-03"
