문서ID: G0-013
제목: 지상↔격납고 사람 동선 — 계단에서 승강기로
버전: v1.0
상태: APPROVED
승인: 2026-08-15 사용자 — "깊이가 못해도 20층은 될텐데 처음부터 승강기를
  설치해두는게 나았겠다 / 앞에것도 수정해야겠지만"
발견_경위: EP62 초고 첨삭. 필자가 격납고 하강을 "계단 열두 칸"으로 써서
  깊이 정본과 충돌한 것을 사용자가 지적하는 과정에서, 계단 자체가
  물리적으로 성립하지 않는다는 점이 드러났다.

문제:
  - LOC-05 정본은 "철문 뒤 계단은 일반 주택 지하실보다 훨씬 깊게
    내려간다"였다. 그러나 격납고는 대형 기체가 직립하는 옛 차량기지이며
    지상에서 **못해도 20층 깊이**다.
  - 20층을 매번 걸어 오르내리는 동선은 성립하지 않는다. 특히 출격 직전과
    귀환 직후의 반복 이동, 그리고 왼팔이 결손된 영진의 일상 동선에서
    무리가 크다.
  - LOC-02 §2.3에는 이미 **열쇠식 호출·층 조작부가 달린 사람용 승강기**가
    있었다(바닥 → 가슴 높이 정비 갑판). 층 조작부가 있다는 것 자체가
    정거장이 둘 이상임을 함의하고 있었다.

결정:
  주동선: 승강기
  구조: 같은 승강기가 **철문 층 · 격납고 바닥 · 정비 갑판**의 세 정거장을
    운행한다. 새 설비를 들인 것이 아니라 **옛 차량기지가 남긴 것**이며,
    LOC-02 §2.3의 승강기와 동일 계통이다.
  비상계단: 통로 옆에 병존한다. 법적·구조적으로 있어야 하는 물건이다.
    지면 노출 0 — 정전·고장 국면이 오기 전까지 쓰지 않는다.
  은폐: 내려가는 데 시간이 걸리고 그동안 위쪽 소리가 끊긴다.
    은폐의 실질이 문이 아니라 **거리**에 있다는 점은 그대로다.

부수효과:
  - "계단은 몇 칸인지 세게 되지만 승강기는 얼마나 깊은지 모른다."
    깊이를 감추는 쪽이 이 시설의 성격에 맞는다.
  - EP1의 "계단은 열두 번째부터 세지 않았다"는 등(燈)을 세다 그만두는
    쪽으로 옮겨 원래 효과를 보존했다.
  - EP57의 깊이 서술은 "걸리는 시간으로 깊이를 짐작한다"가 되어 오히려
    선명해졌다.
  - 자재 반입구(LOC-02 §2.2-B)는 대형 화물 전용으로 **변동 없다.**

수정_범위:
  시각바이블:
    - LOC-05 §지하 출입 — 계단 항목 전면 교체, 비상계단 병존 명기
    - LOC-02 §2.2-B — "계단 하나 원칙" 문구 제거, "사람과 공구는 승강기로"
    - LOC-02 §2.3 — 승강기 기점을 철문 층으로, 비상계단 추가
  승인_본문_7건_5화:
    - EP001 x2 — 첫 하강. "철문 뒤는 계단이 아니라 승강기였다" + 등 세기
    - EP005 x1 — "계단을 오르는 발소리" → "승강기가 올라가는 소리"
    - EP037 x1 — "내려가는 계단에서" → "내려가는 승강기 안에서"
    - EP045 x1 — "계단을 올라 철문을 밀자" → "승강기에서 내려 철문을 밀자"
    - EP057 x2 — 깊이 서술 재작성 + "올라오는 승강기에서"
  작업중:
    - EP062 초고 Scene 3 — 하강 문단 재작성

검증:
  지하동선_계단_잔존: 0건 (EP1의 "계단이 아니라 승강기였다"는 의도된 부정문)
  기타_계단_유지: 학교·버스·집 계단 41건은 무관하므로 손대지 않았다

후속_규칙:
  - 앞으로 지상↔격납고 이동은 **승강기**로 쓴다.
  - 비상 계단을 쓰는 장면은 **정전·고장 국면에서 한 번만** 값이 있다.
    쓸 때까지 지면에 존재를 알리지 않는다.
