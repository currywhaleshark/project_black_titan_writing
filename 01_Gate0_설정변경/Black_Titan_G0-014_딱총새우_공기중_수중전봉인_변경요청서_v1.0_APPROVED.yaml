문서ID: G0-014
제목: 딱총새우형 공기 중 전환 · 실제 피해 0 · 수중전 봉인(가을까지)
버전: v1.0
상태: APPROVED
승인: 2026-08-16 사용자
발견_경위: EP63 승인 후 EP64 예고를 보다가, 개요의 딱총새우형이 "물속에
  공동을 만든다"로 되어 있는 것을 사용자가 지적.

결정_1_공기중:
  전: "집게를 닫아 물속에 공동을 만든다"
  후: "집게를 닫아 압축된 공기를 쏜다 — 공기 중"
  유지: 소리와 빛이 먼저 오고 충격이 나중에 온다(순서 역전)
  강화: 충격량은 성게형 때보다 훨씬 크게

결정_2_실제_피해_0:
  근거: 성게형 계보. EP10 지면에서 가시는 "긁고 간 골이 겉보기보다 깊어서
    메우고 갈아 내야" 했지만 기능에는 닿지 못했다.
  내용: 딱총새우형의 충격파도 타이탄에 유효 피해를 주지 못한다.
  ★핵심: 그 사실을 **단아도 모르고 독자도 모른다.**
    이 화에서 알려 주지 않는다. 무섭게 쓰고 결과만 멀쩡하게 둔다.
  효과: 이 화의 공포는 피해가 아니라 **예고**다 —
    붙기도 전에 맞는다는 것, 그리고 저것이 나를 노리고 왔다는 것.
  금지: 무해 판정 / 안심하는 대사 / 손상이 없다는 점의 명시적 강조.
    정비 장면은 평소처럼 쓴다(닦고 갈아 내는 일은 그대로 있다).

결정_3_수중전_봉인:
  범위: S10~S12 — **가을 전까지 수중전 0**
  작가용_이유: 가을에 **앵커의 로켓이 수중에서 점화되지 않는다**는 한계가
    드러나야 하고, 그것이 **신무기 개발로 이어지는 축**이다.
    여름에 물속 교전을 하면 그 카드가 미리 소모된다.
  허용: 갯벌 / 천수(허벅지~가슴 수심) / 수몰 시가지의 물 빠진 시간 /
    방조제 안쪽 얕은 물 — **S9 선례 그대로**
  금지: 잠수 / 완전 침수 / 수중 기동 / 수면 아래에서의 교전
  파급: **갑오징어형(EP73)도 예외가 아니다.** 은신은 흐린 물과 구조물로
    성립시키고 상반신은 물 위에 둔다.
  파급2: 공작갯가재형(EP70)의 "물속에서 소리가 먼저 온다" 삭제 →
    "소리가 먼저 오고 몸이 나중에 안다"

수정_범위:
  - S10 화별개요 v1.0 → **v1.1**(§1-F 봉인 7 신설 · §2 딱총새우형 재작성 ·
    공작갯가재형 1행)
  - standing-guards · 선례대장 등재
  - EP63 Gate-E의 다음 작업 절 갱신

후속_규칙:
  - 전투 개체를 설계할 때 **전장 수심을 먼저 정한다**(전장 구조 6+1 선확정).
    천수를 넘으면 그 자체로 봉인 위반이다.
  - 가을 진입 시 이 봉인을 **해제하고 그때 한 번만 크게 쓴다.**
