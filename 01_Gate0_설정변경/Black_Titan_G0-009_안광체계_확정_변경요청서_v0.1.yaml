request:
  id: G0-009
  title: 계통별 안광 색 체계 확정
  revision: 1.0
  status: APPROVED
  approved_by: user
  approved_at: 2026-08-02
  authority: current_user_correction
  change_type: series_wide_visual_lock
  origin: 2026-08-02 사용자 지시 — "괴수들은 녹빛 안광을 공통적으로 가짐, 블랙 타이탄은 주홍빛, 화이트 센티널은 푸른빛"
  scope_note: G0-008(바닷가재형 외형 확정)보다 상위다. 개별 괴수 설계가 아니라 전 시리즈에 걸친 시각 규칙이므로 별도 요청서로 분리한다.

problem:
  - 안광 색 체계는 작가의 구상에만 있었고 어느 승인 문서에도 규칙으로 기록되지 않았다.
  - 통합설정집 v2.3은 블랙 타이탄에만 안광을 적었고, 괴수와 화이트 센티널에는 안광 항목이 아예 없다.
  - 그 결과 G0-008 초안이 바닷가재형을 `눈이 없다`로 잘못 확정했다. 본 요청서가 이를 바로잡는다.

existing_canon:
  - 통합설정집 v2.3 [704] "두꺼운 흑색 장갑, 거대한 어깨, 주황빛 안광, 무표정한 해골형 두부"
  - 통합설정집 v2.3 [966] "블랙 타이탄: 무광에 가까운 검은 장갑과 주황빛 눈. 움직일 때만 생물적인 유연함이 드러난다."
  - S1 EP001~006 화별개요 v3.7 및 EP001·EP002 승인 본문에는 안광 언급이 없다.
  - EP002 승인 본문은 정지 상태의 블랙 타이탄을 "얼굴에는 표정이 없었다. 검은 장갑 사이의 가느다란 선만 빛을 받아 드러났다"로 서술한다. 발광이 아니라 반사다.

proposed_lock:
  principle: 안광은 계통을 구분하는 유일한 육안 표지다. 등장인물은 색이 다르다는 것만 볼 수 있고, 그 차이가 계통에서 온다는 사실은 계속 봉인한다.
  colors:
    - subject: 외계세포 기원 괴수 전반
      color: 녹빛
      form: 갑각의 이음매나 함몰부에서 나오는 발광부. 개체마다 위치와 수가 다를 수 있다.
      note: 인큐베이터 계통의 공통 특징이다. 개체 종류가 달라도 색은 같다.
    - subject: 블랙 타이탄
      color: 주황빛
      form: 무표정한 해골형 두부의 안와에서 나온다.
      basis: 통합설정집 v2.3 [704][966]과 2026-08-02 사용자 확정이 일치한다.
    - subject: 화이트 센티널
      color: 푸른빛
      form: 슬릿형 눈. 가로로 길게 갈라진 틈에서 푸른빛이 새어 나오는 슬릿 발광이다.
      note: 통합설정집 v2.3에 안광 항목이 없으므로 신설이다.
  form_contrast:
    note: 세 계통은 색뿐 아니라 눈의 형태로도 구분된다. 블랙 타이탄은 해골형 안와, 화이트 센티널은 슬릿, 괴수는 갑각 사이의 발광부다.
    use: 나중에 세 기체가 같은 화면에 놓일 때 색과 형태가 함께 대비를 만든다. 봄에는 블랙 타이탄과 괴수만 등장한다.
  exception:
    rule: 시각기관이 없는 개체에는 안광이 없다. 안광의 유무 자체가 그 개체에 시야가 있는지를 알려준다.
    cases:
      - subject: 군부형 포박·운반개체
        treatment: 안광 없음. 외형 서술에서 눈·안광을 다루지 않는다.
        basis: S7 EP036~040 화별개요 v1.3 `GATE_B_PASS` — "모티프는 유지하되 눈·머리 방향·독자 판단이 없는 포박·운반판으로 역할을 더 제한", "군부형의 무시야성과 바다나리형의 시각기관 역할을 한 문장 안에서 더 선명하게 대비"
      - subject: 바다나리형 고지 탐색·지정개체
        treatment: 안광 있음. 녹빛.
        basis: 동일 문서에서 시각기관 담당 개체로 규정된다. "바다나리형은 본다. 군부형은 간다."
    note: 봄 마지막 전투의 `본다 / 간다` 대비가 안광의 유무로도 읽히게 되어 S7의 연출 의도가 강화된다.

first_appearance:
  black_titan:
    when: EP003 기동 순간
    reason: EP002 승인 본문에서 블랙 타이탄은 정지 상태였고 얼굴의 선은 작업등을 반사했을 뿐이다. 안광이 처음 켜지는 것은 EP003의 기동이다.
    viewpoint_limit: 단아는 조종석 안에 있어 자기 기체의 안광을 볼 수 없다. 안광은 영진·수아의 시점, 군의 관측 영상, 시민의 목격으로만 제시한다.
  contrast_use:
    where: EP003 Scene 2 고명준 시점
    what: 관측 영상에서 괴수의 녹빛과 미식별 거인의 안광 색이 다르다는 사실만 확인된다.
    limit: 색이 다르다는 관찰까지만이다. 계통·기원·소속에 대한 추론이나 해설로 넘어가지 않는다.

prohibited:
  - 안광의 색차가 계통·기원·역장 원리를 뜻한다고 서술자가 설명하는 것.
  - 안광의 밝기·색조 변화로 괴수나 기체의 감정·의도를 표현하는 것. 무표정 원칙을 유지한다.
  - 안광을 조명·탐조등처럼 주변을 비추는 기능으로 쓰는 것.
  - 군부형에 눈·안광·시선 방향을 부여하는 것.
  - 봄 시점에 화이트 센티널의 안광을 노출하는 것. 첫 등장은 여름 마지막 전투다.

affected_artifacts:
  - artifact: Project_Black_Titan_통합설정집_v2.3.docx
    action: REVISE
    replacement: Project_Black_Titan_통합설정집_v2.4.docx
    reason: 안광 체계를 규칙으로 신설하고, 블랙 타이탄 항목의 색 표기를 확정값으로 통일한다. G0-007·G0-008과 같은 회차에 처리한다.
    note: 정사 원문 개정이므로 사용자 승인과 별도 작업이 필요하다.
  - artifact: Project Black Titan 전체 플롯 v2.2.docx
    action: KEEP
    reason: 아크·공개선에 영향이 없다.
  - artifact: Black_Titan_G0-008_바닷가재형회수개체_외형확정_변경요청서_v0.1.yaml
    action: REVISE
    replacement: 동 문서 v0.2
    reason: "`눈이 없다`는 확정을 철회하고 녹빛 안광으로 교체한다."
  - artifact: Black_Titan_S7_EP036-040_화별개요_v1.3_GateB승인.md
    action: KEEP
    reason: 군부형 무시야성과 바다나리형 시각기관 규정이 본 체계와 이미 일치한다. Gate B 재승인 불필요.
  - artifact: Black_Titan_EP001_1화_벚꽃과사이렌_v1.0_GateD승인.md
    action: KEEP
    reason: 안광 언급이 없다. 단아 밀착 시점이라 자기 기체의 안광이 보이지 않는 것과도 일치한다.
  - artifact: Black_Titan_EP002_2화_격납고_v1.0_GateD승인.md
    action: KEEP
    reason: 정지 상태의 반사 묘사이므로 기동 시 점등과 모순되지 않는다. 오히려 EP003의 첫 점등을 대비로 살린다.
  - artifact: Black_Titan_EP003_회차브리프_v1.2_GateC후보.md
    action: REVISE
    replacement: 동 문서 v1.3
    reason: 기동 시 첫 점등, Scene 2의 색 대비 관찰, 단아 시점의 관측 한계를 반영한다.

decision:
  status: APPLIED
  decided_at: 2026-08-02
  resolved:
    - 블랙 타이탄 안광 색: 주황빛으로 확정 (2026-08-02 사용자). 현행 정사 표기와 일치하므로 통합설정집의 색 표기 수정은 불필요하며, 안광 체계 규칙 신설만 남는다.
    - 화이트 센티널: 푸른빛 슬릿 발광으로 확정 (2026-08-02 사용자).
