request:
  id: G0-008
  title: 바닷가재형 회수개체 외형·규모 확정
  revision: 1.0
  status: APPROVED
  approved_by: user
  approved_at: 2026-08-02
  supersedes_note:
    - v0.1은 눈을 `없음`으로 잘못 확정했다. 2026-08-02 사용자 정정에 따라 녹빛 안광으로 교체했다. 안광 체계 자체는 상위 요청서 G0-009가 규정한다.
    - v0.2는 역장을 `아지랑이 같은 막`으로 가시화했다. 2026-08-02 사용자 정정에 따라 철회한다. 역장 비가시성과 음향은 상위 요청서 G0-010이 규정한다.
  authority: current_user_correction
  change_type: creature_design_lock
  origin: 2026-08-02 사용자 지시 — "적 바닷가재 기계괴수의 모습도 부분부분으로만 설명되어 있어서 한번 머릿속에 그려볼 수 있는 설명이 있으면 좋겠다"

problem:
  - 통합설정집 v2.3의 규정은 "첫 괴수로 고정. 갑각과 집게를 가진 묵직한 상륙 개체. 첫 맨손격투의 상징." 한 줄뿐이다.
  - 승인 본문 EP001에서 확정된 것은 집게의 마디, 집게 안쪽의 톱니, 젖은 껍질, 바닷물이 떨어지는 상태뿐이다.
  - 전체 실루엣·크기·다리 수·색·질감이 없어 본문에서 매번 부분만 잡히고 독자가 한 마리로 그리지 못한다.
  - 초고 v0.1·v0.2에서 쓴 `검붉은 등껍질`, `아지랑이 같은 막`은 NONCANON 초고의 임의 표현이며 승인된 적이 없다.

existing_canon_kept:
  - 통합설정집 v2.3 [780] 갑각과 집게를 가진 묵직한 상륙 개체. 첫 맨손격투의 상징.
  - 통합설정집 v2.3 [832] 괴수는 비전투형 회수개체가 중심이며, 블랙 타이탄은 무장 없이 싸운다.
  - 통합설정집 v2.3 [651] 역장은 탄도·열·폭발·방사선을 실질적으로 막지만 운동량과 압력은 전달된다.
  - 통합설정집 v2.3 [652] 동종 역장끼리는 간섭·중화가 일어나 실제 손상을 주고받는다.
  - EP001 승인 본문 — 집게의 마디, 안쪽의 굵은 톱니, 젖은 껍질, 떨어지는 바닷물.

proposed_design_lock:
  id: LOBSTER_RETRIEVAL_01
  silhouette: 심해에서 올라온 거대 갑각류. 몸을 낮게 깔고 앞으로 나아가는 묵직한 실루엣. 사람 형태인 블랙 타이탄과 정반대의 실루엣으로 대비를 만든다.
  scale:
    body_length: 약 70m — 큰 집게 끝에서 꼬리 끝까지
    back_height: 약 30m — 등껍질 가장 높은 지점
    claw_length: 큰 집게 약 25m
    comparison: 블랙 타이탄(52m)이 더 높다. 괴수는 더 길고 더 무겁다. 정면 힘겨루기에서 단아가 지는 이유가 여기서 나온다.
    note: 수치는 작가용 기준이며 본문에서 숫자로 해설하지 않는다.
  carapace:
    color: 젖은 검붉은색. 마른 곳은 탁하고 젖은 곳은 검게 번들거린다.
    surface: 따개비, 물때, 끊어진 해조가 이음매마다 붙어 있다. 오래 물속에 있던 것이 방금 올라왔다는 인상을 준다.
    texture: 매끈한 기계가 아니라 여러 겹으로 포개진 판. 판과 판 사이에 어두운 이음매가 드러난다.
  claws:
    count: 2
    asymmetry: 좌우 비대칭. 한쪽은 굵고 뭉툭한 분쇄형, 다른 쪽은 가늘고 긴 집는 형이다.
    detail: 마디가 세 단으로 접히고, 안쪽에 굵은 톱니가 어긋나게 박혀 있다. EP001 승인 본문과 일치한다.
    function_note: 무기로 설계된 것이 아니라 회수·운반용 도구다. 전투에 쓰이는 것은 전용이 아니라 전용(轉用)이다. 이 사실은 작가용이며 봄에 설명하지 않는다.
  legs:
    count: 좌우 네 쌍, 총 여덟
    motion: 같은 박자로 움직이지 않는다. 어느 쪽이 먼저 바닥을 미느냐에 따라 몸통이 기우는 방향이 결정된다.
    note: 단아가 `집게 끝이 아니라 뿌리와 체중 이동을 읽는다`는 학습의 관찰 대상이다.
  antennae: 굵고 긴 한 쌍이 앞으로 뻗어 있다. 진행 방향을 향해 천천히 움직인다. 탐색파와의 관계는 봉인한다.
  eyes:
    color: 녹빛. G0-009의 괴수 공통 안광이다.
    form: 갑각 앞면의 함몰부 안쪽에서 나오는 발광. 눈꺼풀도 흰자도 없어 크기와 위치만 있고 표정은 없다.
    behavior: 밝기가 일정하다. 감정·의도에 따라 흔들리거나 밝아지지 않는다. 시선이 향하는 방향은 읽히지만 그 이상은 읽히지 않는다.
    underwater: 물속에서는 갑각보다 안광이 먼저 보인다. 젖은 어둠 속에서 녹빛 점이 먼저 다가온다.
    note: 표정이 없다는 인상은 유지하되 `눈이 없다`고 쓰지 않는다. 소통 불가능성은 눈의 부재가 아니라 무표정한 발광에서 나온다.
  tail: 두껍고 넓은 부채꼴. 수중에서는 추진에, 지상에서는 균형에 쓴다.
  field:
    visible: false
    rule: 역장은 눈에 보이지 않는다. G0-010에 따라 가을 전까지 개념 자체를 서술하지 않는다.
    show_as_result_only:
      - 포탄과 폭발이 갑각에 닿아도 자국이 남지 않는다.
      - 충격으로 몸이 밀리거나 자세가 흐트러지지만 파괴는 일어나지 않는다.
      - 블랙 타이탄의 팔과 어깨는 반대로 실제 힘을 전달한다.
  sound:
    permitted: 쇠를 긁는 듯한 소리. 위협하거나 밀어낼 때, 그리고 단말마에 쓴다.
    prohibited: 포효·울부짖음 등 감정이 읽히는 발성, 소통 시도로 읽히는 소리, 매 공방마다 붙는 상시 효과음.
    note: 소리에 감정을 싣지 않는다. 쇠 긁는 소리는 의사 표현이 아니라 물성이다. 상세는 G0-010.
  locomotion:
    water: 다리와 꼬리로 나아간다. 몸의 대부분이 잠긴 채 등껍질과 집게만 수면 위로 드러난다.
    land: 몸을 낮게 깔고 여덟 다리로 밀듯이 전진한다. 방향 전환은 몸통을 좌우로 트는 방식이다.
    climbing: 집게를 걸고 다리로 벽면을 짚어 오를 수 있다. EP003 말미의 방재벽 등반이 여기에 해당한다.
  behavior:
    priority: 파괴나 추격보다 특정 방향으로 이동하는 것을 우선한다.
    combat: 가로막는 대상을 밀어내거나 치우려 할 뿐, 끝까지 쓰러뜨리려 하지 않는다.
    note: 실제 탐색·회수 임무는 계속 봉인한다. 독자는 행동만 본다.

prohibited:
  - 기계적 관절·구동음·계기류를 부여해 인공 병기처럼 보이게 하는 것. 외계세포 기원의 생물이다. 녹빛 안광은 계통 표지이며 기계 발광부가 아니다.
  - 눈맞춤, 포효, 위협 자세 같은 의사소통·감정 표현을 부여하는 것.
  - 안광의 밝기나 색조를 감정·의도의 신호로 쓰는 것.
  - 봄 시점에 회수 목적·계통·상쇄 원리를 외형으로 설명하는 것.
  - 크기·중량 수치를 본문에서 해설하는 것.
  - EP003에서 괴수에게 가시적 중상이나 기능상실을 남기는 것.

usage_rule:
  - 전체 외형은 EP003 Scene 1의 상륙 직후, 단아가 처음으로 괴수 전체를 한눈에 보는 자리에서 한 번 제시한다.
  - 그 뒤로는 다시 부분(집게, 뿌리, 다리, 등껍질)으로만 서술한다. 전신 묘사를 반복하지 않는다.
  - 고명준 시점에서는 관측 영상 너머의 실루엣과 크기 비교로만 제시한다.

